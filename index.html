{q:"What do the image pull errors mean?", d:`<table class="mini"><tr><th>Error message</th><th>Cause</th></tr><tr><td>not found / manifest unknown</td><td>Wrong name or tag, or the image was never pushed</td></tr><tr><td>401 / 403 / no basic auth credentials</td><td>No permission to the repository</td></tr><tr><td>i/o timeout / dial tcp</td><td>Node can’t reach the registry over the network</td></tr><tr><td>toomanyrequests</td><td>Registry rate limit (often Docker Hub)</td></tr><tr><td>no match for platform in manifest</td><td>Image built for the wrong CPU architecture</td></tr></table>`, e:`<code>manifest for ...:v1.4.2 not found</code> is a tag problem. <code>i/o timeout</code> is a network problem.`},
{sc:1, q:"Scenario 1: The rollout never finishes", open:`“We released version 1.4.2. The old pods are still running, but the new ones won’t start. What do you check?”`, steps:[
[`What’s the status of the new pods?`,`ImagePullBackOff, 0 restarts.`],
[`What does the event say exactly?`,`<code>Failed to pull image ".../orders:v1.4.2": not found</code>.`],
[`Does that tag exist in ECR?`,`<code>aws ecr describe-images</code> shows tag <code>1.4.2</code>, without the “v”.`],
[`Where does the tag in the manifest come from?`,`The pipeline writes it to the Helm values file. Someone changed the tagging step to add a “v”.`]],
diag:`<strong>ImagePullBackOff because the tag doesn’t exist.</strong> The manifest asks for <code>v1.4.2</code>, but the image was pushed as <code>1.4.2</code>.`,
proceed:`<ol class="steps"><li>No outage, since the old pods still serve traffic. The rollout is just blocked.</li><li>Fix the tag in the values file (or the pipeline step) so both use the same format, and commit it so Argo CD syncs.</li><li>Verify the new pods pull the image and become Ready.</li><li>Prevent: have the pipeline use the exact tag it pushed, and check it exists with <code>aws ecr describe-images</code> before updating Git.</li></ol>`},
{sc:1, q:"Scenario 2: Works in dev, fails in prod", open:`“The same image runs fine in the dev cluster, but in the prod account the pods won’t start.”`, steps:[
[`What’s the status in prod?`,`ImagePullBackOff, 0 restarts.`],
[`What’s the exact error?`,`<code>403 Forbidden</code> when pulling from the ECR repository.`],
[`Where does the repository live?`,`In the shared tools account. Dev and prod are separate AWS accounts.`],
[`Does the repository policy allow the prod account?`,`It only allows the dev account.`]],
diag:`<strong>ImagePullBackOff because of permissions.</strong> The ECR repository is in another account, and its policy doesn’t allow the prod account’s node role to pull.`,
proceed:`<ol class="steps"><li>Update the ECR repository policy to allow <code>ecr:BatchGetImage</code> and <code>ecr:GetDownloadUrlForLayer</code> for the prod account, through Terraform.</li><li>Confirm the prod node role has ECR read permissions (AmazonEC2ContainerRegistryReadOnly).</li><li>Verify the pods pull and start.</li><li>Prevent: manage repository policies in Terraform with every account that deploys the image.</li></ol>`},
{sc:1, q:"Scenario 3: The new private cluster can’t start anything", open:`“We built a new EKS cluster in private subnets for compliance. No application pods will start.”`, steps:[
[`What’s the pod status?`,`ImagePullBackOff everywhere, 0 restarts.`],
[`What’s the exact error?`,`<code>dial tcp ...: i/o timeout</code> when contacting the ECR endpoint.`],
[`How do the private subnets reach the internet or AWS services?`,`There’s no NAT Gateway. It’s supposed to be fully private.`],
[`Which VPC endpoints exist?`,`None for ECR yet.`]],
diag:`<strong>ImagePullBackOff because of the network path.</strong> The nodes have no route to ECR: no NAT, and no VPC endpoints.`,
proceed:`<ol class="steps"><li>Add VPC interface endpoints for <code>ecr.api</code> and <code>ecr.dkr</code>, plus an S3 gateway endpoint (ECR stores image layers in S3).</li><li>Make sure the endpoint security group allows HTTPS (443) from the nodes.</li><li>Verify pods pull and start.</li><li>Prevent: include the endpoints in the Terraform VPC module for every private cluster. This is standard in GovCloud-style environments.</li></ol>`},
{sc:1, q:"Scenario 4: Built on a Mac, fails on the cluster", open:`“A developer built and pushed a new image from their laptop. It runs on their machine, but not on the cluster.”`, steps:[
[`What’s the pod status?`,`ImagePullBackOff, 0 restarts.`],
[`What’s the exact error?`,`<code>no match for platform in manifest</code>.`],
[`What machine was it built on, and what are the nodes?`,`Built on an Apple Silicon Mac (arm64). The nodes are amd64.`]],
diag:`<strong>ImagePullBackOff because of the CPU architecture.</strong> The image only exists for arm64, and the nodes need amd64.`,
proceed:`<ol class="steps"><li>Rebuild with <code>docker buildx build --platform linux/amd64,linux/arm64</code> and push.</li><li>Verify the pods pull and start.</li><li>Prevent: build images only in CI, not on laptops, and always build multi-architecture images.</li></ol>`},
]},
{id:"http503", title:"Scenario: 503 errors", blurb:"Users see 503, but the pods may look fine. Study the guide, then practice tracing the path: load balancer, target group, Service, endpoints, readiness, ports.", items:[
{q:"What does a 503 mean?", d:`<strong>Service Unavailable.</strong> Something in front of the app (ALB, Ingress controller, or Istio’s Envoy) has <strong>no healthy backend</strong> to send the request to. The pods can be Running while users still get 503.`, e:`The ALB returns 503 because every target in its target group is unhealthy, even though <code>kubectl get pods</code> shows Running.`},
{q:"How will the interviewer describe it without naming it?", d:`<ul class="steps"><li>“The site shows Service Unavailable.”</li><li>“The pods are Running, but users can’t reach the app.”</li><li>“We get errors for a few seconds every time we deploy.”</li><li>“One path works, another one fails.”</li><li>“Service A can’t call Service B since we enabled the mesh.”</li></ul>`, e:`<strong>Pods look fine but users get errors</strong> is the classic 503 story.`},
{q:"Which questions do I ask, in order?", d:`<ol class="steps"><li><strong>Who returns it:</strong> “Is the 503 from the ALB, the Ingress controller, Istio, or the app itself?”</li><li><strong>Targets:</strong> “Are the targets in the target group healthy?”</li><li><strong>Endpoints:</strong> “Does <code>kubectl get endpoints &lt;svc&gt;</code> list pod IPs?”</li><li><strong>Selector:</strong> “Do the Service selector and pod labels match?”</li><li><strong>Readiness:</strong> “Are the pods READY 1/1?”</li><li><strong>Ports and path:</strong> “Do targetPort, containerPort, and the health check path match?”</li><li><strong>Change:</strong> “What changed right before?”</li></ol>`, e:`Follow the request from the outside in: <strong>DNS → ALB → target group → Service → endpoints → pod readiness → container port.</strong>`},
{q:"How do I tell 502, 503, 504, and 404 apart?", d:`<table class="mini"><tr><th>Code</th><th>Meaning</th></tr><tr><td><strong>503</strong></td><td>No healthy backend at all</td></tr><tr><td>502</td><td>Backend exists but gave a bad or broken response</td></tr><tr><td>504</td><td>Backend exists but took too long to answer</td></tr><tr><td>404</td><td>No routing rule matches the host or path</td></tr></table>`, e:`503 means “nobody to send it to.” 504 means “sent it, but no answer in time.”`},
{sc:1, q:"Scenario 1: Pods Running, site down", open:`“After a cleanup of our manifests, the site shows 503. But all the pods are Running and healthy.”`, steps:[
[`Who returns the 503, the ALB or the app?`,`The ALB.`],
[`Are the pods Ready, and does the Service have endpoints?`,`Pods are 1/1 Ready. <code>kubectl get endpoints web</code> shows <code>&lt;none&gt;</code>.`],
[`What’s the Service selector, and what are the pod labels?`,`Service selects <code>app: web</code>. The pods are now labeled <code>app: web-frontend</code>.`],
[`What was the cleanup?`,`Someone renamed the labels in the Deployment for consistency.`]],
diag:`<strong>503 because the Service has no endpoints.</strong> The selector no longer matches the pod labels, so the Service points to nothing, and the ALB has no healthy targets.`,
proceed:`<ol class="steps"><li>Users are down, so fix fast: update the Service selector to <code>app: web-frontend</code> (or revert the label change in Git).</li><li>Verify endpoints list the pod IPs, ALB targets go healthy, and the site loads.</li><li>Prevent: review label changes together with the Services that use them, and alert when a Service has zero endpoints.</li><li>Update the team.</li></ol>`},
{sc:1, q:"Scenario 2: All targets unhealthy", open:`“We deployed a new version behind the ALB. The app runs, but the load balancer says every target is unhealthy.”`, steps:[
[`Who returns the 503?`,`The ALB.`],
[`What does the target group show?`,`All targets unhealthy. Health checks failing.`],
[`What’s the health check path and port, and what does the app actually serve?`,`The health check calls <code>/health</code> on port 80. The new version serves <code>/healthz</code> on port 8080.`]],
diag:`<strong>503 because the health check doesn’t match the app.</strong> The ALB checks a path and port the app no longer answers, so it marks every target unhealthy.`,
proceed:`<ol class="steps"><li>Update the health check path and port (through the Ingress annotations or Terraform) to <code>/healthz</code> on 8080, or roll back the release.</li><li>Verify targets become healthy and traffic flows.</li><li>Prevent: add a pre-release check that confirms ports and health check settings match.</li></ol>This is the same kind of issue as my Accenture Federal Services incident, where the app listened on a different port than the health check expected.`},
{sc:1, q:"Scenario 3: 503s only during deployments", open:`“Every time we deploy, users get errors for about 10 to 30 seconds, then it’s fine again.”`, steps:[
[`What error do users get?`,`503 from the ALB.`],
[`Do the pods have readiness probes?`,`No readiness probe.`],
[`How does the rolling update work, and what happens when old pods stop?`,`Default rolling update. Old pods are killed right away while the ALB still sends them traffic.`]],
diag:`<strong>503 during rollouts.</strong> Without readiness probes, new pods get traffic before they’re ready, and old pods are stopped before the load balancer stops sending them requests.`,
proceed:`<ol class="steps"><li>Add a readiness probe so traffic only goes to ready pods.</li><li>Add a <code>preStop</code> sleep (for example 15 seconds) so the ALB finishes deregistering the pod before it shuts down.</li><li>Set the rolling update to <code>maxUnavailable: 0</code> and <code>maxSurge: 1</code>.</li><li>Verify with a test deploy while watching error rates in Datadog.</li><li>Prevent: make probes and preStop part of the standard Helm chart.</li></ol>`},
{sc:1, q:"Scenario 4: Service calls fail after enabling the mesh", open:`“We enabled Istio with strict mTLS. Now the reports service can’t call the orders service. Everything else works.”`, steps:[
[`What error does the reports service get?`,`<code>503 upstream connect error or disconnect/reset before headers</code>.`],
[`Do the reports pods have the Envoy sidecar? How many containers are in the pod?`,`The reports pods show 1/1. The other pods show 2/2.`],
[`Is sidecar injection enabled on the reports namespace?`,`No, that namespace is missing the injection label.`]],
diag:`<strong>503 because of mTLS without a sidecar.</strong> The orders service requires mTLS (STRICT), but the reports pods have no Envoy sidecar, so they can’t present a certificate and the connection is rejected.`,
proceed:`<ol class="steps"><li>Label the namespace with <code>istio-injection=enabled</code> and restart the reports Deployment so the sidecar is injected.</li><li>Verify the pods show 2/2 and the calls succeed.</li><li>Prevent: check sidecar injection on every namespace before switching to STRICT. Roll out mTLS in PERMISSIVE mode first.</li></ol>`},
]},

{id:"dns", title:"Scenario: DNS & service connectivity", blurb:"One service can’t reach another. Study the guide, then practice: which pod, which name, does DNS resolve, does the Service have endpoints, is anything blocking it?", items:[
{q:"What does a DNS or connectivity problem look like?", d:`Pods run fine, but calls between services fail. The error message tells you which layer: <strong>name not resolving</strong> is DNS, <strong>connection refused</strong> means nothing is listening at that address, and <strong>timeout</strong> usually means something is blocking the traffic.`, e:`Logs show <code>dial tcp: lookup payments: no such host</code>. The name doesn’t resolve, so it’s DNS, not the payments app.`},
{q:"How will the interviewer describe it without naming it?", d:`<ul class="steps"><li>“The frontend can’t reach the API.”</li><li>“It works from my laptop, but not from inside the cluster.”</li><li>“Calls between services fail since we added security policies.”</li><li>“Lookups fail randomly during peak hours.”</li></ul>`, e:`<strong>Service A can’t talk to Service B</strong> is the classic opening.`},
{q:"Which questions do I ask, in order?", d:`<ol class="steps"><li><strong>Exact error:</strong> “Is it ‘no such host’, ‘connection refused’, or a timeout?”</li><li><strong>Where from:</strong> “Which pod and namespace is calling, and which Service and namespace is it calling?”</li><li><strong>Test DNS:</strong> “From a debug pod, does <code>nslookup</code> resolve the name?”</li><li><strong>CoreDNS:</strong> “Are the CoreDNS pods in kube-system healthy?”</li><li><strong>Endpoints:</strong> “Does the target Service have endpoints?”</li><li><strong>Policies:</strong> “Is a NetworkPolicy blocking the traffic, or DNS on port 53?”</li></ol>`, e:`<pre><code>kubectl run debug --image=busybox -it --rm -- sh
nslookup payments.data.svc.cluster.local
wget -qO- http://payments.data.svc.cluster.local:8080/health</code></pre>`},
{q:"How do I read the error?", d:`<table class="mini"><tr><th>Error</th><th>Likely layer</th></tr><tr><td>no such host / could not resolve</td><td>DNS: wrong name, wrong namespace, CoreDNS, or port 53 blocked</td></tr><tr><td>connection refused</td><td>Name resolves, but no endpoints or wrong port</td></tr><tr><td>timeout</td><td>NetworkPolicy or security group blocking traffic</td></tr><tr><td>503 upstream connect error</td><td>Istio: mTLS or sidecar problem</td></tr></table>`, e:`Same symptom, “can’t reach the API,” but three different fixes depending on the error.`},
{sc:1, q:"Scenario 1: Frontend can’t find the API", open:`“We split our app into two namespaces. Now the frontend can’t reach the API. The API pods are healthy.”`, steps:[
[`What’s the exact error in the frontend logs?`,`<code>lookup api: no such host</code>.`],
[`Which namespaces are they in now?`,`Frontend is in <code>web</code>, the API moved to <code>backend</code>.`],
[`What name does the frontend call?`,`Just <code>http://api:8080</code>.`]],
diag:`<strong>DNS name problem.</strong> The short name <code>api</code> only resolves inside the same namespace. The API now lives in <code>backend</code>.`,
proceed:`<ol class="steps"><li>Change the frontend config to <code>api.backend.svc.cluster.local</code> (through the ConfigMap or Helm values).</li><li>Redeploy and verify from a debug pod in <code>web</code> that the name resolves and the API answers.</li><li>Prevent: always use the full service name in config for anything cross-namespace.</li></ol>`},
{sc:1, q:"Scenario 2: Everything broke after a security policy", open:`“The security team applied new NetworkPolicies to the payments namespace. Now nothing in that namespace can reach anything, not even the database.”`, steps:[
[`What error do the pods get?`,`Timeouts on everything, including name lookups.`],
[`From a debug pod in payments, does <code>nslookup</code> work?`,`No, it times out.`],
[`What do the new policies allow for egress?`,`A default-deny egress policy, plus one rule allowing traffic to the database on 5432.`]],
diag:`<strong>DNS blocked by a NetworkPolicy.</strong> Default-deny egress also blocks port 53 to CoreDNS, so pods can’t resolve any name, even the database’s. The database rule never gets a chance to work.`,
proceed:`<ol class="steps"><li>Add an egress rule allowing UDP and TCP port 53 to the CoreDNS pods in <code>kube-system</code>.</li><li>Verify <code>nslookup</code> works from the namespace and the app reaches the database.</li><li>Prevent: include a standard “allow DNS” rule in every default-deny policy template.</li></ol>`},
{sc:1, q:"Scenario 3: Random lookup failures at peak", open:`“During peak hours, different services randomly fail to resolve names. It fixes itself later.”`, steps:[
[`Which services, and what’s the error?`,`Many different services, with intermittent <code>i/o timeout</code> on DNS lookups.`],
[`How are the CoreDNS pods doing?`,`Only 2 replicas. At peak their CPU is maxed and they’re being throttled.`],
[`How much has traffic grown?`,`The cluster tripled in pods over the last few months.`]],
diag:`<strong>CoreDNS is overloaded.</strong> Two replicas can’t handle the lookup volume at peak, so some queries time out.`,
proceed:`<ol class="steps"><li>Scale CoreDNS (more replicas, or the cluster-proportional autoscaler) and give it enough CPU.</li><li>Consider NodeLocal DNSCache to cache lookups on each node.</li><li>Verify DNS errors disappear at the next peak.</li><li>Prevent: monitor CoreDNS latency and errors in Datadog or Prometheus.</li></ol>`},
]},
{id:"nodes", title:"Scenario: Node NotReady", blurb:"A node stops being healthy and its pods are affected. Study the guide, then practice: node conditions, kubelet, pressure, network, and what changed.", items:[
{q:"What does Node NotReady mean?", d:`The kubelet on that node stopped reporting healthy to the control plane. New pods won’t be scheduled there, and after about 5 minutes its pods are evicted and recreated on other nodes.`, e:`<code>kubectl get nodes</code> shows <code>NotReady</code>, and pods on that node show <code>Terminating</code> or <code>Unknown</code>.`},
{q:"How will the interviewer describe it without naming it?", d:`<ul class="steps"><li>“Several pods suddenly moved or restarted at the same time.”</li><li>“Some pods show Unknown status.”</li><li>“Only the pods on one machine are affected.”</li><li>“Pods are getting evicted.”</li></ul>`, e:`<strong>Many pods affected at once, all on the same node</strong> points to the node, not the apps.`},
{q:"Which questions do I ask, in order?", d:`<ol class="steps"><li><strong>Scope:</strong> “Is it one node or many? Same node group, same AZ?”</li><li><strong>Conditions:</strong> “What does <code>kubectl describe node</code> show: Ready, MemoryPressure, DiskPressure, PIDPressure?”</li><li><strong>Kubelet:</strong> “Is the kubelet running? What do its logs say?” (through SSM on EKS)</li><li><strong>Resources:</strong> “What’s the disk and memory usage on the node?”</li><li><strong>Network:</strong> “Can the node reach the API server?”</li><li><strong>Change:</strong> “Any new AMI, security group, or config change?”</li></ol>`, e:`<pre><code>kubectl get nodes -o wide
kubectl describe node &lt;node&gt;
kubectl top nodes
journalctl -u kubelet    # on the node, through SSM</code></pre>`},
{sc:1, q:"Scenario 1: Pods evicted from one node", open:`“Pods on one node keep getting evicted and moved. The other nodes are fine.”`, steps:[
[`What does <code>kubectl describe node</code> show in conditions?`,`<code>DiskPressure: True</code>.`],
[`What’s using the disk?`,`Lots of old container images and large container logs.`],
[`How big is the node’s disk?`,`20 GB, the default from an old launch template.`]],
diag:`<strong>Node under DiskPressure.</strong> The disk is almost full, so the kubelet evicts pods to protect the node.`,
proceed:`<ol class="steps"><li>Cordon the node, clean up unused images, or replace the node.</li><li>Fix: increase the root volume size in the Terraform node group config, and make sure log rotation is on.</li><li>Verify the new nodes stay Ready with no evictions.</li><li>Prevent: alert on node disk usage above 80%.</li></ol>`},
{sc:1, q:"Scenario 2: All new nodes are NotReady", open:`“After this morning’s infrastructure change, every new node joins as NotReady. The old nodes are fine.”`, steps:[
[`What does the kubelet log say on a new node?`,`Timeouts connecting to the cluster API endpoint.`],
[`What changed this morning?`,`A Terraform change to tighten the node security group.`],
[`Does the new security group allow the nodes to reach the control plane on 443?`,`No, that rule was removed.`]],
diag:`<strong>Nodes can’t reach the API server.</strong> The security group change removed the rule that lets kubelets talk to the control plane.`,
proceed:`<ol class="steps"><li>Restore the rule allowing nodes to reach the cluster API on 443, through Terraform.</li><li>Verify new nodes become Ready and pods schedule on them.</li><li>Prevent: review security group plans carefully, and test node group changes in staging first.</li></ol>`},
{sc:1, q:"Scenario 3: Evicted for low memory", open:`“Pods keep getting evicted with a message about the node running low on memory. Which pods get hit changes each time.”`, steps:[
[`What’s the exact eviction message?`,`<code>The node was low on resource: memory</code>.`],
[`Do the pods have memory requests and limits?`,`Several pods have none at all.`],
[`What does <code>kubectl top nodes</code> show?`,`Memory near 95% on those nodes.`]],
diag:`<strong>Node MemoryPressure.</strong> Pods without requests or limits can use as much memory as they want, overload the node, and the kubelet evicts pods to recover.`,
proceed:`<ol class="steps"><li>Set memory requests and limits on every workload, based on real usage.</li><li>Add a LimitRange in the namespace so new pods get defaults.</li><li>Verify evictions stop and node memory stays stable.</li><li>Prevent: policy (for example Gatekeeper) that rejects pods without limits.</li></ol>`},
]},
{id:"rollout", title:"Scenario: Stuck rollouts & readiness", blurb:"The new version is running but never becomes ready, or the release itself is stuck. Study the guide, then practice: rollout status, readiness, probes, dependencies, rollback.", items:[
{q:"What does a stuck rollout look like?", d:`The new pods are Running but show <strong>READY 0/1</strong>, so Kubernetes won’t continue the rolling update. The old pods keep serving traffic. After the progress deadline, the Deployment reports <code>ProgressDeadlineExceeded</code>.`, e:`<code>kubectl rollout status deployment/orders</code> keeps waiting: <code>1 of 3 updated replicas are available</code>.`},
{q:"How will the interviewer describe it without naming it?", d:`<ul class="steps"><li>“The deploy has been running for 20 minutes.”</li><li>“The new pods are Running, but the pipeline says the deploy failed.”</li><li>“Helm says another operation is in progress.”</li><li>“Everything was healthy, then all pods became unavailable at once.”</li></ul>`, e:`<strong>Running but not ready</strong> is the key phrase.`},
{q:"Which questions do I ask, in order?", d:`<ol class="steps"><li><strong>Rollout:</strong> “What does <code>kubectl rollout status</code> say?”</li><li><strong>Ready:</strong> “Are the new pods Running but 0/1 READY?”</li><li><strong>Events:</strong> “Does <code>describe pod</code> show ‘Readiness probe failed’, and with what error?”</li><li><strong>Probe config:</strong> “Which path and port does the probe check?”</li><li><strong>Dependencies:</strong> “Does the readiness check depend on something else, like the database?”</li><li><strong>Rollback:</strong> “Can we roll back while we investigate?”</li></ol>`, e:`<pre><code>kubectl rollout status deployment/orders
kubectl get rs                        # old vs new ReplicaSet
kubectl rollout undo deployment/orders
helm history orders
helm rollback orders 12</code></pre>`},
{sc:1, q:"Scenario 1: New version never becomes ready", open:`“We deployed a new version. The new pods are Running, but the rollout never finishes and the pipeline times out.”`, steps:[
[`What’s the READY column for the new pods?`,`0/1.`],
[`What do the events say?`,`<code>Readiness probe failed: HTTP probe failed with statuscode: 404</code>.`],
[`Which path does the probe check, and did the app change?`,`The probe checks <code>/health</code>. The new version moved it to <code>/api/health</code>.`]],
diag:`<strong>Stuck rollout from a wrong readiness probe.</strong> The app is fine, but the probe checks a path that no longer exists, so the pods never become ready. Old pods keep serving, so users aren’t affected.`,
proceed:`<ol class="steps"><li>Update the probe path in the Helm values to <code>/api/health</code>, or keep <code>/health</code> in the app.</li><li>Redeploy and verify with <code>kubectl rollout status</code> that it completes.</li><li>Prevent: define the health path once in the chart and test probes in staging.</li></ol>`},
{sc:1, q:"Scenario 2: All pods unavailable at once", open:`“Nothing was deployed, but suddenly every pod of the orders service became unavailable and users get 503.”`, steps:[
[`Are the pods restarting, or just not ready?`,`Running, no restarts, but READY 0/1 on all of them.`],
[`What does the readiness endpoint check?`,`It checks the app and also runs a query against the database.`],
[`How is the database doing?`,`Slow queries right now because of a heavy report job.`]],
diag:`<strong>Readiness probe tied to a dependency.</strong> The database got slow, every readiness check failed at the same time, and Kubernetes removed every pod from the Service. A slow database became a full outage.`,
proceed:`<ol class="steps"><li>Mitigate: stop or move the report job to bring the database back.</li><li>Fix: make readiness check only the app itself, and handle database slowness inside the app with timeouts and retries.</li><li>Verify pods stay ready during database slowness.</li><li>Prevent: review probes so they never depend on shared systems.</li></ol>`},
{sc:1, q:"Scenario 3: Helm release is stuck", open:`“Our pipeline’s Helm deploy failed halfway. Now every new deploy fails with ‘another operation is in progress’.”`, steps:[
[`What does <code>helm status</code> show?`,`<code>STATUS: pending-upgrade</code>.`],
[`What does <code>helm history</code> show?`,`Revision 12 deployed fine. Revision 13 is stuck in pending-upgrade.`],
[`Is anything still running the upgrade?`,`No, the pipeline job was cancelled.`]],
diag:`<strong>Helm release stuck in pending-upgrade.</strong> The upgrade was interrupted, so Helm thinks it’s still running and blocks new deploys.`,
proceed:`<ol class="steps"><li>Roll back to the last good revision: <code>helm rollback orders 12</code>.</li><li>Check the pods are healthy on revision 12, then rerun the deploy.</li><li>Prevent: use <code>helm upgrade --install --atomic --timeout 5m</code> so a failed upgrade rolls back automatically, and don’t let pipelines cancel mid-deploy.</li></ol>`},
]},

{id:"terraform", title:"Terraform", blurb:"Terraform builds the house.", items:[
{q:"What is Terraform?", d:`Infrastructure as Code. It provisions and manages infrastructure through code instead of clicking in a console.`, e:`A <code>aws_s3_bucket</code> resource in a .tf file, run <code>terraform apply</code>, and the bucket exists. Delete it from the code and Terraform removes it.`},
{q:"What is your Terraform workflow?", d:`Write or update code, <code>init</code>, <code>fmt</code> and <code>validate</code>, <code>plan</code>, review, <code>apply</code> after approval. State lives in S3 with DynamoDB locking. In CI/CD, GitHub Actions runs the same steps in a controlled, auditable way.`, e:`A pull request runs <code>terraform plan</code> and posts it for review. After merge, the pipeline runs <code>terraform apply</code>. When an environment isn’t needed, <code>terraform destroy</code>.`},
{q:"What is Terraform state?", d:`The state file is Terraform’s record of the infrastructure it manages. It tracks each resource and its attributes so Terraform knows what exists and what to change.`, e:`If state says an instance is <code>t3.small</code> and the code says <code>t3.medium</code>, the plan shows an update for that one instance.`},
{q:"Why use remote state?", d:`Storing state in a shared backend like S3 lets the team collaborate and keeps state safe if a laptop dies. DynamoDB locking stops two people changing it at the same time.`, e:`If a teammate is running apply, my apply waits with “Error acquiring the state lock” instead of corrupting the state.`},
{q:"What happens if the state file is lost?", d:`Terraform loses its record. The resources still exist in AWS, but Terraform no longer knows it manages them.`, e:`Restore it from S3 versioning, or run <code>terraform import aws_instance.web i-0abc123</code> to bring each resource back under management.`},
{q:"What are modules?", d:`Reusable collections of Terraform resources. Write once, reuse across environments.`, e:`An EKS module creates the cluster, node groups, IAM roles, and security groups. Dev and prod both call it with different variables.`},
{q:"Shouldn’t the root module (dev) be at the root of the repo?", d:`Often, yes. I used an environments pattern instead so the modules are reusable across dev, staging, and prod without duplicating code.`, e:`<code>terraform/environments/dev/</code> today. Adding prod later is just <code>terraform/environments/prod/</code> calling the same modules with different values.`},
{q:"Variable declaration vs definition?", d:`A declaration defines the variable’s type and description. A definition assigns its value, usually in tfvars.`, e:`<code>variable "region" { type = string }</code> is the declaration. <code>region = "us-gov-west-1"</code> in dev.tfvars is the definition.`},
{q:"Variables vs locals?", d:`Variables are inputs from outside (tfvars, env vars, user input). Locals are values computed inside Terraform to avoid repetition.`, e:`<code>locals { name = "\${var.project}-\${var.env}" }</code>, then every resource uses <code>local.name</code>.`},
{q:"for_each vs count?", d:`count makes N identical resources. for_each makes resources with stable names from a map or set. I usually prefer for_each because it avoids index shifting.`, e:`With count, removing the first of three buckets renumbers the others and Terraform tries to replace them. With for_each keyed by name, only that one bucket is removed.`},
{q:"What is versions.tf?", d:`It defines the required Terraform and provider versions.`, e:`<code>required_providers { aws = { source = "hashicorp/aws", version = "~> 5.0" } }</code>`},
{q:"Why use ~> 5.0?", d:`It allows safe minor upgrades while blocking unexpected major versions.`, e:`5.40 and 5.81 are allowed. 6.0 is not, so a breaking release can’t sneak in.`},
{q:"plan vs apply vs destroy?", d:`plan shows the diff without changes. apply executes it. destroy removes everything in that state. Always review plan first.`, e:`Plan says <code>1 to add, 0 to change, 1 to destroy</code>. An unexpected destroy is exactly what the review catches.`},
{q:"How do you handle secrets in Terraform?", d:`Never hardcode them. Read them from Secrets Manager or SSM Parameter Store, and mark variables <code>sensitive = true</code> so they’re hidden in output (that’s output hygiene, not real security).`, e:`A data source reads the DB password from Secrets Manager at apply time, and the value never appears in the code or the plan output.`},
{q:"Workspaces vs separate state per environment?", d:`Workspaces reuse one configuration with different state. Many teams prefer separate state files or folders per environment for stronger isolation.`, e:`Separate <code>envs/dev</code> and <code>envs/prod</code> with separate backends means a mistake in dev can’t touch prod state.`},
{q:"Tie Terraform back to your project.", d:`Terraform was the foundation of the pipeline. It provisioned the EKS cluster, VPC, ECR repo, and the IAM roles for GitHub Actions OIDC. Argo Workflows, ArgoCD, and Istio were all deployed on top of what Terraform stood up.`, e:`If Terraform isn’t applied first, there’s no cluster for ArgoCD and no role for the pipeline to assume.`},
]},

{id:"gitops", title:"CI/CD, ArgoCD & GitOps", blurb:"Git is the source of truth.", items:[
{q:"What is GitOps?", d:`Git is the source of truth for the desired state. An operator like ArgoCD syncs Git to the cluster and fixes drift. Every change is auditable and rollback is a git revert.`, e:`To roll back a bad release, revert the commit that changed the image tag. ArgoCD deploys the previous version.`},
{q:"What is ArgoCD?", d:`A GitOps continuous delivery tool that keeps Kubernetes resources in sync with Git.`, e:`ArgoCD watches <code>k8s/overlays/prod</code>. A new commit there shows up in the cluster within minutes.`},
{q:"What is Argo Workflows?", d:`A workflow engine that runs pipelines inside Kubernetes. Each step runs as a pod.`, e:`Build, Trivy scan, quality gate, push to ECR: four steps, four pods, in order.`},
{q:"ArgoCD vs Argo Workflows?", d:`ArgoCD deploys applications. Argo Workflows runs pipelines. Different jobs, often used together.`, e:`Argo Workflows builds and pushes the image. ArgoCD deploys it.`},
{q:"Why GitHub Actions + Argo Workflows together?", d:`GitHub Actions handles the trigger and AWS authentication through OIDC. Argo Workflows runs the pipeline natively inside Kubernetes.`, e:`A push triggers GitHub Actions, which assumes an AWS role and submits the Argo Workflow in the cluster.`},
{q:"Manual vs automatic sync?", d:`Automatic sync applies Git changes as soon as they’re detected. Manual sync waits for a person to approve, useful for production.`, e:`Dev auto-syncs on every merge. Prod shows OutOfSync until someone clicks Sync after review.`},
{q:"What if someone changes the cluster outside of Git?", d:`ArgoCD detects drift and marks the app OutOfSync. With self-heal on, it reverts to Git. Otherwise it flags it for review.`, e:`Someone runs <code>kubectl scale --replicas=5</code>. Git says 3. ArgoCD sets it back to 3.`},
{q:"Explain your Argo project.", d:`A Kubernetes-native CI/CD platform with GitHub Actions, OIDC, Argo Workflows, ArgoCD, Trivy, ECR, and EKS. GitHub Actions authenticated through OIDC and triggered Argo Workflows. Argo built, scanned, gated, and published the image. Then manifests were updated and ArgoCD deployed to EKS.`, e:`If Trivy finds a critical vulnerability, the quality gate fails, the image is never pushed, and nothing reaches the cluster.`},
{q:"Why update manifests last, after the image is in ECR?", d:`So ArgoCD never tries to deploy an image that doesn’t exist yet.`, e:`If the tag is committed first, pods go to ImagePullBackOff until the push finishes. That exact race is my “difficult coworker” story.`},
]},

{id:"git", title:"Git", blurb:"Fetch, pull, merge, rebase, push, and the everyday commands behind a pull request workflow.", items:[
{q:"git fetch vs pull vs merge vs rebase vs push?", d:`Fetch gets remote changes without modifying my branch. Pull gets and integrates those changes. Merge combines branches, while rebase puts my commits on top of the latest branch history. Push sends my local commits back to the remote.`, e:`<pre><code>git fetch origin          # see what changed, my branch untouched
git pull                  # fetch + merge into my branch
git merge main            # combine main into my branch
git rebase main           # replay my commits on top of main
git push origin feature   # send my commits to the remote</code></pre>`},
{q:"What is git fetch?", d:`Downloads the latest changes from the remote but does not change my local branch.`, e:`<code>git fetch origin</code>, then <code>git log main..origin/main</code> to see what’s new before I decide to merge.`},
{q:"What is git pull?", d:`Downloads the remote changes and integrates them into my current branch. Essentially fetch + merge by default.`, e:`Before starting work in the morning: <code>git pull</code> on main to get my teammates’ changes.`},
{q:"What is git merge?", d:`Combines changes from another branch into my current branch while preserving both histories.`, e:`<code>git merge feature/ingress-tls</code> into main creates a merge commit that shows exactly when the feature came in.`},
{q:"What is git rebase?", d:`Moves my commits on top of the latest commits from another branch, giving a cleaner, linear history.`, e:`My branch is behind main. <code>git rebase main</code> replays my 3 commits after the latest main commit, so the PR history is clean.`},
{q:"What is git push?", d:`Sends my local commits to the remote repository.`, e:`<code>git push -u origin feature/helm-probes</code>, then open a pull request on GitHub.`},
{q:"Merge or rebase: when do you use which?", d:`Rebase my own feature branch to keep it up to date and clean. Merge into shared branches like main. Never rebase a branch other people are already using, because it rewrites history they depend on.`, e:`I rebase <code>feature/x</code> on main before opening the PR, then the PR is merged into main.`},
{q:"How do you resolve a merge conflict?", d:`Git marks the conflicting lines. I open the file, keep the correct version (or combine both), remove the markers, then add and continue.`, e:`<pre><code>git status                 # which files conflict
# edit the file, remove &lt;&lt;&lt;&lt;&lt;&lt;&lt; ======= &gt;&gt;&gt;&gt;&gt;&gt;&gt;
git add values.yaml
git rebase --continue      # or git commit for a merge</code></pre>`},
{q:"git revert vs git reset?", d:`Revert creates a new commit that undoes an earlier one, safe on shared branches. Reset moves the branch back and can drop commits, which rewrites history, so only use it on local work.`, e:`A bad image tag reached main. <code>git revert &lt;commit&gt;</code> undoes it, and Argo CD redeploys the previous version. That’s GitOps rollback.`},
{q:"What are git stash and cherry-pick?", d:`Stash saves uncommitted work temporarily. Cherry-pick copies one specific commit onto the current branch.`, e:`Urgent fix needed: <code>git stash</code>, switch branch, fix, then <code>git stash pop</code>. To bring one hotfix commit to a release branch: <code>git cherry-pick &lt;commit&gt;</code>.`},
{q:"What branching workflow do you use?", d:`Short-lived feature branches off main, a pull request with review and automated checks (tests, Trivy, terraform plan), then merge to main, which triggers the deployment.`, e:`Branch <code>feature/probes</code> → PR shows the plan and scan results → reviewer approves → merge → pipeline updates the image tag → Argo CD deploys.`},
]},

{id:"k8s", title:"Kubernetes core", blurb:"API Server → etcd → Scheduler → kubelet → runtime → Pod Ready.", items:[
{q:"What happens when you create a Pod?", d:`The request goes to the API Server, is stored in etcd, the Scheduler picks a node, kubelet starts the containers through the container runtime, and once healthy the Pod can receive traffic.`, e:`<code>kubectl apply -f pod.yaml</code> → API Server → etcd → Scheduler assigns node-2 → kubelet on node-2 pulls the image and starts it → Ready.`},
{q:"What does the Scheduler do?", d:`It filters out nodes that can’t run the pod, scores the rest, and picks the best one.`, e:`A pod needs 2 CPU and a GPU taint toleration. Nodes without room or the GPU are filtered out, and the least busy GPU node wins.`},
{q:"What does kubelet do?", d:`The agent on each node. It makes sure the containers run as defined and reports status to the control plane.`, e:`A container dies. kubelet restarts it and updates the pod status the API Server shows.`},
{q:"What is etcd?", d:`The distributed key-value database that stores all cluster state. Only the API Server talks to it.`, e:`Every Deployment, Service, and Secret you create is a key in etcd.`},
{q:"What if etcd loses quorum?", d:`Writes stop, because a majority of members must agree before a change is saved. Reads may still work.`, e:`With 3 members, losing 2 means no quorum. Running pods keep running, but you can’t deploy or scale.`},
{q:"Readiness vs liveness probes?", d:`Readiness decides if a pod gets traffic. Failing removes it from the Service but doesn’t kill it. Liveness decides if the container should be restarted. For slow starters, use a startupProbe.`, e:`A Java app takes 60s to start. Without a startupProbe, liveness kills it at 30s, forever. Add a startupProbe and it starts cleanly.`},
{q:"What is a Service?", d:`A stable IP and DNS name in front of a group of pods, chosen by labels. EndpointSlices track healthy pod IPs and kube-proxy programs the routing. Types: ClusterIP, NodePort, LoadBalancer.`, e:`Pods come and go with new IPs, but the frontend always calls <code>http://api:8080</code>.`},
{q:"What is Ingress?", d:`HTTP/HTTPS routing into the cluster through one entry point using host and path rules. It needs an Ingress Controller to work.`, e:`<code>/api</code> goes to the api Service, <code>/</code> goes to the web Service, both behind one ALB created by the AWS Load Balancer Controller.`},
{q:"What is Gateway API?", d:`The next-generation successor to Ingress, with more flexible traffic management.`, e:`Split 90% of traffic to v1 and 10% to v2 for a canary, which plain Ingress can’t do natively.`},
{q:"GatewayClass vs Gateway vs HTTPRoute?", d:`GatewayClass is the implementation. Gateway is the entry point (listeners, ports). HTTPRoute is the routing rules.`, e:`GatewayClass: AWS LB controller. Gateway: HTTPS on 443. HTTPRoute: <code>/orders</code> to the orders Service.`},
{q:"How does Kubernetes know CPU and memory usage?", d:`The kubelet on each node collects CPU and memory usage from its containers. Metrics Server gathers those measurements and exposes them through the Kubernetes Metrics API. That’s what I use with kubectl top pods and kubectl top nodes, and HPA can use the same data to scale Pods. The scheduler uses resource requests to place Pods, so I compare actual usage with requests and limits when I tune a workload.`, e:`<table class="mini"><tr><th>Setting</th><th>If it’s wrong</th><th>What you see</th></tr><tr><td><strong>Request</strong> too high</td><td>No node has room</td><td>Pending (⏳ Scenario 1)</td></tr><tr><td><strong>Memory limit</strong> too low</td><td>Kernel kills it</td><td>OOMKilled → CrashLoopBackOff (🚨 Scenario 3)</td></tr><tr><td><strong>CPU limit</strong> too low</td><td>Throttled</td><td>Slow app, failed probes, timeouts</td></tr></table><p style="margin-top:10px"><strong>Remember:</strong> Requests decide where a pod runs, limits decide when it gets throttled or killed, and the kubelet with Metrics Server tells you what it actually uses.</p>`, x:`<div class="fu"><h4>Follow-up questions</h4>
<details><summary>What if Metrics Server isn’t installed?</summary><div>kubectl top won’t have CPU and memory numbers to show me. An HPA that relies on those resource metrics also won’t be able to make scaling decisions. I’d check whether Metrics Server is installed and whether it can collect data from the kubelets.</div></details>
<details><summary>Can you see last week’s usage?</summary><div>kubectl top gives me a recent snapshot, not a history I can investigate from last week. For trends before an incident, I’d use Prometheus with Grafana or Datadog. That helps me see whether memory was rising gradually or spiked after a deployment.</div></details>
<details><summary>What happens when a container exceeds its limits?</summary><div>A CPU limit generally slows the container through throttling. Memory behaves differently: if the container runs into its memory limit, the kernel may kill it. I’d check Last State for OOMKilled, then compare the memory trend with the limit. If it keeps restarting, that takes me into our CrashLoopBackOff scenario.</div></details>
<details><summary>How would you proceed with that OOMKilled Pod?</summary><div>First I’d confirm OOMKilled in Last State and check whether users are affected. Then I’d compare memory usage, the configured limit, and any recent application or traffic change. I’d restore a healthy version or capacity if needed, fix the cause, and verify the Pod stays Ready without new restarts. Afterward, I’d add a memory alert or a load test that catches the same pattern earlier.</div></details>
<details><summary>Good to know</summary><div>HPA checks metrics on a default 15-second interval. Exit code 137 alone does not prove OOMKilled, because it only means the container was killed. Confirm the OOMKilled reason in Last State.</div></details></div>`},
{q:"What is a namespace?", d:`A virtual folder inside a Kubernetes cluster. It groups related resources, like pods, Services, ConfigMaps, and Secrets, so one cluster can be shared by many teams, apps, or environments.`, e:`One EKS cluster with <code>payments</code>, <code>orders</code>, and <code>monitoring</code> namespaces. <code>kubectl get pods -n payments</code> shows only the payments pods.`},
{q:"Why use namespaces?", d:`<ul class="steps"><li><strong>Organization:</strong> each team or app gets its own space.</li><li><strong>Access control:</strong> RBAC Roles and RoleBindings are per namespace.</li><li><strong>Resource limits:</strong> ResourceQuota and LimitRange cap CPU and memory per namespace.</li><li><strong>Network rules:</strong> NetworkPolicies apply per namespace.</li><li><strong>Same names, no conflict:</strong> two teams can each have a Service called <code>api</code>.</li></ul>`, e:`The payments team gets a Role that only works in <code>payments</code>, and a ResourceQuota of 8 CPU, so they can’t touch or starve the orders team.`},
{q:"Which namespaces exist by default?", d:`<code>default</code> (where things go if you don’t pick one), <code>kube-system</code> (cluster components like CoreDNS and kube-proxy), <code>kube-public</code> (readable by everyone), and <code>kube-node-lease</code> (node heartbeats).`, e:`When kube-proxy or CoreDNS has a problem, you look in <code>kube-system</code>: <code>kubectl get pods -n kube-system</code>.`},
{q:"Is everything in a namespace?", d:`No. Most workload resources are namespaced (pods, Deployments, Services, ConfigMaps, Secrets, Roles). Some resources are cluster-wide: nodes, PersistentVolumes, StorageClasses, ClusterRoles, and namespaces themselves.`, e:`A PVC lives in a namespace, but the PersistentVolume behind it is cluster-wide. <code>kubectl api-resources --namespaced=false</code> lists the cluster-wide ones.`},
{q:"How do pods talk across namespaces?", d:`By DNS. Inside the same namespace, the short Service name works. From another namespace, use the full name: <code>service.namespace.svc.cluster.local</code>. Namespaces don’t block traffic on their own, only NetworkPolicies do.`, e:`An app in <code>web</code> calls <code>db</code> and fails. The database Service is in <code>data</code>, so it must call <code>db.data.svc.cluster.local</code>.`},
{q:"Are namespaces a security boundary?", d:`Only a soft one. They separate names, access, and quotas, but pods in different namespaces can still talk to each other and share the same nodes. For real isolation, add RBAC, NetworkPolicies, Pod Security Standards, and IRSA per namespace. For strict isolation, use separate clusters or accounts.`, e:`In the multi-tenant migration, each tenant had its own namespace plus NetworkPolicies and IRSA, so Tenant A couldn’t reach Tenant B’s network, buckets, or database schemas.`},
{q:"Namespaces or separate clusters for dev and prod?", d:`Namespaces work for dev and test on a shared cluster, which saves cost. For production, most teams use a separate cluster, often in a separate AWS account, so a mistake or noisy workload in dev can’t affect prod.`, e:`<code>dev</code> and <code>staging</code> namespaces share one cluster. Production runs in its own EKS cluster in the prod account, deployed by Argo CD from the same Git repo.`},
{q:"Useful namespace commands", d:`The ones you’ll use most.`, x:`<pre><code>kubectl get namespaces
kubectl create namespace payments
kubectl get pods -n payments
kubectl get pods -A                          # all namespaces
kubectl config set-context --current --namespace=payments   # make it your default
kubectl label namespace payments istio-injection=enabled    # Istio sidecars
kubectl get resourcequota -n payments</code></pre>`},
{q:"Deployments vs StatefulSets?", d:`Deployments are for stateless apps with interchangeable pods. StatefulSets give each pod a stable name and its own storage.`, e:`A web API runs as a Deployment. PostgreSQL runs as a StatefulSet: <code>db-0</code>, <code>db-1</code>, each with its own volume.`},
{q:"What is a ConfigMap?", d:`Stores non-sensitive configuration separately from the image: DNS names, API endpoints, feature flags, settings.`, e:`In Secure Mesh Pipeline, config was injected through ConfigMaps. On QuasarPlus, a generated config.txt played the same role.`},
{q:"How does a Pod get its configuration?", d:`From ConfigMaps and Secrets, injected as environment variables or mounted files.`, e:`<code>LOG_LEVEL</code> comes from a ConfigMap as an env var. A TLS cert is mounted from a Secret at <code>/etc/tls</code>.`},
{q:"ConfigMaps vs Secrets?", d:`Same idea, but Secrets are for sensitive data (passwords, API keys, tokens, certificates). By default Secrets are only base64-encoded. Enable KMS encryption at rest.`, e:`<code>echo cGFzc3dvcmQ= | base64 -d</code> prints “password.” Base64 is encoding, not encryption.`},
{q:"Taints and tolerations?", d:`Taints keep pods off a node. Tolerations let specific pods run there anyway.`, e:`Taint GPU nodes with <code>gpu=true:NoSchedule</code>. Only ML pods with the matching toleration land there.`},
]},

{id:"networking", title:"Kubernetes networking", blurb:"Flat network, CNI routes, kube-proxy programs the rules.", items:[
{q:"How does Pod-to-Pod communication work?", d:`Kubernetes gives a flat network: every pod has its own IP and can reach any other pod. The CNI plugin handles routing. Apps usually go through a Service because pod IPs change.`, e:`Pod A calls <code>payments:8080</code>. DNS returns the ClusterIP, iptables rules rewrite it to a real pod IP, and the packet goes to Pod B.<div class="flow">Pod A → DNS → ClusterIP → iptables → Pod B</div>`},
{q:"How does Node-to-Pod communication work?", d:`Traffic reaches the node first, then kube-proxy rules and the CNI route it to the pod. In production, outside traffic usually comes through a load balancer or Ingress. NodePort is mostly for dev or testing.`, e:`User → ALB → node → kube-proxy rule translates the Service IP to a pod IP → pod.`},
{q:"How does a Pod reach an external service?", d:`Through the cluster’s outbound networking. Pods in private subnets go out through a NAT Gateway. Security Groups, NetworkPolicies, and firewalls can all affect it.`, e:`A pod calls the Stripe API: pod → node → NAT Gateway in the public subnet → internet.`},
{q:"How does a Pod reach AWS services securely?", d:`IRSA. Kubernetes mounts a signed token through the pod’s ServiceAccount. STS validates it against the cluster’s OIDC provider and returns short-lived credentials. No access keys stored anywhere.`, e:`The ServiceAccount has the annotation <code>eks.amazonaws.com/role-arn</code>. The pod’s AWS SDK picks up temporary credentials and reads only its one S3 bucket.`},
{q:"How does return traffic get back from Pod B to Pod A?", d:`Directly. After the DNAT, Pod B already has Pod A’s IP as the source. No DNS, no ClusterIP, no kube-proxy. The kernel tracks the connection (conntrack). On EKS pods have real VPC IPs, so no SNAT is needed.`, e:`<div class="flow">Pod A ← Pod B (direct, no middlemen)</div>`},
{q:"Is that like a stateful Security Group?", d:`Yes. You define the inbound rule and the reply is allowed automatically. Security Groups track state in the VPC. Kubernetes uses Linux conntrack in the kernel. Same idea, different layer.`, e:`Allow inbound 443 on a Security Group, and the response to the client leaves without any outbound rule.`},
{q:"If kube-proxy crashes, what happens to traffic?", d:`Traffic keeps working at first, because the iptables rules are already in the kernel. What stops is updates. It’s a slow drift into inconsistency.`, e:`The Pharmacy pod restarts with IP 10.1.2.55, but the rule still points to the dead 10.1.2.20. Calls to that pod start failing, only as pods change.<pre><code>t = 0        kube-proxy crashes    → traffic still works
t = minutes  pods start changing   → rules go stale
t = later    intermittent failures → hitting dead endpoints</code></pre>`},
{q:"If the new pod has a new IP, why does traffic hit the old one?", d:`The new pod is healthy, but nobody updated iptables. It’s running but invisible to traffic.`, e:`Like a hospital directory still pointing to an empty office on floor 2 while the new doctor waits on floor 3. kube-proxy is the directory updater.`},
{q:"How do you fix kube-proxy?", d:`Restart it. It syncs with the API Server, reads all Services and EndpointSlices, and rewrites every rule. On EKS it’s a DaemonSet, so Kubernetes usually restarts it for you.`, e:`<pre><code>kubectl get pods -n kube-system | grep kube-proxy
kubectl rollout restart daemonset kube-proxy -n kube-system</code></pre>`},
{q:"What if iptables itself fails?", d:`kube-proxy can’t fix it, because the rules never land in the kernel. It’s an immediate outage on that node, not a slow drift.`, e:`Bad rules from another tool: <code>iptables -F</code>, then restart kube-proxy. Kernel module issue: restart the node. At scale: move to IPVS or Cilium with eBPF.`},
{q:"Why does this matter in healthcare?", d:`If pods can’t talk, a doctor misses a drug interaction warning, a nurse isn’t notified, a billing event is lost, and the audit trail breaks, which is a HIPAA problem.`, e:`Pod-to-pod networking in a hospital system is patient safety infrastructure.`},
]},

{id:"k8s-security", title:"Kubernetes security", blurb:"Always frame it around least privilege.", items:[
{q:"What is RBAC?", d:`Role-Based Access Control. Roles/ClusterRoles define permissions, RoleBindings/ClusterRoleBindings give them to users, groups, or service accounts. Roles are per namespace, ClusterRoles are cluster-wide.`, e:`A Role allows <code>get, list</code> on pods in <code>dev</code>. A RoleBinding gives it to the dev team. <code>kubectl auth can-i delete pods -n dev</code> says no.`},
{q:"What is a ServiceAccount?", d:`An identity for workloads. Every pod runs as one, by default the namespace’s <code>default</code> account. Best practice is one per workload with scoped RBAC.`, e:`The Datadog agent runs as <code>datadog-agent</code>, which has only the read permissions it needs.`},
{q:"What is IRSA?", d:`IAM Roles for Service Accounts. Pods assume an AWS IAM role through their ServiceAccount via OIDC, without stored credentials.`, e:`Only pods using the <code>uploader</code> ServiceAccount can write to the uploads bucket.`},
{q:"What are Network Policies?", d:`By default all pods can talk to all pods. NetworkPolicies restrict ingress and egress by labels and namespaces.`, e:`Only pods labeled <code>app: api</code> can reach the database on port 5432. Everything else is denied.`},
{q:"What’s the modern approach to pod security?", d:`Pod Security Standards (Privileged, Baseline, Restricted), enforced by Pod Security Admission per namespace. Don’t run as root, drop capabilities, use read-only root filesystems.`, e:`Label a namespace <code>pod-security.kubernetes.io/enforce=restricted</code> and a pod running as root is rejected.`},
{q:"How do you secure container images?", d:`Scan before they reach the cluster, use minimal base images, pin tags, and pull only from trusted registries.`, e:`Trivy runs in the pipeline and fails the build on CRITICAL findings. Never <code>:latest</code> in production.`},
{q:"How do you encrypt Secrets at rest?", d:`Enable envelope encryption for etcd with a KMS key.`, e:`On EKS, turn on secrets encryption with a KMS key when creating the cluster in Terraform.`},
{q:"What are admission controllers?", d:`Webhooks that check or change requests before they’re saved. OPA/Gatekeeper is common for policy-as-code.`, e:`Gatekeeper rejects any Deployment without resource limits. Istio’s webhook injects the Envoy sidecar.`},
]},

{id:"istio", title:"Service mesh & Istio", blurb:"Istio = SOTA: Security, Observability, Traffic, Authorization.", items:[
{q:"What is Envoy?", d:`A high-performance proxy that is Istio’s data plane. It handles mTLS, routing, retries, timeouts, circuit breaking, metrics, and tracing.`, e:`If the orders service times out, Envoy retries twice before returning an error, without any code change in the app.`},
{q:"Where does Envoy run?", d:`As a sidecar container in the same pod as the app, sharing the network namespace, so it can intercept all traffic.`, e:`<pre><code>Pod
├── Application Container
└── Envoy Sidecar</code></pre>`},
{q:"“Envoy sits next to the pod.” Is that accurate?", d:`Not quite. Envoy sits next to the application container, inside the same pod.`, e:`Volunteer this correction. It shows you understand the sidecar model, not just the phrase.`},
{q:"How does Pod-to-Pod traffic work with Istio?", d:`The app sends, the local Envoy intercepts, applies policy, encrypts with mTLS, and sends to the destination Envoy, which hands it to the app.`, e:`<div class="flow">App A → Envoy A → Envoy B → App B</div>`},
{q:"What are the main benefits of Istio?", d:`Security (mTLS, identity), Observability (metrics, logs, tracing), Traffic management (retries, timeouts, canary, circuit breaking), Authorization (fine-grained policies).`, e:`Send 10% of traffic to v2 with a VirtualService, watch error rates, then move to 100%.`},
{q:"What is mTLS?", d:`Mutual TLS. Both client and server present certificates, so both are verified and traffic is encrypted both ways.`, e:`With <code>PeerAuthentication</code> in STRICT mode, a pod without a sidecar can’t call the payments service at all.`},
{q:"How does Istio improve observability?", d:`Every Envoy sidecar records telemetry, so you get metrics, logs, and traces for service-to-service calls automatically.`, e:`Without touching code, you can see the latency and error rate between frontend and orders in Grafana or Datadog.`},
]},

{id:"aws", title:"AWS", blurb:"Identity, networking, and what EKS manages for you.", items:[
{q:"IAM user vs IAM role?", d:`Users have long-lived credentials. Roles give temporary credentials through STS.`, e:`A pipeline assumes a role and gets credentials valid for about an hour, instead of an access key that never expires.`},
{q:"What is OIDC?", d:`OIDC lets GitHub Actions (or an EKS ServiceAccount) authenticate to AWS without stored keys. GitHub issues a short-lived token, AWS validates it, STS assumes a role, temporary credentials come back.`, e:`<div class="flow">GitHub Actions → OIDC token → AWS OIDC provider → STS AssumeRole → temporary credentials</div>`},
{q:"What is STS?", d:`The service that issues temporary AWS credentials.`, e:`<code>aws sts get-caller-identity</code> shows which role you’re currently using.`},
{q:"OIDC vs STS?", d:`OIDC proves identity. STS turns that identity into temporary credentials.`, e:`GitHub’s token says “I’m repo X on main.” STS answers with keys for the deploy role.`},
{q:"Secrets Manager vs Parameter Store?", d:`Secrets Manager is built for secrets, supports automatic rotation, and costs per secret. Parameter Store is cheaper, hierarchical, good for config plus SecureString secrets.`, e:`RDS password with rotation: Secrets Manager. <code>/app/prod/log_level</code>: Parameter Store.`},
{q:"Security Groups vs NACLs?", d:`Security Groups are stateful, per instance/ENI, allow only. NACLs are stateless, per subnet, and support deny.`, e:`To block one malicious IP range for a whole subnet, add a deny rule in the NACL.`},
{q:"ALB vs NLB?", d:`ALB is Layer 7 and understands HTTP (path/host routing). NLB is Layer 4 (TCP/UDP), very fast, with static IPs.`, e:`Web app with <code>/api</code> and <code>/</code> routes: ALB. A TCP service that needs a fixed IP for a partner’s firewall: NLB.`},
{q:"What is Route 53?", d:`AWS DNS, with health checks and routing policies (weighted, latency, geolocation, failover).`, e:`Failover routing sends users to the us-west-2 stack if the us-east-1 health check fails.`},
{q:"Auto Scaling, and on EKS?", d:`Policies: target tracking, step, scheduled. On EKS, Karpenter is the current answer over Cluster Autoscaler because it adds the right node faster based on pending pods.`, e:`HPA adds pods when CPU passes 70%. Pods go Pending, Karpenter launches a node that fits them.`},
{q:"EKS architecture: what’s managed?", d:`AWS manages the control plane (API Server, etcd, scheduler, controllers) across AZs. You manage the data plane: managed node groups, self-managed EC2, or Fargate.`, e:`Trick question: “How do you back up etcd on EKS?” You don’t. AWS runs it.`},
{q:"What IAM roles does EKS + Datadog need?", d:`Three roles: the cluster role for the control plane, the node role for workers (join, pull from ECR, networking), and a Datadog IRSA role used only by the agent pods.`, e:`<pre><code>EKS Cluster
├── Cluster Role
├── Node Group → Node Role
└── Datadog Agent Pods → ServiceAccount → Datadog IRSA Role</code></pre>“Datadog gets only the monitoring permissions it needs, isolated from the node role. That’s least privilege.”`},
]},

{id:"observability", title:"Observability & monitoring", blurb:"Prometheus, Grafana, CloudWatch, and Datadog. Concepts first, then each tool, then interview scenarios.", items:[
{q:"Monitoring vs observability?", d:`Monitoring tells you <strong>that</strong> something is wrong, using checks you defined in advance. Observability helps you find out <strong>why</strong>, by exploring metrics, logs, and traces, even for problems you didn’t predict.`, e:`Monitoring: an alert says the checkout error rate is 5%. Observability: the traces show every failing request is slow in the call to the payment provider.`},
{q:"What are metrics, logs, and traces?", d:`<strong>Metrics</strong> are numbers over time (CPU, request rate, errors). <strong>Logs</strong> are event messages from the app or system. <strong>Traces</strong> follow one request across all the services it touches, with the time spent in each.`, e:`Metrics show latency went up at 2:10 PM. Traces show which service got slow. Logs from that service show the exact error.`},
{q:"What are the four golden signals?", d:`<strong>Latency</strong> (how long requests take), <strong>traffic</strong> (how many requests), <strong>errors</strong> (how many fail), and <strong>saturation</strong> (how full the resources are). If you monitor only four things per service, monitor these.`, e:`For the orders API: p95 latency, requests per second, 5xx rate, and CPU and memory compared to limits.`},
{q:"What are SLI, SLO, SLA, and an error budget?", d:`<strong>SLI:</strong> what you measure, like the percentage of successful requests. <strong>SLO:</strong> the target you set, like 99.9% per month. <strong>SLA:</strong> the promise to customers, with penalties. <strong>Error budget:</strong> how much failure the SLO allows.`, e:`A 99.9% monthly SLO allows about 43 minutes of failure. If a bad release burns most of it, the team slows releases and focuses on reliability.`},
{q:"What makes a good alert?", d:`It fires on something users feel (errors, latency, SLO burn), it’s actionable, it has the right severity, and it links to a runbook. Alerting on every CPU spike creates alert fatigue, and people start ignoring alerts.`, e:`Page someone when the checkout error rate is above 2% for 5 minutes. Only send a ticket, not a page, when a node’s disk reaches 80%.`},
{q:"How does Prometheus work?", d:`Prometheus <strong>pulls</strong> (scrapes) metrics from a <code>/metrics</code> endpoint on each target every 15 to 30 seconds and stores them as time series with labels. <strong>Exporters</strong> expose metrics for things that don’t have them natively.`, e:`It scrapes the orders pods at <code>:8080/metrics</code> and stores <code>http_requests_total{service="orders", status="500"}</code>.`},
{q:"How do you run Prometheus on Kubernetes?", d:`Usually with the <strong>kube-prometheus-stack</strong> Helm chart. It installs the Prometheus Operator, Prometheus, Alertmanager, Grafana, <strong>node-exporter</strong> (node metrics), and <strong>kube-state-metrics</strong> (object states like restarts and replicas). You tell it what to scrape with a <strong>ServiceMonitor</strong>.`, e:`A ServiceMonitor selects Services labeled <code>app: orders</code> and scrapes their <code>metrics</code> port. No Prometheus config file to edit by hand.`},
{q:"Which PromQL queries can you explain?", d:`A few common ones you should be able to read out loud.`, x:`<pre><code># requests per second over the last 5 minutes
sum(rate(http_requests_total{service="orders"}[5m]))

# error percentage
sum(rate(http_requests_total{service="orders",status=~"5.."}[5m]))
  / sum(rate(http_requests_total{service="orders"}[5m])) * 100

# p95 latency
histogram_quantile(0.95,
  sum(rate(http_request_duration_seconds_bucket{service="orders"}[5m])) by (le))

# pods restarting
increase(kube_pod_container_status_restarts_total[1h]) &gt; 3

# memory usage compared to the limit
container_memory_working_set_bytes / on(pod,container)
  kube_pod_container_resource_limits{resource="memory"}</code></pre>`},
{q:"What is Alertmanager?", d:`Prometheus evaluates alert rules. Alertmanager receives the alerts and handles <strong>routing</strong> (who gets it), <strong>grouping</strong> (one message instead of fifty), and <strong>silences</strong> (mute during maintenance).`, e:`A PrometheusRule fires <code>HighErrorRate</code>. Alertmanager groups it by service and sends one message to the orders team’s Slack channel and PagerDuty.`},
{q:"What are Prometheus’s limits?", d:`It stores data locally with limited retention, and one server doesn’t scale forever. For long-term storage and many clusters, teams add Thanos, or use a managed service like Amazon Managed Service for Prometheus.`, e:`Keep 15 days locally for troubleshooting, and send data to long-term storage for monthly capacity trends.`},
{q:"What is Grafana?", d:`A visualization tool. It connects to data sources like Prometheus, CloudWatch, Loki, or Datadog and shows them as dashboards. It supports variables (pick a namespace or service) and alerting.`, e:`One dashboard with a dropdown for the service: pick <code>orders</code>, and every panel updates to that service.`},
{q:"What goes on a good Kubernetes dashboard?", d:`The golden signals per service, pod restarts, CPU and memory compared to requests and limits, node usage, and deploy markers so you can see if a problem started right after a release.`, e:`Error rate jumps at 2:10 PM, and a deploy marker shows version 1.4.2 went out at 2:09 PM. That’s your first lead.`},
{q:"What does CloudWatch cover?", d:`AWS’s built-in monitoring: <strong>Metrics</strong> for AWS services, <strong>Logs</strong>, <strong>Alarms</strong>, and dashboards. <strong>Container Insights</strong> adds pod, node, and cluster metrics for EKS. It’s managed, needs no servers, and works in GovCloud.`, e:`An alarm on the ALB metric <code>HTTPCode_Target_5XX_Count</code> sends a notification through SNS when the app starts returning errors.`},
{q:"How do you search logs in CloudWatch?", d:`With <strong>CloudWatch Logs Insights</strong>, a query language for filtering and counting log events.`, x:`<pre><code>fields @timestamp, @message
| filter @message like /ERROR/
| stats count(*) by bin(5m)
| sort @timestamp desc</code></pre><p>This counts errors in 5-minute buckets, so you see exactly when they started.</p>`},
{q:"How does Datadog work on EKS?", d:`The <strong>Datadog Agent</strong> runs as a DaemonSet on every node (installed with the Helm chart) and collects metrics, logs, and traces. The <strong>Cluster Agent</strong> collects cluster-level data. Apps send traces through the APM library. Tags like <code>env</code>, <code>service</code>, and <code>version</code> connect everything.`, e:`With the same <code>service</code> and <code>version</code> tags on metrics, logs, and traces, one click goes from a latency spike to the slow trace to the error log.`},
{q:"What are Datadog monitors?", d:`Alerts in Datadog. They can watch metrics, APM data, logs, or use anomaly detection, and notify Slack, email, or PagerDuty.`, e:`An APM monitor on the orders service: p95 latency above 800 ms for 10 minutes notifies <code>@slack-orders-alerts</code> with a runbook link.`},
{q:"How does the Datadog Agent send data securely?", d:`The Datadog Agent first establishes a TLS-encrypted HTTPS connection to the Datadog ingestion endpoint. Once the secure tunnel is established, the agent sends its API key for authentication along with the telemetry data. Datadog validates the API key, accepts the metrics, logs, and APM traces, and stores them encrypted at rest.`, e:`So the data is protected before it leaves AWS, while it’s in transit across the internet, and after it’s stored.`},
{q:"Prometheus and Grafana vs CloudWatch vs Datadog?", d:`<table class="mini"><tr><th></th><th>Best for</th><th>Trade-off</th></tr><tr><td><strong>Prometheus + Grafana</strong></td><td>Kubernetes-native, open source, full control</td><td>You run and scale it yourself</td></tr><tr><td><strong>CloudWatch</strong></td><td>AWS services, managed, GovCloud</td><td>Weaker for app-level Kubernetes insight</td></tr><tr><td><strong>Datadog</strong></td><td>Everything in one place: metrics, logs, APM</td><td>Cost grows with hosts and data</td></tr></table>`, e:`A common mix: CloudWatch for AWS services and alarms, Prometheus and Grafana for cluster metrics, or Datadog for everything when the budget allows.`},
{q:"What tools do you use for monitoring?", d:`CloudWatch, Datadog, Prometheus/Grafana, and Splunk. I watch error rate, latency, health checks, and resource use, and correlate metrics, logs, and traces.`, e:`A latency alert fires in Datadog, the trace shows the slow span is the database call, and the database metrics show connection pool exhaustion.`},
{sc:1, q:"Scenario 1: Slow, but CPU looks fine", open:`“Users say the orders API is slow. On the node dashboards, CPU is only at 40%. What’s going on?”`, steps:[
[`Which signal is bad? Latency, errors, or both?`,`p95 latency went from 200 ms to 2 seconds. No errors.`],
[`Is the 40% for the node or the container? What’s the container’s CPU limit?`,`That’s the node. The container limit is 500m, and the pods are using right up to it.`],
[`What does the throttling metric show?`,`<code>container_cpu_cfs_throttled_periods_total</code> is very high for the orders pods.`]],
diag:`<strong>CPU throttling.</strong> The node has spare CPU, but each container is capped at 500m. The kernel slows the container down when it hits the limit, so requests queue and latency climbs.`,
proceed:`<ol class="steps"><li>Raise the CPU limit (or remove it and keep a sensible request), and let HPA add pods under load.</li><li>Verify p95 latency returns to normal and throttling drops.</li><li>Prevent: dashboard panels for throttling next to CPU usage, and set limits from real metrics.</li></ol>`},
{sc:1, q:"Scenario 2: New service shows no data", open:`“We deployed a new payments service. It works, but its Grafana dashboard shows ‘No data’.”`, steps:[
[`Does Prometheus list it as a target on its Targets page?`,`No, it’s not there at all.`],
[`Is there a ServiceMonitor for it?`,`Yes, it was added in the Helm chart.`],
[`Does the ServiceMonitor have the label Prometheus looks for, and does the port name match the Service?`,`It’s missing the <code>release: kube-prometheus-stack</code> label, and it points to port <code>metrics</code>, but the Service calls it <code>http-metrics</code>.`]],
diag:`<strong>Prometheus isn’t scraping the service.</strong> Prometheus only picks up ServiceMonitors with its selector label, and even then the port name must match the Service.`,
proceed:`<ol class="steps"><li>Add the <code>release</code> label and fix the port name in the chart.</li><li>Verify the target shows as UP in Prometheus and the dashboard fills in.</li><li>Prevent: a standard ServiceMonitor template in the Helm chart, and an alert when an expected target disappears.</li></ol>`},
{sc:1, q:"Scenario 3: Pod logs missing in CloudWatch", open:`“We use Fluent Bit to send EKS pod logs to CloudWatch. Since last week, new logs are missing.”`, steps:[
[`Are the Fluent Bit pods running?`,`Yes, on every node.`],
[`What do the Fluent Bit logs say?`,`<code>AccessDeniedException: not authorized to perform logs:PutLogEvents</code>.`],
[`What changed last week?`,`The IAM roles were cleaned up. Fluent Bit’s IRSA role lost its CloudWatch Logs permissions.`]],
diag:`<strong>IAM permission problem.</strong> Fluent Bit is running but can’t write to CloudWatch because its IRSA role no longer allows it.`,
proceed:`<ol class="steps"><li>Restore <code>logs:CreateLogStream</code> and <code>logs:PutLogEvents</code> on Fluent Bit’s role, through Terraform.</li><li>Verify new log events arrive in the log group.</li><li>Prevent: an alert when log volume for a log group drops to zero, and review IAM changes against what each service needs.</li></ol>`},
{sc:1, q:"Scenario 4: Too many alerts", open:`“Our team gets about 200 alerts a week. People have started ignoring them, and we missed a real outage.”`, steps:[
[`What kind of alerts are most of them?`,`CPU above 80%, and single pod restarts.`],
[`How many need a person to do something?`,`Very few. Most resolve on their own in a few minutes.`],
[`Did anything alert during the real outage?`,`Yes, but it was lost among the other alerts.`]],
diag:`<strong>Alert fatigue.</strong> The alerts watch causes (CPU, single restarts) instead of symptoms users feel, so the real alert got buried.`,
proceed:`<ol class="steps"><li>Move paging alerts to user-facing symptoms: error rate, latency, and SLO burn.</li><li>Turn cause-based alerts into tickets or dashboards, and add a “for 10 minutes” condition to cut noise.</li><li>Group related alerts and link each one to a runbook.</li><li>Review alerts weekly and delete any that nobody acts on.</li></ol>`},
]},

{id:"ansible", title:"Ansible", blurb:"Terraform builds the house, Ansible furnishes it.", items:[
{q:"What is Ansible?", d:`A configuration management and automation tool. It installs software, manages configuration, and automates tasks. Agentless, it connects over SSH.`, e:`One playbook installs NGINX on 20 servers at once.`},
{q:"Why Ansible if you already use Terraform?", d:`Terraform provisions infrastructure. Ansible configures it.`, e:`Terraform creates the EC2 instance. Ansible installs packages, writes the config, and starts the service.`},
{q:"What does agentless mean?", d:`Nothing to install on the targets. Ansible connects over SSH (or WinRM) and pushes changes.`, e:`A new server only needs SSH access and Python to be managed.`},
{q:"Playbooks, roles, inventory?", d:`Playbook: YAML list of tasks. Role: reusable bundle of tasks, variables, templates. Inventory: the target hosts, static or dynamic.`, e:`An <code>nginx</code> role reused by the web and API playbooks, run against hosts tagged <code>Role=web</code>.`},
{q:"What is idempotency?", d:`Running the same playbook twice gives the same result without extra changes.`, e:`The second run reports <code>changed=0</code> because the package is already installed.`},
{q:"How did you use Ansible on QuasarPlus?", d:`Ansible automated deployments to Linux servers: configured NGINX and app settings, retrieved certificates and secrets, set file permissions, restarted services, and validated health afterward.`, e:`It standardized deployments across environments and cut manual configuration errors.`},
{q:"What does a typical Ansible deployment look like?", d:`Connect over SSH, get the artifacts, update config files, deploy certificates or secrets, restart services, run validation checks.`, e:`The last task curls <code>/health</code>. If it doesn’t return 200, the play fails and we know before users do.`},
{q:"Have you used dynamic inventory?", d:`Yes. Ansible queried AWS for the current EC2 instances, so playbooks always hit the right servers as the fleet scaled, without manually updating the host list.`, e:`Patch every instance tagged <code>Env=prod</code>, even ones launched an hour ago.`},
{q:"What was the challenge with dynamic inventory?", d:`Consistency during scaling. Instances might be still booting or already terminated when inventory is pulled. It also needs plugin setup, secure credentials, and filters.`, e:`Filter by tag and <code>instance-state-name: running</code> so half-started instances aren’t targeted.`},
{q:"Core Ansible commands", d:`<code>--check</code> is the Ansible version of <code>terraform plan</code>. Mention it for safe production changes.`, x:`<pre><code>ansible-inventory --list
ansible all -m ping
ansible-playbook deploy.yml
ansible-playbook deploy.yml --check        # dry run
ansible-playbook deploy.yml --limit web1
ansible-playbook deploy.yml --tags nginx
ansible-vault encrypt secrets.yml</code></pre>`},
]},

{id:"python", title:"Python & Bash", blurb:"Automation and integrations. Be honest about depth.", items:[
{q:"How do you use Python in DevOps?", d:`Mainly for automation and integrations: Lambda functions, API calls, JSON processing, monitoring events, operational scripts.`, e:`A Lambda triggered by an alert collects logs and metrics, builds a summary, and posts it to Slack.`},
{q:"Example use case without AI?", d:`A monitoring alert triggers a Lambda that gathers context and sends a useful notification instead of a raw alert.`, e:`CPU above threshold → Lambda pulls recent metrics and the impacted service → formats a Slack message with the key numbers.`},
{q:"Example use case with AI?", d:`The Lambda collects the alert, logs, and metrics, sends them to an AI model, and posts the summary, likely root causes, and next steps to Slack.`, e:`A pod crash-loops. The AI reads the logs, spots “cannot connect to database,” and recommends checking DB connectivity and credentials.`},
{q:"How did you use Python in Secure Mesh Pipeline?", d:`To parse Trivy results and enforce quality gates.`, e:`The script reads Trivy’s JSON, counts CRITICAL findings, and exits non-zero if any exist, which stops the pipeline.`},
{q:"What is Boto3?", d:`The AWS SDK for Python. Credentials come from the Lambda’s execution role, not hardcoded keys.`, e:`<code>boto3.client('s3').list_objects_v2(Bucket='logs')</code>`},
{q:"Lambda limits worth knowing?", d:`15-minute maximum execution time.`, e:`A 2-hour data job goes to Step Functions or Fargate instead.`},
{q:"Python story: EC2 start/stop Lambda", d:`Python Lambdas triggered by CloudWatch Events stopped and started EC2 instances on a schedule, cutting cost outside business hours. API Gateway exposed a REST interface.`, x:`<pre><code>import boto3
ec2 = boto3.client('ec2')

def stop_instances(event, context):
    ec2.stop_instances(InstanceIds=['i-1234567890abcdef0'])</code></pre>`},
{q:"Bash story: EC2 backup script", d:`A Bash script used the AWS CLI to snapshot instances daily and delete old snapshots for retention.`, e:`It kept disaster recovery compliant without anyone doing snapshots by hand.`},
]},

{id:"azure", title:"Azure & AKS", blurb:"AWS-primary, so map the services. AKS troubleshooting uses the same kubectl method as EKS. Only the Azure layer around the cluster changes.", items:[
