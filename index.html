{q:"What is your experience with Azure?", d:`AWS is my primary platform, but I understand Azure fundamentals: Entra ID, Landing Zones, Resource Groups, VNets, VMs, Blob Storage, AKS. Cloud concepts transfer.`, e:`VMs ≈ EC2, Blob ≈ S3, AKS ≈ EKS, VNet ≈ VPC, NSG ≈ Security Group, Landing Zone ≈ Control Tower.`},
{q:"Could you work in Azure tomorrow?", d:`Yes. Identity, networking, compute, storage, Kubernetes, Terraform, and monitoring exist on both. I’d need time for Azure-specific details.`, e:`Terraform is the same workflow. I’d swap the AWS provider for azurerm.`},
{q:"Entra ID, Landing Zones, Azure networking?", d:`Entra ID: identity, SSO, federation, RBAC, Managed Identities. Landing Zone: a governed foundation before workloads, like Control Tower. Networking: VNets, subnets, NSGs, route tables, private endpoints, hub-and-spoke.`, e:`Federating Entra ID with AWS lets users sign in once and assume IAM roles.`},
{q:"How do you troubleshoot on AKS compared to EKS?", d:`The Kubernetes method is exactly the same: status, events, logs, then the layer that’s failing, with the same kubectl commands. What changes is the <strong>cloud layer around the cluster</strong>: the registry, identity, networking, and load balancers are Azure services instead of AWS ones.`, e:`<table class="mini"><tr><th>EKS (AWS)</th><th>AKS (Azure)</th></tr><tr><td>ECR</td><td>ACR (Azure Container Registry)</td></tr><tr><td>IRSA</td><td>Workload Identity</td></tr><tr><td>Node groups</td><td>Node pools</td></tr><tr><td>VPC CNI</td><td>Azure CNI (or CNI Overlay)</td></tr><tr><td>Security groups</td><td>NSGs (Network Security Groups)</td></tr><tr><td>ALB / NLB</td><td>Azure Load Balancer, Application Gateway</td></tr><tr><td>IAM</td><td>Entra ID + Azure RBAC</td></tr><tr><td>CloudWatch Container Insights</td><td>Azure Monitor Container Insights</td></tr></table>`},
{q:"How do you connect to AKS and start checking?", d:`Sign in with the Azure CLI, get the cluster credentials, then use kubectl exactly like on EKS. Use <code>az aks</code> commands for the cluster and node pools themselves.`, x:`<pre><code>az login
az aks get-credentials -g my-rg -n my-aks     # like: aws eks update-kubeconfig
kubectl get nodes
kubectl get pods -A
az aks show -g my-rg -n my-aks -o table         # cluster state, version
az aks nodepool list -g my-rg --cluster-name my-aks -o table
az aks check-acr -g my-rg -n my-aks --acr myacr.azurecr.io   # can nodes pull from ACR?
az aks command invoke -g my-rg -n my-aks --command "kubectl get pods -A"   # private cluster</code></pre>`},
{q:"Example: tracing an issue on AKS, step by step", d:`Same trace as on EKS, from the pod outward, switching to Azure only when the evidence points there.`, e:`<ol class="steps"><li><code>kubectl get pods</code>: new pods in <strong>ImagePullBackOff</strong>, restarts 0.</li><li><code>kubectl describe pod</code>: events say <code>401 Unauthorized</code> pulling from <code>myacr.azurecr.io</code>.</li><li>So it’s a permission problem, not a wrong tag. On EKS I’d check the node role’s ECR access. On AKS, I check the kubelet identity’s access to ACR: <code>az aks check-acr</code>.</li><li>It fails: the kubelet identity doesn’t have the <strong>AcrPull</strong> role.</li><li>Fix: <code>az aks update -g my-rg -n my-aks --attach-acr myacr</code>, then verify the pods pull and become Ready.</li><li>Prevent: attach ACR in the Terraform cluster definition, so every new cluster has it.</li></ol>`},
{q:"How do you check logs and metrics on AKS?", d:`<strong>Azure Monitor Container Insights</strong> collects pod, node, and container logs and metrics into a <strong>Log Analytics workspace</strong>. You query them with <strong>KQL</strong>, like CloudWatch Logs Insights on AWS. kubectl logs and events still work the same.`, x:`<pre><code>// errors from one namespace in the last hour
ContainerLogV2
| where TimeGenerated &gt; ago(1h) and PodNamespace == "orders"
| where LogMessage has "error"
| project TimeGenerated, PodName, LogMessage

// pods that are not running
KubePodInventory
| where PodStatus != "Running"
| summarize count() by Name, Namespace, PodStatus</code></pre>`},
{sc:1, q:"AKS Scenario 1: Can’t pull images from ACR", open:`“We created a new AKS cluster. Our app’s image is in ACR, but none of the pods start.”`, steps:[
[`What’s the pod status?`,`ImagePullBackOff, 0 restarts.`],
[`What’s the exact error in the events?`,`<code>failed to authorize: 401 Unauthorized</code> from <code>myacr.azurecr.io</code>.`],
[`What does <code>az aks check-acr</code> say?`,`The kubelet identity can’t authenticate to the registry.`]],
diag:`<strong>ImagePullBackOff from missing ACR permission.</strong> The cluster’s kubelet identity doesn’t have the AcrPull role on the registry. Same idea as an EKS node role without ECR read access.`,
proceed:`<ol class="steps"><li>Run <code>az aks update -g my-rg -n my-aks --attach-acr myacr</code> to grant AcrPull.</li><li>Verify with <code>az aks check-acr</code> and watch the pods pull and become Ready.</li><li>Prevent: attach ACR in Terraform when the cluster is created.</li></ol>`},
{sc:1, q:"AKS Scenario 2: LoadBalancer stuck without an IP", open:`“We exposed our app with a Service of type LoadBalancer on AKS. It’s been 20 minutes and there’s still no external IP.”`, steps:[
[`What does <code>kubectl get svc</code> show?`,`<code>EXTERNAL-IP: &lt;pending&gt;</code>.`],
[`What do the events on the Service say?`,`<code>Error syncing load balancer: failed to ensure load balancer ... AuthorizationFailed</code> on the virtual network subnet.`],
[`Is the cluster in a VNet you created yourself?`,`Yes, a custom VNet in another resource group.`]],
diag:`<strong>AKS can’t create the load balancer.</strong> The cluster’s managed identity doesn’t have permission on the custom VNet, so Azure refuses to build the load balancer.`,
proceed:`<ol class="steps"><li>Give the cluster identity the <strong>Network Contributor</strong> role on the subnet (or its resource group), through Terraform.</li><li>Watch the Service get an external IP, then test the app through it.</li><li>Prevent: include this role assignment in the cluster module whenever a custom VNet is used. On EKS, the same pattern is the AWS Load Balancer Controller’s IAM permissions.</li></ol>`},
{sc:1, q:"AKS Scenario 3: Pods stuck in ContainerCreating", open:`“We scaled up a node pool, but new pods stay in ContainerCreating on the new nodes.”`, steps:[
[`What do the pod events say?`,`<code>Failed to create pod sandbox ... failed to allocate address</code>.`],
[`Which network plugin does the cluster use?`,`Azure CNI, where every pod gets an IP from the VNet subnet.`],
[`How many free IPs are left in the node subnet?`,`Almost none.`]],
diag:`<strong>Subnet IP exhaustion with Azure CNI.</strong> Just like the EKS VPC CNI case: every pod needs a real subnet IP, and the subnet ran out.`,
proceed:`<ol class="steps"><li>Short term: move load or add a node pool in a subnet with free IPs.</li><li>Fix: use Azure CNI Overlay (pods get IPs from a separate private range) or a larger subnet.</li><li>Verify new pods get IPs and reach Running.</li><li>Prevent: size subnets for pod growth and alert on free IPs.</li></ol>`},
{sc:1, q:"AKS Scenario 4: Pod can’t read from Key Vault", open:`“Our app on AKS needs a secret from Azure Key Vault. It works locally, but in the cluster it gets access denied.”`, steps:[
[`What’s the exact error?`,`<code>403 Forbidden</code> from Key Vault.`],
[`How is the pod supposed to authenticate?`,`With Workload Identity, like IRSA on EKS.`],
[`Does the ServiceAccount have the <code>azure.workload.identity/client-id</code> annotation, and the pod the <code>azure.workload.identity/use: "true"</code> label?`,`The annotation is there, but the pod template is missing the label.`]],
diag:`<strong>Workload Identity not applied to the pod.</strong> Without the label, AKS doesn’t inject the token, so the app falls back to no identity and Key Vault denies it.`,
proceed:`<ol class="steps"><li>Add the <code>azure.workload.identity/use: "true"</code> label to the pod template and redeploy.</li><li>Also confirm the federated credential’s subject matches <code>system:serviceaccount:&lt;namespace&gt;:&lt;serviceaccount&gt;</code>, and the identity has Key Vault access.</li><li>Verify the app reads the secret.</li><li>Prevent: put the annotation and label in the Helm chart together.</li></ol>`},
]},

{id:"ask", title:"Questions to ask them", blurb:"Always have questions ready. Prepare 5, ask 2 or 3. Pick the ones that fit who you’re talking to.", items:[
{q:"How many questions should I ask, and when?", d:`Prepare 5, ask 2 or 3. In a technical round, ask about the platform and how the team works. Keep salary, benefits, and time off for the recruiter or the final stage.`, e:`If they already answered one of your questions during the interview, say so: “You mentioned you use Argo CD. How do you handle promotions from staging to prod?”`},
{q:"What does success look like in the first 90 days?", d:`Shows you’re already thinking about delivering.`, e:`<strong>Listen for:</strong> clear goals (take over the Helm charts, improve the pipeline) or vague ones (“get familiar”), which tells you how organized the team is.`},
{q:"What would my day-to-day look like, between new platform work and support?", d:`Tells you how much is building vs firefighting.`, e:`<strong>Listen for:</strong> the split. Mostly tickets and support is a very different job from mostly platform work.`},
{q:"What does the current stack look like, and what’s the biggest technical challenge right now?", d:`Shows real interest in their platform, and gives you a chance to connect your experience.`, e:`If they say “our Helm releases are hard to manage,” you can answer: “That’s something I’ve worked on, with values per environment and atomic upgrades.”`},
{q:"How do deployments to production work today?", d:`Shows you care about safe delivery.`, e:`<strong>Listen for:</strong> GitOps, approvals, rollbacks, or manual steps. Manual steps are where you can add value.`},
{q:"How are incidents handled? Is there an on-call rotation?", d:`Important to know before you join, and shows reliability matters to you.`, e:`<strong>Listen for:</strong> runbooks, postmortems, and how often people get paged.`},
{q:"How do you monitor the platform today, and what gaps do you see?", d:`Connects to your observability knowledge.`, e:`<strong>Listen for:</strong> Prometheus, Datadog, CloudWatch, and whether alerts are trusted or noisy.`},
{q:"How is the work split between IT Labs and the client’s team?", d:`Specific to a consulting role with a client in the room.`, e:`<strong>Listen for:</strong> who sets priorities, who you report to day to day, and how access and approvals work in the client’s environment.`},
{q:"How is the team structured, and who would I work with most closely?", d:`Helps you picture the role and the people.`, e:`<strong>Listen for:</strong> team size, other DevOps or platform engineers, and how closely you’d work with developers.`},
{q:"How do you support learning and certifications?", d:`Shows you want to keep growing.`, e:`<strong>Listen for:</strong> training budget, time for learning, and certification support.`},
{q:"Is there anything in my background that makes you hesitate?", d:`A strong closing question. It gives you one last chance to fix a doubt before they decide.`, e:`If they say “less Azure experience,” answer calmly: the concepts transfer, and you learn quickly, like you did with Argo Workflows.`},
{q:"What are the next steps in the process?", d:`Always end with this, so you know what to expect.`, e:`Then thank them, and say briefly that you’re interested in the role.`},
]},

{id:"design", title:"System design", blurb:"Say the flow first, then each layer.", items:[
{q:"Design a highly available application on AWS.", d:`Route 53 → ALB → app replicas across 2 to 3 AZs (EKS, ECS, or EC2 ASG) → RDS Multi-AZ, S3 for static files. Private subnets, only the ALB public, Security Groups, Secrets Manager, KMS, least-privilege IAM. Monitoring with CloudWatch or Datadog, Auto Scaling, automated backups and S3 versioning.`, e:`If one AZ goes down, the ALB sends traffic to the other AZs and RDS fails over to the standby automatically.<div class="flow">Users → Route 53 → ALB → App across AZs → RDS Multi-AZ</div>`},
{q:"Design a microservices deployment platform.", d:`GitOps. GitHub → GitHub Actions (tests, scans, OIDC, build) → ECR → update Helm values → ArgoCD → EKS. Each service is a Deployment + Service, Ingress or Gateway API behind an ALB, Istio if you need mTLS. IRSA, Secrets Manager, Trivy, RBAC. HPA plus Karpenter. Rollback is a git revert.`, e:`A bad release goes out. Revert the tag commit and ArgoCD puts the previous version back.<div class="flow">Developer → GitHub → Actions → ECR → Git → ArgoCD → EKS</div>`},
]},

{id:"star", title:"Behavioral & STAR", blurb:"Three STAR stories: difficult manager, difficult coworker, and a mistake you owned. Keep Action the longest part and speak in “I.”", items:[
{q:"What is the STAR method?", d:`A way to answer behavioral questions. <strong>Situation</strong>: the context. <strong>Task</strong>: what you had to do. <strong>Action</strong>: what you did. <strong>Result</strong>: what changed. Spend most of the time on Action and end with a clear result.`, e:`“Tell me about a conflict” → S: the teammate and the disagreement. T: what I needed to achieve. A: how I handled it. R: the outcome and what we changed.`},
{star:1, q:"Tell me about a difficult manager.", s:`Our company signed a new enterprise client, and my manager demanded we migrate a multi-tenant legacy application from an on-premises data center to AWS EKS within two weeks. He had already promised this timeline to executives without consulting the DevOps team. A proper migration, including containerizing the legacy app, setting up a secure network connection, and validating data sync, normally required six weeks to guarantee zero data loss.`, t:`I needed to prevent a rushed, unstable “lift-and-shift” migration that risked major database corruption, while still helping my manager meet the business deadline he promised to leadership.`, a:`Instead of flatly saying “that’s impossible,” I scheduled a 1-on-1 meeting and presented an objective risk-assessment roadmap. I proposed a phased hybrid approach: we would stand up the frontend and API layers on AWS EKS within the 2-week window, routing them back to our existing on-premises database via a secure, temporary AWS Site-to-Site VPN. This would satisfy the client’s timeline of seeing their application live in AWS. Then, we would stream database changes quietly over the following three weeks for a safe database cutover.`, r:`My manager appreciated that I prioritized his timeline while protecting the data. He agreed to the phased approach. The client went live on day 14 with zero user-facing downtime, and we migrated the database to AWS safely over the next month with a final cutover window of under 10 minutes.`, fu:[
["Why did you choose a VPN instead of AWS Direct Connect?", `We chose a standard AWS VPN purely because of our two-week timeline. Setting up a dedicated AWS Direct Connect connection requires weeks of physical coordination with internet providers and AWS. A VPN can be configured and deployed using Terraform in less than an hour using our existing firewalls. Since our database replication traffic wasn’t large enough to overload a typical internet connection, the VPN was the fastest and most secure way to bridge both environments.`],
["How did you handle the latency between EKS and the on-premises database during those 3 weeks?", `That latency was our biggest risk. Before moving anything, I ran network tests and found a 15-millisecond delay between AWS and our local servers. First, we used Redis on AWS to cache data that rarely changes, so we didn’t fetch it from the database every time. Second, we left the heavy backend code running next to the database on-premises during phase one, moving only the lightweight web components and API paths to EKS. This kept traffic over the VPN as low as possible.`],
["How did you prevent data loss during the final database cutover?", `We used a real-time data sync tool that continually streamed every database update from the old server to AWS. On the night of the switch, we put the old app into read-only mode so users couldn’t add new data. We watched the sync logs until they hit zero, which proved both databases were identical. Then we updated our Route 53 DNS records to point to the new cloud application and turned it fully on. The entire switch took less than 10 minutes.`],
["Since the client was multi-tenant, how did you handle isolation inside EKS?", `We relied on Namespaces and Network Policies to act like virtual walls, keeping each customer’s containers separated and blocked from each other’s networks. We also used IAM Roles for Service Accounts (IRSA) so a pod belonging to Tenant A could only access Tenant A’s S3 buckets and database schemas, never Tenant B’s.`]]},
{star:1, q:"Tell me about a difficult coworker.", s:`A senior QA automation lead constantly complained that our new CI/CD pipeline was “flaky and broken” because his automated smoke tests kept failing during nightly feature deployments. He openly blamed the DevOps infrastructure in cross-functional Slack channels, claiming our deployment stack was unreliable, which started damaging my team’s reputation.`, t:`I needed to identify the exact root cause of the deployment failures and stop the public finger-pointing, while collaborating with the QA lead to fix the delivery pipeline.`, a:`I reached out to him directly via a private call. I avoided getting defensive and instead asked if we could do a deep-dive log analysis together. During our session, we traced the timeline between GitHub Actions and Argo CD. We discovered the pipeline infrastructure was stable, but there was a race condition: our GitHub Actions workflow was committing the new image tag to our GitOps repository a few seconds before the <code>docker push</code> to Amazon ECR had finished uploading the layers. Argo CD would instantly try to reconcile the cluster, fail with an <code>ImagePullBackOff</code> error because the tag didn’t exist in ECR yet, and the QA tests hit a broken environment. Instead of shifting blame, I worked with him to modify the GitHub Actions workflow, adding a check step that verified the image was available in ECR before committing to Git and alerting Argo CD.`, r:`The nightly deployment failure rate immediately dropped from 60% to 0%, giving him a stable environment for his test suites. The QA lead publicly apologized in Slack, credited DevOps for solving the bottleneck, and we set up a weekly sync to review deployment timelines together, which eliminated the cross-team friction.`, fu:[
["How exactly did you implement the ECR check step in GitHub Actions?", `Instead of a basic <code>sleep</code> command, which is unreliable, I used the AWS CLI inside the workflow. Right after the <code>docker push</code> step, I added a loop that ran <code>aws ecr describe-images</code> every 5 seconds to check whether the new image tag was uploaded and visible, with a maximum timeout of 60 seconds. The pipeline was blocked until AWS confirmed the image was there. Then the workflow updated the GitOps repository.`],
["Why didn’t Argo CD self-heal? It usually retries when an ImagePullBackOff occurs.", `Argo CD does retry, but the issue was the timing of the QA tests. The old pipeline triggered the QA tests immediately after committing to Git. When the first image pull failed with <code>ImagePullBackOff</code>, Kubernetes applied a back-off delay, waiting up to 5 minutes before trying again. While it waited, the QA tests ran against a half-deployed environment and failed. Fixing it at the source made the first sync succeed, so the environment was ready when the tests started.`],
["Did you consider Argo CD sync waves or health checks instead?", `We considered sync waves and resource hooks. However, the root cause was outside the Kubernetes cluster. The image didn’t exist in our registry yet, and Argo CD has no native way to check whether an external registry like ECR is still uploading. The cleanest fix was a strict order of operations in the pipeline: build the image, verify it is in ECR, then trigger the GitOps deployment.`],
["How did GitHub Actions commit to the GitOps repo? Were you pushing directly to main?", `Yes, we pushed directly to main in the infrastructure repository, but securely. The runner used a dedicated SSH deploy key that could only modify that one repository. A script cloned the repo, used <code>yq</code> to swap the old image tag for the new one in the YAML manifest, committed with a message referencing the build number, and pushed to main. That gave us a clean, automated history for every deployment.`]]},
{star:1, q:"Tell me about a time you made a mistake.", s:`We were updating our network infrastructure using Terraform modules. I needed to change a security group rule in our staging environment to allow a new internal microservice to communicate.`, t:`My task was to apply the updated Terraform code. However, I didn’t realize my local terminal session was still authenticated and pointing to our production AWS account instead of staging, because I hadn’t cleared my environment variables.`, a:`I ran <code>terraform apply</code>. Because I was moving too quickly and assumed I was in staging, I skimmed the plan and missed a critical warning: Terraform was going to destroy and recreate a core public-facing load balancer security group instead of just adding a rule. The moment I typed “yes,” live API traffic dropped. I immediately owned it. I didn’t panic or try to hide it. I posted in our emergency Slack channel: “I just applied a bad Terraform change to production. Network access is down, and I am reverting it now.” I checked our Git history, found the last stable commit of our infrastructure code, and ran a targeted <code>terraform apply</code> to restore the original security group rules. Because I owned it instantly, the team knew exactly what happened, and we restored traffic in under 4 minutes.`, r:`The mistake caused a 4-minute blip, but my manager appreciated my immediate honesty and speed. To make sure it couldn’t happen again, I led a project with two parts. First, we moved all production applies to Terraform Cloud, so every production change needs an approved pull request and runs in the pipeline, not from a laptop. Second, we set up AWS IAM Identity Center so engineers get read-only access to production by default, which means a local terminal can no longer change production even by mistake.`, fu:[
["Why did Terraform want to destroy and recreate the security group instead of updating it?", `Because of how the resource block was written. Someone had hardcoded the security group’s <code>name</code> inside the module instead of using a dynamic prefix. Some properties, like the name, can’t be updated in place in AWS, so Terraform forces a destroy and recreate. Because I skimmed the plan, I missed the <code>-/+</code> replace marker in the output.`],
["How did you fix your local setup right after the incident?", `The same afternoon, I did two things. First, I updated our shell profiles to show a colored indicator in the terminal prompt with the active AWS account and Git branch. Second, I introduced a mandatory Terraform wrapper script for local use. If you run <code>terraform apply</code> against a production workspace, the script stops you, shows a warning, and makes you type the full target AWS account ID to confirm.`],
["What does Terraform Cloud do and what does IAM Identity Center do?", `They solve two different problems. Terraform Cloud controls <strong>how</strong> changes are applied: the plan is posted on the pull request, a reviewer approves it, and the apply runs in Terraform Cloud with its own AWS credentials. IAM Identity Center controls <strong>who</strong> can access which AWS account and with what permissions: engineers sign in with SSO and get read-only access to production, so they can look but can’t change anything. Together, the only way to change production is through a reviewed pull request.`],
["How does the new workflow with Terraform Cloud prevent this now?", `Engineers can no longer run <code>terraform apply</code> against production from their laptops. All infrastructure changes go through a GitHub pull request. When a PR opens, the pipeline runs <code>terraform plan</code> and posts the output in the PR for review. A senior engineer must approve it. After merge to main, the apply runs in the pipeline, not on anyone’s laptop.`]]},
{q:"How do you prioritize your work?", d:`By impact and urgency. Production incidents and security issues come first, then work that’s blocking other people, then planned project work. When two priorities conflict, I ask my manager to rank them and I tell stakeholders what moves.`, e:`I’m building a Terraform module and a production deployment starts failing. I pause the module, fix the pipeline, post an update in the channel, then go back. If two teams both call their request urgent, I bring both to my manager instead of guessing.`},
{q:"Tell me about a production incident.", d:`At Accenture Federal Services, an application looked healthy, but users couldn’t reach it through the load balancer. The targets were unhealthy because the app listened on a different port than the health check expected.`, e:`I fixed the configuration, redeployed, and the targets went healthy. We documented the requirements and added a pre-release check for ports and health check settings.`},
{q:"Tell me about something you learned quickly.", d:`<p>One example was Argo Workflows.</p><p>I had experience with GitHub Actions and CI/CD pipelines, but Argo Workflows was new to me. I needed to understand how workflow steps execute as Kubernetes pods and how to integrate security scanning and deployment processes inside the cluster.</p>`, e:`<p>I started by studying the architecture, building small proof-of-concept workflows, and gradually expanding them into a complete pipeline with Trivy scanning, quality gates, ECR image publishing, and GitOps deployment through ArgoCD.</p><p>Within a short period, I was able to design and explain a full Kubernetes-native CI/CD pipeline and document the entire process.</p><p>That experience reinforced my ability to learn new technologies quickly when a project requires them.</p>`},
{q:"What is your biggest strength?", d:`<p>My biggest strength is troubleshooting.</p><p>When something breaks, I focus on gathering evidence instead of making assumptions. I break the problem into smaller pieces, test hypotheses, and use the results to guide my next steps.</p>`, e:`<p>A good example is the CTF challenge. I didn't know the answer up front, but by collecting evidence, testing assumptions, and changing direction when needed, I was able to narrow down the problem and continue making progress.</p><p>I use the same approach in production environments. Whether it's Kubernetes, AWS, networking, or CI/CD pipelines, I rely on a structured troubleshooting process to identify root causes and resolve issues efficiently.</p>`, x:`<div class="blk"><div class="lbl">🔁 Another example you can use</div><p>On a Quasar deployment, the app wasn’t reachable over HTTPS. It looked like an app problem, but after checking DNS, the load balancer, NGINX, and the certificates, the certificate and private key didn’t match and there was a Subject Alternative Name mismatch with the DNS name.</p></div>`},
{q:"Why are you looking for a new role? What have you been doing since your last one?", d:`Since leaving Accenture Federal Services, I’ve been freelancing as an independent DevOps and DevSecOps engineer and building real projects to go deeper. I built Secure Mesh Pipeline for secure delivery end to end, and I’m building ShieldOps now. I’m looking for a team where I can bring that hands-on work into a production platform and keep growing with strong engineers.`, e:`Keep it forward-looking. Talk about what you’re moving toward, not what you left.`},
{q:"What is your greatest weakness?", d:`Pick a real weakness, show what you do about it, and show it’s improving.`, e:`“I can go too deep into a problem before asking for help, because I like solving it myself. Now I timebox it: after about 45 minutes, I share what I’ve found and ask for a second look. It usually saves time, and the team learns what I’ve already ruled out.”`, note:`This is a template. Use it only if it’s true for you, or swap in your own real weakness with the same structure.`},
{q:"How do you handle pressure or tight deadlines?", d:`I stay calm by breaking the work into what must be done now and what can be phased. I explain the risks with facts, offer options, and keep everyone updated.`, e:`My manager had promised a two-week migration that normally takes six. I proposed a phased plan: the app live in AWS on day 14, the database moved safely over the next weeks. The client went live on time with no downtime.`},
{q:"Tell me about a time you improved a process.", d:`Show the problem, what you changed, and the result that lasted.`, e:`At Accenture Federal Services, a release failed because the app listened on a different port than the load balancer health check. After fixing it, we documented the requirements and added deployment validation checks for ports and health check settings before production releases, so the same mismatch couldn’t reach production again.`},
{q:"How do you handle on-call and incidents?", d:`Restore service first, communicate early, then find the root cause. I post what I know, what I’m checking, and the impact, and I update regularly. Afterward, a blameless postmortem with concrete follow-ups.`, e:`During an incident: roll back first if a release caused it, update the channel every 15 to 30 minutes, then write the timeline, root cause, and one or two changes that prevent it next time.`},
{q:"How do you keep your skills up to date?", d:`I learn by building. I study after hours, take classes, and turn what I learn into real projects. I’m also renewing my Terraform Associate certification.`, e:`To learn GitOps and service mesh properly, I built Secure Mesh Pipeline end to end. Now I’m adding an AI incident investigator with LangGraph to ShieldOps.`},
{q:"Where do you see yourself in 3 to 5 years?", d:`Growing deeper as a platform and DevSecOps engineer: owning larger parts of the platform, making delivery safer and faster, and mentoring others.`, e:`“I’d like to be the person the team trusts with the platform: secure pipelines, reliable clusters, and good observability, and helping newer engineers get there too.”`},
{q:"How do you handle feedback or code review comments?", d:`I treat review as a way to catch problems early, not as criticism. I ask questions when I don’t agree, and I explain my reasoning with facts.`, e:`A reviewer flagged that my Terraform change would replace a resource. I checked the plan, confirmed it, and changed the approach. That’s exactly what review is for.`},
{q:"Why this company? Why this role?", d:`Connect three things: what they do, what the role needs, and what you’ve done. Research the company and the client before the interview.`, e:`“The role is centered on Kubernetes, Helm, Terraform, and troubleshooting, which is exactly where I’ve spent my time, on EKS and in my own projects. I also like consulting work, because every client’s platform teaches you something new.”`, note:`Fill in one specific thing you learned about IT Labs or the client from their website or LinkedIn.`},
{q:"What are your salary expectations?", d:`Research the market range for the role and location first. Give a range, show you’re flexible on the full package, and ask about their budget if it’s early.`, e:`“Based on the role and market, I’m looking in the range of [your range], but I’m flexible depending on the full package and the scope. What range do you have budgeted?”`, note:`Put your real researched range in before the call. In a technical round, it usually won’t come up.`},
{q:"Do you have any questions for us?", d:`Always say yes. Prepare 5 and ask 2 or 3.`, e:`See the <strong>🙋 Questions to ask them</strong> section at the end of the path.`},
{q:"Why should we hire you?", d:`Solid AWS and Kubernetes experience across infrastructure, deployment, and observability. I learn fast, and I fix gaps without waiting to be asked.`, e:`I’ve backed that up with real projects like Secure Mesh Pipeline and ShieldOps, not just talk.`},
{q:"What work environment are you looking for?", d:`Collaborative, with DevOps and engineering working closely. Ownership of the infrastructure side, a voice in architecture, and a team that values automation and reliability.`, e:`Teams that do blameless post-mortems and actually change things after an incident.`},
]},
];

const FLOW=[
{n:1,t:"Get ready",i:"🎯",c:"#C026D3",ids:["experience","itlabs"]},
{n:2,t:"Code",i:"💻",c:"#EA580C",ids:["git","python"]},
{n:3,t:"Cloud & infrastructure",i:"☁️",c:"#D97706",ids:["aws","terraform","ansible","azure"]},
{n:4,t:"Kubernetes platform",i:"☸️",c:"#0284C7",ids:["k8s","networking","k8s-security"]},
{n:5,t:"Deploy & release",i:"🚀",c:"#1E3A8A",ids:["helm","gitops"]},
{n:6,t:"Run & observe",i:"📡",c:"#9333EA",ids:["istio","observability"]},
{n:7,t:"Troubleshoot",i:"🩺",c:"#15803D",ids:["troubleshooting","k8s-troubleshooting","pending","imagepull","crashloop","rollout","http503","dns","nodes"]},
{n:8,t:"Design & behavioral",i:"🧠",c:"#B8860B",ids:["design","star","ask"]}];
(function(){const order=FLOW.flatMap(g=>g.ids);SECTIONS.sort((a,b)=>{const x=order.indexOf(a.id),y=order.indexOf(b.id);return (x<0?999:x)-(y<0?999:y);});})();
const PROJECTS = [
["Kubernetes, ArgoCD, GitOps, IRSA, Istio", "Secure Mesh Pipeline"],
["Terraform", "Secure Mesh Pipeline + QuasarPlus"],
["Ansible, JFrog, NGINX", "QuasarPlus"],
["Datadog, monitoring", "Datadog Observability Platform"],
["Troubleshooting", "Quasar SSL issue + CTF"],
["Bedrock, LangGraph, AI", "ShieldOps"],
];

const REMINDERS = [
"Answer shape: a short meaning first, then one small practical example.",
"Keep it conversational. A short pause to think sounds more real than a perfect recital.",
"Kubernetes security and troubleshooting get the most follow-ups.",
"If you don’t know, say so and explain what you’d check.",
"For STAR, spend most of the time on Action and always end with a result.",
"If Istio comes up, say Envoy sits next to the application container, not next to the pod.",
];

<script>
(function(){
const KEY="ivprep:v2";
let status={};
try{status=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){status={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(status))}catch(e){}};
SECTIONS.forEach(s=>s.items.forEach((it,i)=>{it.id=s.id+"-"+i;it.sec=s;}));
const ALL=SECTIONS.flatMap(s=>s.items);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip=h=>{const d=document.createElement("div");d.innerHTML=h||"";return d.textContent;};
ALL.forEach(it=>{const parts=[it.q,it.d,it.e,it.c,it.x,it.s,it.t,it.a,it.r,it.note,it.open,it.diag,it.proceed,...(it.fu||[]).flat(),...(it.steps||[]).flat()];it.text=parts.map(strip).join(" ").toLowerCase();});
const chev=`<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>`;
const solidCount=s=>s.items.filter(i=>status[i.id]==="solid").length;
const THEME={ask:["🙋","#9A3412","#FFEDD5"],helm:["⛵","#1E3A8A","#DBEAFE"],dns:["🧭","#0E7490","#CFFAFE"],nodes:["🖥️","#475569","#E2E8F0"],rollout:["🚦","#65A30D","#ECFCCB"],itlabs:["🎯","#C026D3","#FAE8FF"],git:["🌿","#EA580C","#FFEDD5"],experience:["💼","#2563EB","#DBEAFE"],troubleshooting:["🧩","#E11D48","#FFE4E6"],"k8s-troubleshooting":["🩺","#15803D","#DCFCE7"],crashloop:["🚨","#CA8A04","#FEF9C3"],pending:["⏳","#0369A1","#E0F2FE"],imagepull:["📦","#BE185D","#FCE7F3"],http503:["🔌","#6D28D9","#EDE9FE"],terraform:["🏗️","#7C3AED","#EDE9FE"],gitops:["🔄","#0D9488","#CCFBF1"],k8s:["☸️","#0284C7","#E0F2FE"],networking:["🌐","#4F46E5","#E0E7FF"],"k8s-security":["🔐","#059669","#D1FAE5"],istio:["🕸️","#0891B2","#CFFAFE"],aws:["☁️","#D97706","#FEF3C7"],observability:["📊","#9333EA","#F3E8FF"],ansible:["🛠️","#DB2777","#FCE7F3"],python:["🐍","#16A34A","#DCFCE7"],azure:["🔷","#1D4ED8","#DBEAFE"],design:["📐","#0F766E","#CCFBF1"],star:["⭐","#B8860B","#FBF0CC"]};
const TH=id=>THEME[id]||["📌","#4F46E5","#EEF0FF"];
const cv=id=>{const t=TH(id);return `--c:${t[1]};--cs:${t[2]}`;};
 const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
const wrapP=h=>/^\s*<(ol|pre|div|ul)/.test(h)?h:`<p>${h}</p>`;

function hl(html,term){
  if(!term) return html;
  const re=new RegExp("("+term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
  const d=document.createElement("div");d.innerHTML=html;
  const walk=n=>{ if(n.nodeType===3){ re.lastIndex=0; if(re.test(n.data)){re.lastIndex=0;const sp=document.createElement("span");sp.innerHTML=esc(n.data).replace(re,"<mark>$1</mark>");n.replaceWith(...sp.childNodes);} } else if(n.nodeName!=="MARK") [...n.childNodes].forEach(walk); };
  [...d.childNodes].forEach(walk); return d.innerHTML;
}


function scenarioHTML(it,full){
  const h=full?"":"hid";
  let x=`<div class="scn"><div class="say open"><span class="who">🎤 Interviewer opens with</span>${it.open}</div>`;
  it.steps.forEach(st=>{x+=`<div class="stp ${h}"><div class="say me"><span class="who">🙋 You ask</span>${st[0]}</div><div class="say int"><span class="who">🎤 Interviewer</span>${st[1]}</div></div>`;});
  x+=`<div class="blk ex stp ${h}"><div class="lbl">🎯 What it is</div><div>${it.diag}</div></div>`;
  x+=`<div class="blk proceed stp ${h}"><div class="lbl">🛠️ How I will proceed</div><div>${it.proceed}</div></div>`;
  if(!full) x+=`<div class="scctl"><span class="hint">Think of your next question first, then tap.</span><button class="btn tint" data-next>🙋 Ask my first question</button><button class="btn" data-all>Show everything</button><button class="btn" data-reset hidden>↺ Start over</button></div>`;
  return x+`</div>`;
}
function nextLabel(scn){
  const n=scn.querySelector(".stp.hid");
  if(!n) return null;
  if(n.classList.contains("proceed")) return "🛠️ How will I proceed?";
  if(n.classList.contains("ex")) return "🎯 What is it?";
  return "🙋 Ask my next question";
}

function body(it,full){
  if(it.sc) return scenarioHTML(it,full);
  let h="";
  if(it.note) h+=`<div class="caution">${it.note}</div>`;
  if(it.star){
    h+=`<div class="star">
      <b class="s">S</b><div><span class="k">Situation</span>${it.s}</div>
      <b class="t">T</b><div><span class="k">Task</span>${it.t}</div>
      <b class="a">A</b><div><span class="k">Action</span>${it.a}</div>
      <b class="r">R</b><div><span class="k">Result</span>${it.r}</div></div>`;
    if(it.fu&&it.fu.length) h+=`<div class="fu"><h4>Follow-up questions</h4>${it.fu.map(f=>`<details><summary>${f[0]}</summary><div>${f[1]}</div></details>`).join("")}</div>`;
    return h;
  }
  h+=`<div class="blk"><div class="lbl">📖 Meaning</div>${wrapP(it.d)}</div>`;
  if(it.c) h+=`<div class="blk chk"><div class="lbl">🔍 What I check</div>${wrapP(it.c)}</div>`;
  if(it.e) h+=`<div class="blk ex"><div class="lbl">${it.t?"✅ Answer":"💡 Example"}</div>${wrapP(it.e)}</div>`;
  if(it.x) h+=it.x;
  return h;
}
function qHTML(it,term,showSec,idx){
  const st=status[it.id]||"";
  const mark=st==="solid"?"✓":st==="review"?"!":(idx+1);
  return `<div class="q" data-id="${it.id}" style="${cv(it.sec.id)}"><button aria-expanded="false"><span class="num ${st}">${mark}</span><span class="qt">${showSec?`<span class="sec-tag">${TH(it.sec.id)[0]} ${esc(it.sec.title)}</span><br>`:""}${hl(esc(it.q),term)}</span>${chev}</button>
  <div class="ans">${hl(body(it),term)}<div class="mark"><button class="chip g" data-mark="solid" aria-pressed="${st==="solid"}">✓ I can say this</button><button class="chip r" data-mark="review" aria-pressed="${st==="review"}">Needs work</button></div></div></div>`;
}

let navOpen=new Set(), homeClosed=new Set();
try{navOpen=new Set(JSON.parse(localStorage.getItem("ivprep:navOpen")||"[]"));homeClosed=new Set(JSON.parse(localStorage.getItem("ivprep:homeClosed")||"[]"));}catch(e){}
const saveUI=()=>{try{localStorage.setItem("ivprep:navOpen",JSON.stringify([...navOpen]));localStorage.setItem("ivprep:homeClosed",JSON.stringify([...homeClosed]));}catch(e){}};
function renderNav(active){
  const act=FLOW.find(g=>g.ids.includes(active));
  if(act) navOpen.add(act.n);
  let h=`<a href="javascript:void(0)" data-go="home" class="${active==="home"?"on":""}" style="--c:#4F46E5;--cs:#EEF0FF"><span class="ic">🏠</span><span class="nm">Start here</span></a>
  <div class="navtools"><button data-navall="open">Expand all</button><button data-navall="close">Collapse all</button></div>`;
  FLOW.forEach(g=>{const open=navOpen.has(g.n);
    const secs=g.ids.map(id=>SECTIONS.find(x=>x.id===id)).filter(Boolean);
    const done=secs.reduce((a,s)=>a+solidCount(s),0), tot=secs.reduce((a,s)=>a+s.items.length,0);
    h+=`<button class="grp" data-grp="${g.n}" aria-expanded="${open}" style="--g:${g.c}"><b>${g.n}</b><span class="gt">${g.i} ${esc(g.t)}</span><span class="gc">${done}/${tot}</span><svg class="gv" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg></button><div class="gbody" ${open?"":"hidden"}>`;
    secs.forEach(s=>{const n=solidCount(s);h+=`<a href="javascript:void(0)" data-go="${s.id}" class="${active===s.id?"on":""}" style="${cv(s.id)}"><span class="ic">${TH(s.id)[0]}</span><span class="nm">${esc(s.title)}</span><span class="cnt ${n===s.items.length?"done":""}">${n}/${s.items.length}</span></a>`;});
    h+=`</div>`;});
  const rv=ALL.filter(i=>status[i.id]==="review").length;
  h+=`<hr><a href="javascript:void(0)" data-go="review" class="${active==="review"?"on":""}" style="--c:#B45309;--cs:#FEF3C7"><span class="ic">🔁</span><span class="nm">Needs work</span><span class="cnt">${rv}</span></a>`;
  $("side").innerHTML=h;
}
function renderHome(){
  const ready=ALL.filter(i=>status[i.id]==="solid").length, rv=ALL.filter(i=>status[i.id]==="review").length;
  $("main").innerHTML=`<section class="hero"><div class="hi">Hi Shammah 👋 <span class="ver" style="font-weight:600;opacity:.85;margin-left:8px;font-size:13px;background:rgba(255,255,255,.18);border-radius:999px;padding:2px 10px">Version 16 · Sep 28</span></div><h1>Ready for your next interview?</h1>
  <p class="lead">Every answer starts with a short meaning, then a practical example. Open a section, say it out loud, and mark what you’ve got.</p>
  <div class="stats"><div class="stat"><b>${ALL.length}</b><span>Questions</span></div><div class="stat"><b style="color:var(--ok)">${ready}</b><span>Ready</span></div><div class="stat"><b style="color:#D97706">${rv}</b><span>Needs work</span></div><div class="stat"><b>${SECTIONS.length}</b><span>Sections</span></div></div>
  <div class="acts"><button class="btn primary" id="goFC">🃏 Practice with flashcards</button><a class="btn" href="javascript:void(0)" data-go="star" style="text-decoration:none;color:var(--ink)">⭐ STAR stories</a></div></section>
  <section class="intro"><span class="qmark">“</span><h2>Tell me about yourself</h2><div class="hint">The first question in almost every interview. Aim for about 90 seconds.</div>
  <div class="script">${TMAY}</div>
  <div class="rehearse"><button class="btn primary" id="rh">▶ Start rehearsal</button><span class="clock" id="rhClock">0:00</span><span class="hint">Say it out loud. The timer turns amber after 2 minutes.</span></div></section>
  <h2 class="sub">Your DevOps path</h2><div class="flowline">${FLOW.map(g=>`<span>${g.i} ${esc(g.t)}</span>`).join("→")}</div><div class="stagetools"><button class="btn" data-stageall="open">Expand all</button><button class="btn" data-stageall="close">Collapse all</button></div>${FLOW.map(g=>`<div class="stage" style="--g:${g.c}"><button class="stage-h" data-stage="${g.n}" aria-expanded="${!homeClosed.has(g.n)}"><b>${g.n}</b><span>${g.i} ${esc(g.t)}</span><small>${g.ids.length} sections</small><svg class="gv" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg></button><div class="tiles" ${homeClosed.has(g.n)?"hidden":""}>${g.ids.map(id=>SECTIONS.find(x=>x.id===id)).filter(Boolean).map(s=>{const n=solidCount(s);return `<a class="tile" href="javascript:void(0)" data-go="${s.id}" style="${cv(s.id)}"><span class="ic">${TH(s.id)[0]}</span><span style="flex:1;min-width:0"><b>${esc(s.title)}</b><span>${s.items.length} questions · ${n} ready</span><div class="bar"><i style="width:${n/s.items.length*100}%"></i></div></span></a>`}).join("")}</div></div>`).join("")}
  <div class="grid2"><section class="panel"><h2>📝 Before the call</h2><ul class="rem">${REMINDERS.map(r=>`<li><span>${esc(r)}</span></li>`).join("")}</ul></section>
  <section class="panel"><h2>🗂️ Which project to use</h2><table>${PROJECTS.map(p=>`<tr><td>${esc(p[0])}</td><td>${esc(p[1])}</td></tr>`).join("")}</table></section></div>`;
  $("goFC").onclick=()=>openFC("all");
  let t=null,start=0;
  $("rh").onclick=()=>{ if(t){clearInterval(t);t=null;$("rh").textContent="▶ Start rehearsal";return;}
    start=Date.now();$("rh").textContent="■ Stop";
    t=setInterval(()=>{const c=$("rhClock");if(!c){clearInterval(t);return;}const s=Math.floor((Date.now()-start)/1000);c.textContent=fmt(s);c.classList.toggle("over",s>120);},250);};
}
function renderList(title,blurb,items,opts={}){
  const n=items.filter(i=>status[i.id]==="solid").length;
  const t=opts.theme||["🔎","#4F46E5","#EEF0FF"];
  $("main").innerHTML=`<div class="banner" style="--c:${t[1]};--cs:${t[2]}"><div class="big">${t[0]}</div><h1>${esc(title)}</h1>${blurb?`<p>${esc(blurb)}</p>`:""}
  <div class="prog"><div class="meter"><i style="width:${items.length?n/items.length*100:0}%"></i></div><span class="meta">${n} of ${items.length} ready</span></div>
  ${items.length?`<div class="tools"><button class="btn" id="expand">Show all answers</button><button class="btn tint" id="drill">🃏 Practice this section</button></div>`:""}</div>
  ${items.length?`<div class="qlist">${items.map((it,i)=>qHTML(it,opts.term,opts.showSec,i)).join("")}</div>`:`<div class="empty">${opts.empty}</div>`}`;
  const ex=$("expand"); if(ex) ex.onclick=()=>{const open=ex.textContent.startsWith("Show");document.querySelectorAll(".q").forEach(q=>{q.classList.toggle("open",open);q.firstElementChild.setAttribute("aria-expanded",open)});ex.textContent=open?"Hide all answers":"Show all answers";};
  const dr=$("drill"); if(dr) dr.onclick=()=>openFC(opts.scope||"all");
}
let current="home";
function route(){
  const term=$("q").value.trim();
  if(term.length>1){const t=term.toLowerCase();renderList(`Results for “${term}”`,"",ALL.filter(i=>i.text.includes(t)),{term,showSec:true,empty:"No questions match. Try a tool name like IRSA or kube-proxy."});renderNav(null);return;}
  const h=current||"home";
  if(h==="review") renderList("Needs work","Questions you flagged. Say each one out loud until it feels natural.",ALL.filter(i=>status[i.id]==="review"),{showSec:true,scope:"review",theme:["🔁","#B45309","#FEF3C7"],empty:"Nothing flagged yet. Mark answers as “Needs work” and they’ll show up here."});
  else{const s=SECTIONS.find(x=>x.id===h); if(s) renderList(s.title,s.blurb,s.items,{scope:s.id,theme:TH(s.id)}); else {current="home";renderHome();}}
  renderNav(current); window.scrollTo(0,0);
}
document.addEventListener("click",e=>{
  const gb=e.target.closest("[data-grp]");
  if(gb){const n=+gb.dataset.grp;navOpen.has(n)?navOpen.delete(n):navOpen.add(n);saveUI();const o=navOpen.has(n);gb.setAttribute("aria-expanded",o);gb.nextElementSibling.hidden=!o;return;}
  const na=e.target.closest("[data-navall]");
  if(na){if(na.dataset.navall==="open")FLOW.forEach(g=>navOpen.add(g.n));else navOpen.clear();saveUI();renderNav($("q").value.trim().length>1?null:current);return;}
  const sh=e.target.closest("[data-stage]");
  if(sh){const n=+sh.dataset.stage;homeClosed.has(n)?homeClosed.delete(n):homeClosed.add(n);saveUI();const o=!homeClosed.has(n);sh.setAttribute("aria-expanded",o);sh.nextElementSibling.hidden=!o;return;}
  const sa=e.target.closest("[data-stageall]");
  if(sa){if(sa.dataset.stageall==="close")FLOW.forEach(g=>homeClosed.add(g.n));else homeClosed.clear();saveUI();document.querySelectorAll("[data-stage]").forEach(x=>{const o=!homeClosed.has(+x.dataset.stage);x.setAttribute("aria-expanded",o);x.nextElementSibling.hidden=!o;});return;}
  const sc=e.target.closest("[data-next],[data-all],[data-reset]");
  if(sc){const scn=sc.closest(".scn");const ctl=scn.querySelector(".scctl");
    if(sc.hasAttribute("data-next")){const n=scn.querySelector(".stp.hid");if(n)n.classList.remove("hid");}
    if(sc.hasAttribute("data-all"))scn.querySelectorAll(".stp.hid").forEach(x=>x.classList.remove("hid"));
    if(sc.hasAttribute("data-reset"))scn.querySelectorAll(".stp").forEach(x=>x.classList.add("hid"));
    const lab=nextLabel(scn),nb=ctl.querySelector("[data-next]");
    if(lab){nb.hidden=false;nb.textContent=sc.hasAttribute("data-reset")?"🙋 Ask my first question":lab;ctl.querySelector("[data-all]").hidden=false;ctl.querySelector("[data-reset]").hidden=true;}
    else{nb.hidden=true;ctl.querySelector("[data-all]").hidden=true;ctl.querySelector("[data-reset]").hidden=false;}
    return;}
  const g=e.target.closest("[data-go]");
  if(g){e.preventDefault();closeMenu();go(g.dataset.go);return;}
  const head=e.target.closest(".q > button");
  if(head){const q=head.parentElement;const o=q.classList.toggle("open");head.setAttribute("aria-expanded",o);return;}
  const mk=e.target.closest(".chip[data-mark]");
  if(mk){const q=mk.closest(".q");const id=q.dataset.id;const v=mk.dataset.mark;
    if(status[id]===v) delete status[id]; else status[id]=v; save();
    q.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",status[id]===c.dataset.mark));
    {const nm=q.querySelector(".num");nm.className="num "+(status[id]||"");nm.textContent=status[id]==="solid"?"✓":status[id]==="review"?"!":([...q.parentElement.children].indexOf(q)+1);}
    renderNav($("q").value.trim().length>1?null:current);
    const m=document.querySelector(".meter i"),meta=document.querySelector(".banner .meta");
    if(m){const ids=[...document.querySelectorAll(".q")].map(x=>x.dataset.id);const n=ids.filter(i=>status[i]==="solid").length;m.style.width=(ids.length?n/ids.length*100:0)+"%";meta.textContent=`${n} of ${ids.length} ready`;}
    return;}
  if(e.target.closest("nav.side a")) closeMenu();
});
function go(id){current=id;$("q").value="";route();}
let st;$("q").addEventListener("input",()=>{clearTimeout(st);st=setTimeout(route,120);});
$("brand").onclick=()=>go("home");
const closeMenu=()=>{$("side").classList.remove("open");$("scrim").classList.remove("show");};
$("menuBtn").onclick=()=>{$("side").classList.add("open");$("scrim").classList.add("show");};
$("scrim").onclick=closeMenu;

let deck=[],pos=0,revealed=false,timer=null,cardStart=0;
const scopeSel=$("fcScope");
scopeSel.innerHTML=`<option value="all">All questions</option><option value="notsolid">Not ready yet</option><option value="review">Needs work</option><option value="scenarios">🎲 All scenarios (mixed)</option>`+SECTIONS.map(s=>`<option value="${s.id}">${esc(s.title)}</option>`).join("");
function buildDeck(){
  const v=scopeSel.value;
  deck=v==="all"?ALL.slice():v==="review"?ALL.filter(i=>status[i.id]==="review"):v==="notsolid"?ALL.filter(i=>status[i.id]!=="solid"):v==="scenarios"?ALL.filter(i=>i.sc):ALL.filter(i=>i.sec.id===v);
  deck=deck.filter(i=>!/command reference|Core Ansible commands/i.test(i.q));
  if($("fcShuffle").checked){for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}}
  pos=0;showCard();
}
function toggleBtns(done){$("fcReveal").hidden=revealed||done||!deck.length;$("fcReview").hidden=!revealed;$("fcGot").hidden=!revealed;}
function showCard(){
  revealed=false;clearInterval(timer);const c=$("card");
  if(!deck.length){c.innerHTML=`<div class="empty">No cards in this set. Pick a different set above.</div>`;$("fcCount").textContent="";toggleBtns(true);return;}
  if(pos>=deck.length){c.innerHTML=`<h2>Round complete</h2><p class="hint">${deck.filter(i=>status[i.id]==="solid").length} of ${deck.length} marked as ready. Switch to “Needs work” to drill the rest.</p><button class="btn primary" id="again">Go again</button>`;$("again").onclick=buildDeck;$("fcCount").textContent="";toggleBtns(true);return;}
  const it=deck[pos];
  c.style.cssText=cv(it.sec.id);c.innerHTML=`<div class="where">${TH(it.sec.id)[0]} ${esc(it.sec.title)}</div><h2>${esc(it.q)}</h2>${it.sc?`<div class="say open" style="margin-top:10px"><span class="who">🎤 Interviewer opens with</span>${it.open}</div><p class="hint">Say your questions out loud, name the problem, and explain how you’ll proceed. Then reveal.</p>`:""}<div id="cardAns"></div>`;
  $("fcCount").textContent=`${pos+1} of ${deck.length}`;
  cardStart=Date.now();$("fcClock").textContent="0:00";
  timer=setInterval(()=>{$("fcClock").textContent=fmt(Math.floor((Date.now()-cardStart)/1000))},500);
  toggleBtns();
}
function reveal(){if(revealed||!deck.length||pos>=deck.length)return;revealed=true;clearInterval(timer);$("cardAns").innerHTML=`<div class="ans">${body(deck[pos],true)}</div>`;toggleBtns();}
function grade(v){if(!revealed)return;status[deck[pos].id]=v;save();pos++;showCard();}
function openFC(scope){scopeSel.value=[...scopeSel.options].some(o=>o.value===scope)?scope:"all";$("fc").classList.add("show");document.body.style.overflow="hidden";buildDeck();}
function closeFC(){$("fc").classList.remove("show");document.body.style.overflow="";clearInterval(timer);route();}
$("fcOpen").onclick=()=>openFC(SECTIONS.some(s=>s.id===current)?current:(current==="review"?"review":"all"));
$("fcClose").onclick=closeFC;scopeSel.onchange=buildDeck;$("fcShuffle").onchange=buildDeck;
$("fcReveal").onclick=reveal;$("fcGot").onclick=()=>grade("solid");$("fcReview").onclick=()=>grade("review");
$("fcNext").onclick=()=>{if(pos<deck.length){pos++;showCard();}};
$("fcPrev").onclick=()=>{if(pos>0){pos--;showCard();}};
document.addEventListener("keydown",e=>{
  if(!$("fc").classList.contains("show")){if(e.key==="/"&&document.activeElement!==$("q")){e.preventDefault();$("q").focus();}return;}
  if(e.target.tagName==="SELECT"||e.target.tagName==="SUMMARY")return;
  if(e.key===" "){e.preventDefault();reveal();}
  else if(e.key==="1")grade("review");else if(e.key==="2")grade("solid");
  else if(e.key==="ArrowRight")$("fcNext").click();else if(e.key==="ArrowLeft")$("fcPrev").click();
  else if(e.key==="Escape")closeFC();
});
route();
})();
</script>
<script>
if("serviceWorker" in navigator){
  addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{r.update();document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")r.update();});}).catch(()=>{});
    let done=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!done){done=true;location.reload();}});
  });
}
</script>
