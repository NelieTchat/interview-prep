<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Interview Prep">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#4F46E5">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>Interview Rehearsal · DevOps & Cloud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7FB; --card:#FFFFFF; --ink:#1E2433; --muted:#667085; --rule:#E4E8F0;
  --accent:#4F46E5; --accent-soft:#EEF0FF; --ok:#16A34A; --ok-soft:#E7F7EC; --warn:#B45309; --warn-soft:#FEF3C7;
  --c:#4F46E5; --cs:#EEF0FF;
  --sans:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
code{font-family:var(--mono);font-size:.82em;background:#F1F3F8;border:1px solid var(--rule);padding:.05em .35em;border-radius:5px}
pre{background:#1E2433;color:#E6E9F2;border-radius:10px;padding:14px 16px;overflow-x:auto;font-size:13px;line-height:1.6;margin:10px 0}
pre code{background:none;border:0;padding:0;font-size:inherit;color:inherit}

.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1220px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 20px}
.brand{display:flex;align-items:center;gap:10px;font-size:1.08rem;font-weight:800;white-space:nowrap;cursor:pointer;background:none;border:0;padding:0}
.logo{width:36px;height:36px;border-radius:10px;display:block}
.search{flex:1;max-width:420px;margin-left:auto;position:relative}
.search input{width:100%;font:inherit;font-size:15px;padding:9px 12px 9px 38px;border:1px solid var(--rule);border-radius:10px;background:#F5F7FB;color:var(--ink)}
.search input:focus{background:#fff;border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.btn{border:1px solid var(--rule);background:#fff;border-radius:10px;padding:8px 15px;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#C9CFDB}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.25)}
.btn.primary:hover{background:#4338CA}
.btn.tint{background:var(--cs);border-color:transparent;color:var(--c)}
.btn.icon{padding:8px 10px;line-height:0}
.menu-btn{display:none}

.wrap{max-width:1220px;margin:0 auto;display:grid;grid-template-columns:256px minmax(0,1fr);gap:40px;padding:28px 20px 80px}
nav.side{position:sticky;top:84px;align-self:start;max-height:calc(100vh - 100px);overflow:auto;background:#fff;border:1px solid var(--rule);border-radius:16px;padding:10px}
nav.side a{display:flex;align-items:center;gap:10px;text-decoration:none;color:#475467;padding:7px 8px;border-radius:10px;font-size:14.5px;font-weight:500}
nav.side a:hover{background:#F5F7FB;color:var(--ink)}
nav.side a.on{background:var(--cs);color:var(--c);font-weight:700}
nav.side .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:14px;background:var(--cs);flex:none}
nav.side .nm{flex:1;line-height:1.25}
nav.side .cnt{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
nav.side .cnt.done{color:var(--ok);font-weight:700}
nav.side hr{border:0;border-top:1px solid var(--rule);margin:8px}
main{min-width:0;max-width:820px}

.banner{background:linear-gradient(135deg,var(--cs),#fff 75%);border:1px solid var(--rule);border-radius:20px;padding:24px 26px;margin-bottom:20px;position:relative;overflow:hidden}
.banner::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:var(--c);opacity:.07}
.banner .big{width:52px;height:52px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:26px;box-shadow:0 4px 14px rgba(30,36,51,.08);margin-bottom:12px}
.banner h1{font-size:clamp(1.7rem,3.4vw,2.3rem);line-height:1.15;font-weight:800;letter-spacing:-.02em;margin:0 0 6px}
.banner p{color:#475467;margin:0 0 16px;max-width:60ch}
.prog{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.meter{flex:1;min-width:140px;height:8px;background:#fff;border:1px solid var(--rule);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .3s}
.meta{font-size:14px;color:var(--muted);font-weight:600}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

.qlist{display:flex;flex-direction:column;gap:10px}
.q{background:#fff;border:1px solid var(--rule);border-radius:14px;overflow:hidden;transition:box-shadow .2s,border-color .2s}
.q:hover{border-color:#D3D9E4}
.q.open{border-color:var(--c);box-shadow:0 8px 24px rgba(30,36,51,.07)}
.q > button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:30px 1fr 20px;gap:12px;width:100%;padding:14px 18px;cursor:pointer;align-items:center}
.q > button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:14px}
.num{width:30px;height:30px;border-radius:9px;background:var(--cs);color:var(--c);display:grid;place-items:center;font-size:13px;font-weight:800}
.num.solid{background:var(--ok);color:#fff}
.num.review{background:#F59E0B;color:#fff}
.qt{font-size:1.02rem;font-weight:700;line-height:1.4}
.sec-tag{display:inline-block;font-size:12px;font-weight:700;color:var(--c);background:var(--cs);border-radius:6px;padding:1px 8px;margin-bottom:4px}
.chev{color:var(--muted);transition:transform .2s}
.q.open .chev{transform:rotate(180deg);color:var(--c)}
.ans{display:none;padding:2px 20px 20px 60px}
.q.open .ans{display:block}
.blk{margin:12px 0}
.lbl{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;letter-spacing:.02em;color:var(--muted);margin-bottom:4px}
.blk p,.blk > div{margin:0;max-width:68ch}
.blk.ex{background:var(--cs);border-left:4px solid var(--c);border-radius:10px;padding:12px 16px}
.blk.ex .lbl{color:var(--c)}
.blk.chk{background:#F8FAFC;border:1px dashed var(--rule);border-radius:10px;padding:10px 14px}
.steps{padding-left:1.2em;margin:4px 0}
.steps li{margin-bottom:6px}
.flow{font-family:var(--mono);font-size:12.5px;background:#fff;border:1px solid var(--rule);padding:8px 12px;border-radius:8px;margin:8px 0 0;overflow-x:auto;white-space:nowrap;color:var(--c);font-weight:500}
.star{display:grid;grid-template-columns:36px 1fr;gap:12px 14px;margin:12px 0}
.star b{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:15px;color:#fff}
.star b.s,.star b.t,.star b.a,.star b.r{background:#B8860B}
.star div{max-width:66ch}
.star .k{font-size:12.5px;font-weight:800;color:var(--muted);display:block}
.caution{background:var(--warn-soft);color:#78350F;border-radius:10px;padding:8px 12px;font-size:14.5px;margin:10px 0}
.fu{margin-top:16px}
.fu h4{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:800}
.fu details{border:1px solid var(--rule);border-radius:10px;margin-bottom:8px;background:#FAFBFD}
.fu details[open]{background:#fff;border-color:var(--c)}
.fu summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:15px}
.fu details > div{padding:0 14px 12px;max-width:66ch}
.mark{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--rule)}
.chip{border:1px solid var(--rule);background:#fff;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"].g{background:var(--ok);border-color:var(--ok);color:#fff}
.chip[aria-pressed="true"].r{background:#F59E0B;border-color:#F59E0B;color:#fff}
mark{background:#FEF08A;color:inherit;border-radius:3px;padding:0 1px}
.empty{padding:36px;color:var(--muted);background:#fff;border:1px dashed var(--rule);border-radius:14px;text-align:center}

.hero{background:linear-gradient(135deg,#EEF0FF 0%,#E6F6FB 55%,#FFF4E8 100%);border:1px solid var(--rule);border-radius:24px;padding:30px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:#6366F1;opacity:.08;right:-70px;top:-90px}
.hero::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:#06B6D4;opacity:.08;right:120px;bottom:-110px}
.hero .hi{font-size:15px;font-weight:700;color:var(--accent)}
.hero h1{font-size:clamp(2rem,4.6vw,2.9rem);font-weight:800;letter-spacing:-.025em;line-height:1.08;margin:6px 0 10px;position:relative}
.hero .lead{color:#475467;max-width:56ch;margin:0 0 20px;position:relative}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;position:relative}
.stat{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:10px 16px;min-width:120px}
.stat b{display:block;font-size:1.5rem;font-weight:800;line-height:1.2}
.stat span{font-size:13px;color:var(--muted);font-weight:600}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap;position:relative}
.intro{background:#fff;border:1px solid var(--rule);border-radius:20px;padding:26px 30px;margin-top:22px;position:relative}
.intro .qmark{position:absolute;right:22px;top:6px;font-size:84px;line-height:1;color:var(--accent);opacity:.12;font-family:Georgia,serif}
.intro h2{font-size:1.3rem;font-weight:800;margin:0 0 4px}
.intro .hint{margin-bottom:16px}
.script{font-size:1.06rem;line-height:1.8}
.script p{margin:0 0 14px;max-width:66ch}
.script p:last-child{margin:0}
.rehearse{display:flex;align-items:center;gap:14px;margin-top:18px;padding-top:16px;border-top:1px solid var(--rule);flex-wrap:wrap}
.clock{font-family:var(--mono);font-size:1.3rem;font-weight:500;font-variant-numeric:tabular-nums;min-width:4.5ch}
.clock.over{color:var(--warn)}
.hint{font-size:14px;color:var(--muted)}
h2.sub{font-size:1.3rem;font-weight:800;margin:34px 0 12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--rule);border-radius:14px;padding:14px;transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(30,36,51,.08);border-color:var(--c)}
.tile .ic{width:42px;height:42px;border-radius:12px;background:var(--cs);display:grid;place-items:center;font-size:21px;flex:none}
.tile b{display:block;font-size:.98rem;line-height:1.3}
.tile span{font-size:13px;color:var(--muted)}
.tile .bar{height:4px;background:var(--rule);border-radius:9px;margin-top:6px;overflow:hidden}
.tile .bar i{display:block;height:100%;background:var(--c)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:34px}
.panel{background:#fff;border:1px solid var(--rule);border-radius:18px;padding:20px 22px}
.panel h2{font-size:1.15rem;font-weight:800;margin:0 0 12px}
.rem{list-style:none;padding:0;margin:0}
.rem li{display:flex;gap:10px;margin-bottom:10px;font-size:15px}
.rem li::before{content:"✓";flex:none;width:22px;height:22px;border-radius:7px;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
td{padding:9px 4px;border-bottom:1px solid var(--rule);vertical-align:top}
tr:last-child td{border-bottom:0}
td:last-child{font-weight:700;color:var(--accent)}

.fc{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.fc.show{display:flex}
.fc-bar{display:flex;gap:10px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--rule);flex-wrap:wrap;background:#fff}
.fc-bar select{font:inherit;font-size:15px;padding:7px 10px;border:1px solid var(--rule);border-radius:10px;background:#fff;color:var(--ink)}
.fc-body{flex:1;overflow:auto;padding:30px 20px 40px}
.card{max-width:760px;margin:0 auto;background:#fff;border:1px solid var(--rule);border-top:6px solid var(--c);border-radius:20px;padding:28px 30px;box-shadow:0 12px 30px rgba(30,36,51,.07)}
.card .where{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:700;color:var(--c);background:var(--cs);border-radius:8px;padding:3px 10px}
.card h2{font-size:clamp(1.5rem,3.2vw,2rem);font-weight:800;line-height:1.25;letter-spacing:-.015em;margin:12px 0 4px}
.card .ans{display:block;padding:14px 0 0;margin-top:16px;border-top:1px solid var(--rule)}
.fc-foot{display:flex;gap:10px;align-items:center;justify-content:center;padding:14px 20px;border-top:1px solid var(--rule);flex-wrap:wrap;background:#fff}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 5px;margin-left:6px;opacity:.6}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.warn{background:#F59E0B;border-color:#F59E0B;color:#fff}
@media (max-width:760px){
  .wrap{grid-template-columns:1fr;gap:0;padding-top:18px}
  nav.side{position:fixed;left:0;top:0;bottom:0;width:min(290px,86vw);max-height:none;border-radius:0;z-index:40;padding:calc(env(safe-area-inset-top,0px) + 70px) 10px 24px;transform:translateX(-102%);transition:transform .25s}
  nav.side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(30,36,51,.3);z-index:35;display:none}
  .scrim.show{display:block}
  .menu-btn{display:inline-flex}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:560px){
  .top-in{flex-wrap:wrap;gap:8px;padding:10px 12px}
  .search{order:5;max-width:none;flex-basis:100%;margin-left:0}
  #fcOpen{margin-left:auto}
  .brand .txt{font-size:.98rem}
  .ans{padding:2px 16px 18px}
  .hero,.intro,.banner{padding:20px}
  .card{padding:20px}
  .stat{min-width:0;flex:1}
  body{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.top,nav.side,.tools,.mark{display:none!important}.ans{display:block!important}.wrap{display:block}}

/* stronger color pass */
.banner{background:linear-gradient(135deg,var(--c) 0%,color-mix(in srgb,var(--c) 72%,#fff) 100%);border:0;color:#fff;box-shadow:0 12px 30px color-mix(in srgb,var(--c) 28%,transparent)}
.banner::after{background:#fff;opacity:.12;width:240px;height:240px;right:-60px;top:-80px}
.banner::before{content:"";position:absolute;left:55%;bottom:-90px;width:160px;height:160px;border-radius:50%;background:#fff;opacity:.08}
.banner h1{color:#fff}
.banner p{color:rgba(255,255,255,.92)}
.banner .meta{color:#fff}
.banner .meter{background:rgba(255,255,255,.3);border:0}
.banner .meter i{background:#fff}
.banner .btn{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.5);color:#fff}
.banner .btn:hover{background:rgba(255,255,255,.28)}
.banner .btn.tint{background:#fff;color:var(--c);border-color:#fff}
.num{background:var(--c);color:#fff}
.q{border-left:5px solid var(--c)}
.q.open{border-color:var(--c);border-left-width:5px;box-shadow:0 10px 26px color-mix(in srgb,var(--c) 16%,transparent)}
.q.open > button{background:var(--cs)}
.q > button{padding:16px 18px;min-height:60px}
.lbl{color:var(--c)}
.blk.ex{background:var(--cs);border-left:5px solid var(--c)}
.blk.chk{background:#fff;border:1.5px dashed color-mix(in srgb,var(--c) 45%,#fff)}
.sec-tag{background:var(--c);color:#fff}
nav.side .ic{background:var(--cs)}
nav.side a.on{background:var(--c);color:#fff}
nav.side a.on .cnt{color:#fff}
nav.side a.on .ic{background:rgba(255,255,255,.25)}
.hero{background:linear-gradient(135deg,#4F46E5 0%,#7C3AED 45%,#0EA5E9 100%);border:0;color:#fff;box-shadow:0 16px 40px rgba(79,70,229,.25)}
.hero::before,.hero::after{background:#fff;opacity:.1}
.hero .hi{color:#E0E7FF}
.hero .lead{color:rgba(255,255,255,.92)}
.hero .stat{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;backdrop-filter:blur(4px)}
.hero .stat span{color:rgba(255,255,255,.85)}
.hero .stat b{color:#fff!important}
.hero .btn.primary{background:#fff;color:#4F46E5!important;border-color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.12)}
.hero .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.5);color:#fff!important}
.intro{border-top:6px solid #F59E0B}
.intro .qmark{color:#F59E0B;opacity:.35}
.tile{border-top:5px solid var(--c)}
.tile .ic{background:var(--cs)}
.panel:first-child{border-top:5px solid #16A34A}
.panel:last-child{border-top:5px solid #4F46E5}
.card{border-top:8px solid var(--c)}
.card .where{background:var(--c);color:#fff}
.star b{box-shadow:0 4px 10px rgba(0,0,0,.12)}
.fu details[open]{border-color:var(--c);background:var(--cs)}
.fu details[open] > div{background:#fff;border-radius:0 0 10px 10px;padding-top:10px}
.chip{padding:8px 16px}
@media (min-width:761px) and (max-width:1100px){
  .wrap{grid-template-columns:220px minmax(0,1fr);gap:24px}
  nav.side{position:sticky;transform:none;width:auto;padding:10px;border-radius:16px;top:84px;max-height:calc(100vh - 100px)}
  .menu-btn{display:none}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:760px){
  .wrap{grid-template-columns:1fr;gap:0}
  nav.side{position:fixed;left:0;top:0;bottom:0;width:min(290px,86vw);max-height:none;border-radius:0;z-index:40;padding:calc(env(safe-area-inset-top,0px) + 70px) 10px 24px;transform:translateX(-102%);transition:transform .25s}
  nav.side.open{transform:none}
  .menu-btn{display:inline-flex}
}


.scn{margin:6px 0}
.say{border-radius:14px;padding:10px 14px;margin:8px 0;max-width:62ch;position:relative}
.say .who{display:block;font-size:12px;font-weight:800;letter-spacing:.02em;margin-bottom:2px}
.say.int{background:#F1F3F8;border:1px solid var(--rule);margin-right:40px}
.say.int .who{color:var(--muted)}
.say.me{background:var(--cs);border:1px solid color-mix(in srgb,var(--c) 30%,#fff);margin-left:40px}
.say.me .who{color:var(--c)}
.say.open{background:#fff;border:2px solid var(--c);font-weight:600}
.stp.hid{display:none}
.blk.proceed{background:#ECFDF3;border-left:5px solid #16A34A;border-radius:10px;padding:12px 16px}
.blk.proceed .lbl{color:#15803D}
.scctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.scctl .hint{flex-basis:100%}
table.mini{width:100%;border-collapse:collapse;font-size:14.5px;margin:4px 0}
table.mini th{text-align:left;font-size:12.5px;color:var(--muted);padding:6px 4px;border-bottom:2px solid var(--rule)}
table.mini td{padding:7px 4px;border-bottom:1px solid var(--rule);font-weight:400;color:var(--ink)}
table.mini td:last-child{font-weight:400;color:var(--ink)}
@media (max-width:560px){.say.int{margin-right:0}.say.me{margin-left:0}}

<script>
const TMAY = `<p>I’m a DevOps and Cloud Engineer with about seven years of experience, mostly in AWS, including federal projects. I’ve built infrastructure with Terraform and CI/CD, run applications on Kubernetes, and troubleshot production incidents.</p>
<p>Those incidents shaped how I work. Now, when something fails, I focus on finding the cause, restoring the service, and using what I learn to improve the next deployment. That might mean adding a pipeline check, making monitoring clearer, or verifying that a fix actually restored the application. That’s how I reduce risk over time.</p>
<p>That habit carries into my own learning. Even when I was working, I made time to study after hours, and since my last role, I’ve kept learning through classes and by building real projects. I built Secure Mesh Pipeline to practice secure delivery end to end. Terraform creates the EKS cluster, GitHub Actions builds and scans the image, Argo CD deploys it from Git, and Istio encrypts the traffic between services. Now I’m building ShieldOps, a secure document platform with Terraform, EKS, and Bedrock, and adding an incident investigator with LangGraph.</p>
<p>Outside of tech, I love hiking, and I’m active in my community. I help with catering at festivals, and friends often ask me for decoration ideas for their events. I just enjoy helping people bring their plans to life.</p>
<p>I like learning something, testing it, and making it useful. That’s what I want to bring to your team.</p>`;

const SECTIONS = [
{id:"itlabs", title:"IT Labs technical round", blurb:"One hour with IT Labs and the client. Keep returning to one story: Terraform provisions the platform, EKS runs Kubernetes, Helm deploys the app, CI/CD automates the release, Kubernetes tools verify and troubleshoot it.", items:[
{q:"How did you deploy applications with Terraform and Helm?", d:`<p>I used Terraform for the infrastructure layer and Helm for the Kubernetes application layer. Terraform provisioned the AWS resources such as the VPC, EKS cluster, node capacity, IAM roles, security groups, and other dependencies. Once the cluster was available, I used Helm charts to define and deploy the Kubernetes resources: Deployments, Services, ConfigMaps, ingress configuration, resource limits, and probes.</p><p>In CI/CD, Terraform handled infrastructure changes, while the application pipeline built the container image, pushed it to ECR, and updated the Helm deployment with the new image tag. Then I verified the rollout using Kubernetes, checking the Deployment, Pods, Services, endpoints, and application health. I kept Terraform and Helm separated because Terraform manages the infrastructure lifecycle, while Helm manages the application release lifecycle.</p>`, e:`<div class="flow">Terraform (VPC, EKS, IAM) → image to ECR → Helm release with new tag → verify Pods, Services, endpoints</div>`},
{q:"Why keep Terraform and Helm separate?", d:`Terraform manages the infrastructure lifecycle, and Helm manages the application release lifecycle. They change at different speeds: the cluster changes rarely, the app changes many times a day. Keeping them apart means an app release never touches infrastructure state, and an infrastructure change never redeploys the app by surprise.`, e:`A new image tag only runs <code>helm upgrade</code>, or a Git commit that Argo CD syncs. Terraform isn’t involved, so there’s no risk of a <code>terraform apply</code> touching the VPC or cluster during a normal release.`},
{q:"Tell me about a difficult Kubernetes troubleshooting you did.", d:`<p>Our deployments to EKS were failing intermittently, and the QA team’s nightly tests kept hitting a broken environment. The pipeline and the cluster both looked healthy, so it wasn’t obvious where the problem was.</p><p>I started with the Pods. The new ones were in ImagePullBackOff, so the node couldn’t pull the image. The events said the tag didn’t exist in ECR. But when I checked ECR a few minutes later, the tag was there. That told me it was a timing problem, not a wrong tag.</p><p>I compared the timestamps between GitHub Actions and Argo CD and found a race condition. The workflow committed the new image tag to the GitOps repo a few seconds before the push to ECR had finished. Argo CD synced right away, the first pull failed, and Kubernetes backed off for up to 5 minutes before retrying. The tests ran during that wait.</p><p>I added a step in the workflow that checks ECR with <code>aws ecr describe-images</code> and only commits the tag once the image exists. The failures went from about 60% of nightly runs to zero.</p>`, e:`<div class="flow">Pods (ImagePullBackOff) → events (tag not found) → ECR (tag exists later) → timestamps → race condition → verify image before Git commit</div><p style="margin-top:8px">Why it works for this question: it’s a real Kubernetes issue, you followed evidence layer by layer, and you fixed the root cause in the pipeline instead of just retrying.</p>`},
{q:"Tell me about a difficult troubleshooting issue.", d:`<p>One difficult issue I troubleshot was an application that was running correctly but wasn’t accessible through its external HTTPS endpoint.</p><p>I worked from the application outward. I first verified the application was healthy and responded internally. Then I checked that traffic was reaching the right place, and from there I checked the load-balancer path, DNS resolution, and finally TLS.</p><p>The issue turned out to be with the certificate configuration. The certificate and key needed correction, and the certificate SAN didn’t include the DNS hostname being used. After correcting the TLS configuration, I redeployed it and verified the complete path from DNS through the load balancer to the application.</p><p>What was important was troubleshooting layer by layer instead of assuming the application itself was the problem.</p>`, e:`<strong>Kubernetes version of the same path</strong> (if the issue was in a cluster): Pods healthy → Service and endpoints → ingress → load balancer → DNS → TLS.`, note:`Tell this story where it really happened. If it was the Quasar deployment on Linux servers with NGINX, say NGINX instead of Kubernetes ingress. The layer-by-layer method is what they’re evaluating.`},
{q:"How do you troubleshoot in Kubernetes?", d:`I start with the symptom and trace the request path. I check the Deployment and Pod status, then events and logs. If the Pods are healthy, I check the Service selectors and EndpointSlices to make sure the Service actually has healthy backends. Then I move outward to ingress, load balancer, DNS, TLS, and network policies or security rules. For scheduling issues, I check resources, taints and tolerations, affinity, PVCs, and node capacity. I try to identify exactly which layer is failing before changing anything.`, e:`<div class="flow">Pods → events/logs → Service → EndpointSlices → Ingress → Load balancer → DNS → TLS</div>`},
{q:"Command level: what would you run?", d:`Be ready to explain each one immediately.`, x:`<pre><code>kubectl get pods
kubectl describe pod &lt;pod&gt;
kubectl logs &lt;pod&gt;
kubectl get svc
kubectl get endpointslices
kubectl get ingress
kubectl get events --sort-by=.metadata.creationTimestamp
kubectl rollout status deployment/&lt;deployment&gt;

helm list                      # releases in the namespace
helm status &lt;release&gt;          # current state of a release
helm history &lt;release&gt;         # past revisions, used before a rollback
helm upgrade --install ...     # install or upgrade in one command
helm rollback &lt;release&gt; &lt;rev&gt;  # go back to a known good revision

terraform plan                 # preview changes
terraform apply                # apply the reviewed plan
terraform state list           # what Terraform manages
terraform output               # values like the cluster endpoint</code></pre>`},
{q:"The one story to keep returning to", d:`Connect the technologies instead of listing definitions.`, e:`<div class="flow">Terraform provisions the platform → EKS provides Kubernetes → Helm deploys the app → CI/CD automates the release → Kubernetes tools verify and troubleshoot it</div>`},
]},

{id:"helm", title:"Helm", blurb:"Concepts first, then how to troubleshoot a failed release, then interview scenarios. Keep tying it back to your flow: Terraform builds the cluster, Helm releases the app.", items:[
{q:"What is Helm?", d:`The package manager for Kubernetes. A <strong>chart</strong> is a package of templated Kubernetes manifests plus default values. When you install a chart, you get a <strong>release</strong>. Each install, upgrade, or rollback creates a new <strong>revision</strong>.`, e:`<code>helm upgrade --install orders ./charts/orders -f values-prod.yaml</code> creates or updates the <code>orders</code> release. <code>helm history orders</code> lists every revision.`},
{q:"Why Helm and not raw manifests with kubectl?", d:`Helm doesn’t replace the Deployment. It generates and manages it. The real choice is between Helm and applying raw manifests with kubectl. I chose Helm because the same app runs in dev, staging, and prod. With one chart and a values file per environment, only the differences change, like replicas, resources, or the image tag, instead of maintaining three copies of the same YAML. Helm also treats each deploy as a versioned release, so I can see the history and roll back with one command. And it makes CI/CD simple: the pipeline only updates the image tag, and Helm renders everything else.`, e:`Without Helm, a new image tag means editing the Deployment YAML in three places. With Helm, the pipeline runs <code>helm upgrade --install orders ./chart -f values-prod.yaml --set image.tag=1.4.2</code>. If it goes wrong, <code>helm rollback orders 12</code> brings back the last good version.`, x:`<div class="fu"><h4>Follow-up questions</h4><details><summary>When would you NOT use Helm?</summary><div>For a very small, single-environment app, plain manifests or Kustomize can be simpler, because Helm templates add complexity. And when Argo CD manages the app, rollback happens through Git instead of <code>helm rollback</code>.</div></details><details><summary>Quick comparison</summary><div><table class="mini"><tr><th></th><th>Raw manifests + kubectl</th><th>Helm</th></tr><tr><td>Environments</td><td>Copy YAML per environment</td><td>One chart, one values file each</td></tr><tr><td>Versions</td><td>No release history</td><td>Numbered revisions</td></tr><tr><td>Rollback</td><td>Re-apply old files by hand</td><td><code>helm rollback</code></td></tr><tr><td>CI/CD</td><td>Edit YAML each release</td><td>Change only the image tag</td></tr><tr><td>Third-party tools</td><td>Write all YAML yourself</td><td>Install ready-made charts</td></tr></table></div></details></div>`},
{q:"What’s inside a chart?", d:`<ul class="steps"><li><code>Chart.yaml</code>: name, version, and dependencies.</li><li><code>values.yaml</code>: the default settings.</li><li><code>templates/</code>: Deployment, Service, Ingress, ConfigMap, and so on, with placeholders.</li><li><code>templates/_helpers.tpl</code>: reusable snippets like names and labels.</li><li><code>charts/</code>: sub-charts it depends on.</li></ul>`, e:`In the Deployment template: <code>image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"</code>. The pipeline only changes <code>image.tag</code>.`},
{q:"How do you handle dev, staging, and prod with one chart?", d:`One chart, one values file per environment. Later files and <code>--set</code> override earlier ones, so the base values.yaml holds defaults and each environment file holds only what’s different.`, e:`<code>-f values.yaml -f values-prod.yaml --set image.tag=1.4.2</code>. Prod gets 3 replicas and bigger limits, dev gets 1. The chart templates never change.`},
{q:"install vs upgrade vs upgrade --install vs rollback?", d:`<code>install</code> creates a new release. <code>upgrade</code> changes an existing one. <code>upgrade --install</code> does whichever is needed, so it’s what pipelines use. <code>rollback</code> returns to an earlier revision. <code>uninstall</code> removes the release and its resources.`, e:`A bad release goes out as revision 13. <code>helm rollback orders 12</code> brings back revision 12 in seconds.`},
{q:"Where does Helm store release information?", d:`As Kubernetes Secrets in the release’s namespace, one per revision. That’s how <code>helm history</code> and <code>helm rollback</code> know what was deployed.`, e:`<code>kubectl get secrets -n orders</code> shows <code>sh.helm.release.v1.orders.v12</code>, <code>...v13</code>, and so on.`},
{q:"What do --wait, --atomic, and --timeout do?", d:`<code>--wait</code> waits until the pods are actually Ready before calling the release successful. <code>--atomic</code> automatically rolls back if the upgrade fails. <code>--timeout</code> sets how long to wait.`, e:`<code>helm upgrade --install orders ./chart --atomic --timeout 5m</code>. If pods aren’t Ready in 5 minutes, Helm rolls back by itself and the pipeline fails clearly.`},
{q:"What are Helm hooks?", d:`Jobs or resources that run at a specific point in the release, like before an install or before an upgrade. Common use: database migrations.`, e:`A Job with <code>helm.sh/hook: pre-upgrade</code> runs the migration first. If it fails, the upgrade stops before new pods roll out.`},
{q:"How do you test a chart before deploying?", d:`<code>helm lint</code> checks the chart for errors. <code>helm template</code> renders the final YAML locally so you can read it. <code>--dry-run</code> simulates the install against the cluster. The helm-diff plugin shows what would change.`, e:`In CI: <code>helm lint</code> and <code>helm template ... | kubeconform</code> run on every pull request, so a broken template never reaches the cluster.`},
{q:"How do you handle secrets with Helm?", d:`Don’t put real secrets in values files, because they end up in Git and in the release Secret. Keep them in AWS Secrets Manager and pull them into the cluster with External Secrets Operator, or use a tool like sealed-secrets. The chart only references the Secret by name.`, e:`The Deployment uses <code>secretKeyRef: name: orders-db</code>. External Secrets creates <code>orders-db</code> from Secrets Manager. No password ever sits in the chart.`},
{q:"Helm with Argo CD: what changes?", d:`Argo CD renders the chart itself (like <code>helm template</code>) and applies the result. So there are no Helm release Secrets, and <code>helm list</code> shows nothing. Rollback is done through Git or Argo CD, not <code>helm rollback</code>.`, e:`Interviewer: “Why doesn’t helm list show your app?” You: “Because Argo CD manages it. It renders the chart and syncs it, so the history lives in Git and Argo CD.”`},
{q:"Helm vs Kustomize?", d:`Helm uses templates and values, and packages versioned charts, which is good for reusable apps and third-party tools. Kustomize patches plain YAML with overlays, with no templating language. Many teams use Helm for third-party charts and either one for their own apps.`, e:`Datadog and Istio installed from their Helm charts. Our own app with a small chart and one values file per environment.`},
{q:"How do you troubleshoot a failed Helm release?", d:`<ol class="steps"><li><code>helm status &lt;release&gt;</code>: deployed, failed, or pending?</li><li><code>helm history &lt;release&gt;</code>: which revision failed, and the error message.</li><li><code>helm get values</code> and <code>helm get manifest</code>: what was actually applied.</li><li><code>helm template --debug</code>: does the chart render correctly?</li><li>Then Kubernetes: pods, events, logs, like any other rollout.</li><li>Roll back to the last good revision if users are affected.</li></ol>`, e:`A Helm failure is either a <strong>render problem</strong> (the YAML is wrong), an <strong>apply problem</strong> (Kubernetes rejects it), or a <strong>runtime problem</strong> (pods never get Ready). Name which one it is.`},
{q:"Helm command reference", d:`The commands to know cold.`, x:`<pre><code>helm list -n orders                 # releases in a namespace
helm status orders                  # current state
helm history orders                 # all revisions
helm get values orders              # values used by the release
helm get manifest orders            # YAML actually applied
helm template orders ./chart -f values-prod.yaml --debug   # render locally
helm lint ./chart                   # check the chart
helm upgrade --install orders ./chart -f values-prod.yaml --atomic --timeout 5m
helm rollback orders 12             # back to revision 12
helm uninstall orders</code></pre>`},
{sc:1, q:"Scenario 1: Upgrade rejected by Kubernetes", open:`“Our Helm upgrade fails every time since we cleaned up the chart’s labels. The previous version is still running.”`, steps:[
[`What’s the exact error from <code>helm upgrade</code>?`,`<code>cannot patch "orders" with kind Deployment: spec.selector: field is immutable</code>.`],
[`What changed in the labels?`,`We renamed <code>app: orders</code> to <code>app.kubernetes.io/name: orders</code> everywhere, including the Deployment selector.`],
[`Is the old release still healthy?`,`Yes, revision 12 is still serving traffic.`]],
diag:`<strong>Apply problem: immutable selector.</strong> A Deployment’s selector can’t be changed after creation, so Kubernetes rejects the upgrade.`,
proceed:`<ol class="steps"><li>No outage, revision 12 is still running.</li><li>Fix: keep the original selector labels, and add the new labels only to metadata and pod labels, not to <code>spec.selector</code>.</li><li>If the selector truly must change, plan a controlled replacement (new Deployment name, or delete and recreate in a maintenance window).</li><li>Prevent: treat selector labels as permanent in the chart, and test upgrades against a real release in staging.</li></ol>`},
{sc:1, q:"Scenario 2: The new values don’t take effect", open:`“We set 3 replicas for prod in the values file, deployed with Helm, and it succeeded. But prod still runs 1 replica.”`, steps:[
[`What does <code>helm get values orders</code> show?`,`<code>replicas: 3</code>.`],
[`What does the Deployment template read?`,`<code>replicas: {{ .Values.replicaCount }}</code>.`],
[`So which key is in the values file?`,`<code>replicas</code>, not <code>replicaCount</code>.`]],
diag:`<strong>Render problem: wrong values key.</strong> The template reads <code>replicaCount</code>, but the values file sets <code>replicas</code>. Helm doesn’t complain, it just uses the default of 1.`,
proceed:`<ol class="steps"><li>Rename the key in <code>values-prod.yaml</code> to <code>replicaCount</code> and redeploy.</li><li>Verify with <code>helm template</code> and then <code>kubectl get deploy</code> showing 3/3.</li><li>Prevent: add a <code>values.schema.json</code> so Helm rejects unknown or wrong keys, and review <code>helm template</code> output in the PR.</li></ol>`},
{sc:1, q:"Scenario 3: The chart won’t even render", open:`“After a teammate added resource limits to the chart, every deploy fails immediately. Nothing reaches the cluster.”`, steps:[
[`What’s the exact error?`,`<code>error converting YAML to JSON: yaml: line 31: did not find expected key</code>.`],
[`What does <code>helm template --debug</code> show around line 31?`,`The <code>resources:</code> block is indented at the wrong level under the container.`],
[`How was it added?`,`With <code>{{ toYaml .Values.resources }}</code>, but without <code>nindent</code>.`]],
diag:`<strong>Render problem: broken YAML indentation.</strong> The template produced invalid YAML, so Helm stops before contacting Kubernetes.`,
proceed:`<ol class="steps"><li>Fix the template: <code>resources: {{- toYaml .Values.resources | nindent 12 }}</code>.</li><li>Verify with <code>helm lint</code> and <code>helm template</code>, then deploy.</li><li>Prevent: run <code>helm lint</code> and <code>helm template</code> in CI on every pull request, so this fails in the PR, not in the deploy.</li></ol>`},
{sc:1, q:"Scenario 4: Install fails because something already exists", open:`“We’re moving an app that was deployed with kubectl to a Helm chart. The first helm install fails.”`, steps:[
[`What’s the exact error?`,`<code>rendered manifests contain a resource that already exists. Unable to continue with install: Service "orders" ... exists and cannot be imported into the current release</code>.`],
[`Where did that Service come from?`,`It was created by hand with <code>kubectl apply</code> months ago.`],
[`Is it serving live traffic?`,`Yes.`]],
diag:`<strong>Apply problem: resource not owned by Helm.</strong> Helm won’t take over objects it didn’t create, unless they’re labeled as belonging to the release.`,
proceed:`<ol class="steps"><li>Because it serves live traffic, don’t delete it. Adopt it instead: add the label <code>app.kubernetes.io/managed-by=Helm</code> and the annotations <code>meta.helm.sh/release-name=orders</code> and <code>meta.helm.sh/release-namespace=&lt;namespace&gt;</code>.</li><li>Run the install again. Helm now manages the existing objects without downtime.</li><li>Verify with <code>helm get manifest</code> and check the app still answers.</li><li>Prevent: one owner per resource. Once Helm manages it, no more kubectl changes.</li></ol>`},
{sc:1, q:"Scenario 5: Upgrade times out on a migration", open:`“Our Helm upgrade hangs for 5 minutes and then fails. The app pods never even change.”`, steps:[
[`What does the error say?`,`<code>UPGRADE FAILED: pre-upgrade hooks failed: timed out waiting for the condition</code>.`],
[`What’s the pre-upgrade hook?`,`A database migration Job.`],
[`What do the Job’s pod logs say?`,`<code>permission denied for table orders</code>.`]],
diag:`<strong>Hook problem.</strong> The pre-upgrade migration Job fails, so Helm never reaches the step that updates the app. The app pods don’t change because the upgrade stops at the hook.`,
proceed:`<ol class="steps"><li>No outage: the old version is still running.</li><li>Fix the migration user’s database permissions (or the migration itself).</li><li>Set <code>helm.sh/hook-delete-policy: before-hook-creation</code> so the old failed Job is replaced on the next try.</li><li>Rerun the upgrade and verify the migration Job completes and the new pods become Ready.</li><li>Prevent: run migrations against staging with the same permissions first.</li></ol>`},
{q:"Also see: Helm release stuck in pending-upgrade", d:`That scenario is in <strong>🚦 Stuck rollouts & readiness</strong> (Scenario 3): an interrupted upgrade blocks new deploys with “another operation is in progress.”`, e:`Fix: <code>helm history</code>, then <code>helm rollback</code> to the last good revision, and use <code>--atomic</code> so it rolls back by itself next time.`},
]},

{id:"experience", title:"Experience questions", blurb:"Say what you’ve done, then give one concrete example.", items:[
{q:"What experience do you have with AWS?", d:`AWS has been my primary platform throughout my career. I’ve worked across EKS, EC2, IAM, VPC, S3, CloudWatch, ECR, and Route 53. I’ve also worked in GovCloud, which adds compliance requirements around networking, encryption, and access controls. Terraform and GitHub Actions are how I automate most of the provisioning and deployment work.`, e:`In Secure Mesh Pipeline, Terraform builds the VPC, the EKS cluster, the ECR repository, and the IAM role GitHub Actions assumes through OIDC. Nothing is created by hand in the console.`},
{q:"What is your experience with Kubernetes?", d:`My Kubernetes experience is mainly with Amazon EKS. I’ve deployed and managed applications using Helm, Argo CD, and GitHub Actions, provisioned clusters with Terraform, implemented IRSA for secure AWS access, and worked with Services, Ingress, RBAC, and Istio. I’ve spent a lot of time troubleshooting pods, networking, DNS, scaling, and deployment issues, and monitoring with Prometheus, Grafana, CloudWatch, and Datadog.`, e:`A new image tag is committed to Git, Argo CD syncs it to EKS, the Deployment does a rolling update, and if a pod goes into CrashLoopBackOff I start with <code>kubectl describe pod</code> and <code>kubectl logs --previous</code>.`},
{q:"What is your experience with Terraform?", d:`I’ve used Terraform extensively to provision AWS infrastructure as code. I build reusable modules for VPCs, EKS clusters, IAM roles, security groups, ECR, load balancers, and Route 53. State is stored in S3 with DynamoDB locking, and Terraform runs through GitHub Actions using OIDC instead of long-lived keys. I’ve also spent a lot of time troubleshooting state issues, dependencies, and IAM permissions.`, e:`I use one EKS module for dev, staging, and prod. Each environment passes different variables, like node size and replica count, so the code is written once and reused.`},
{q:"What is your experience with CI/CD?", d:`My CI/CD experience is primarily with GitHub Actions, Terraform, Helm, Argo CD, and AWS. My pipelines validate code, run security scans with Trivy and Checkov, build and push Docker images to ECR, and deploy to EKS through GitOps. I use OIDC between GitHub and AWS so there are no static credentials.`, e:`Push to main, GitHub Actions builds the image, Trivy scans it, the image goes to ECR, the pipeline updates the Helm values file with the new tag, and Argo CD deploys it to EKS.`},
{q:"What experience do you have with ArgoCD or GitOps?", d:`I’ve used ArgoCD in a GitOps setup where the cluster state lives in Git. Changes go through pull requests, get reviewed, and ArgoCD syncs them to the cluster. I like the auditability. You always know exactly what’s running and why. I’ve also used Argo Workflows for multi-stage pipelines with security gates.`, e:`If someone edits a Deployment by hand with kubectl, ArgoCD shows the app as OutOfSync and puts it back to what Git says.`},
{q:"What is your experience with Helm?", d:`Helm is the package manager for Kubernetes. I’ve used it on EKS to deploy both applications and platform tools like Argo CD, Datadog, Prometheus, Grafana, and Istio. I use values files for environment-specific settings and use Helm for upgrades and rollbacks.`, e:`Same chart, different values: <code>values-dev.yaml</code> runs 1 replica, <code>values-prod.yaml</code> runs 3. If a release goes bad, <code>helm rollback my-app 4</code> returns to the last good version.`},
{q:"What experience do you have with Docker?", d:`Docker is the packaging layer between the application code and the infrastructure. I write Dockerfiles, use multi-stage builds to keep images small, and run containers as non-root users. In CI/CD I build, tag, scan with Trivy, and push to ECR or GHCR, then deploy to EKS or ECS Fargate.`, e:`A multi-stage build compiles the app in a full build image, then copies only the binary into a small runtime image. The final image is smaller and has fewer vulnerabilities for Trivy to flag.`},
{q:"What experience do you have with Ansible?", d:`I’ve used Ansible for configuration management and automation: playbooks that configure servers, automate operational tasks, and run post-deployment checks. It fits when you manage existing machines rather than create new ones with Terraform.`, e:`On QuasarPlus, Ansible deployed the application, configured NGINX and app settings, retrieved certificates and secrets, restarted services, and ran a health check at the end.`},
{q:"What experience do you have with security or compliance?", d:`Security has been a consistent thread in my career. In GovCloud environments I worked with least privilege IAM, OIDC instead of long-lived credentials, KMS encryption, VPC endpoint-only networking, and audit logging. I build security in from the start instead of adding it later.`, e:`Pods that need S3 use IRSA with a role scoped to one bucket, so there are no access keys in the cluster and a compromised pod can’t reach anything else.`},
{q:"Do you have experience with incident response?", d:`Yes. I investigate alerts, dig through logs and metrics, find the root cause, and work with the team to restore service. I stay calm, communicate what I know and what I’m checking, and document the findings so it doesn’t happen twice.`, e:`Users couldn’t reach an app behind the load balancer. The targets were unhealthy because the app listened on a different port than the health check. We fixed the config and added a pre-release port check.`},
]},

{id:"troubleshooting", title:"Troubleshooting & the CTF", blurb:"Evidence first, then a hypothesis, test it, adjust.", items:[
{q:"Walk me through the CTF.", d:`I first treated it as a Linux troubleshooting challenge and checked users, permissions, and files. After the first flag, I found an API binary through sudo permissions and realized the challenge was about the application, not the OS.`, e:`I called the API, got a “Missing header” error, looked at the binary to see what it validated, found the required headers, and kept going.`},
{q:"How did you find the header names?", d:`Rather than guessing, I analyzed the Go binary.`, e:`I found repeated calls to <code>MIMEHeader.Get</code> and followed the strings next to them to get the exact header names.`},
{q:"Why did you decide to inspect the binary?", d:`Because the API returned a “Missing header” error. Instead of guessing inputs, I wanted to see what the application actually checked. That was faster and more reliable than brute-forcing requests.`, e:`<code>curl localhost:80/api/v1/info</code> returned “Missing header.” So the problem was headers, and the binary would tell me which ones.`},
{q:"You don’t know Go. How were you able to analyze it?", d:`I wasn’t trying to understand the whole codebase. I focused on the validation logic and followed the evidence.`, e:`I only needed the part that read request headers, not the rest of the program.`},
{q:"How did you know what to do next?", d:`I formed a hypothesis, gathered evidence, tested it, and changed direction when the evidence pointed somewhere else.`, e:`Filesystem enumeration stopped paying off, the sudo permissions pointed to the API, so I switched focus to the API.`},
{q:"What was the most important thing you learned from the challenge?", d:`Follow evidence, not assumptions. It’s the same loop as production troubleshooting: gather information, form a hypothesis, test, iterate.`, e:`I started on the filesystem and moved to the application only when the evidence pointed there.`},
{q:"Walk me through how you investigate a critical production alert.", d:`<ol class="steps"><li><strong>Assess impact.</strong> Customer-facing, partial degradation, or noise?</li><li><strong>Check monitoring.</strong> CloudWatch, Datadog, Splunk, Prometheus/Grafana: error rate, latency, health checks, timestamp, affected service.</li><li><strong>Narrow the scope.</strong> Pods/tasks, logs, restarts, recent deployments, LB targets. Then networking, DNS, certificates, IAM, resources.</li><li><strong>Validate end to end.</strong> LB, HTTPS termination, routing, app, dependencies.</li><li><strong>Communicate early.</strong> What I know, what I’m checking, impact.</li><li><strong>Mitigate.</strong> Roll back, restart, scale, or reroute first, then fix.</li><li><strong>Document and improve.</strong> Root cause, fix, and the missing alert or guardrail.</li></ol>`, e:`On QuasarPlus in GovCloud, the app looked healthy from one layer, but traffic failed because the load balancer, HTTPS termination, and routing weren’t aligned. Since then I always validate the whole flow.`},
]},

{id:"k8s-troubleshooting", title:"Kubernetes troubleshooting", blurb:"Meaning, what you check, and the answer.", items:[
{t:1, q:"What’s your approach to a broken pod?", d:`Start broad and narrow down with evidence: status, events, logs, then exec in if needed.`, c:`<code>kubectl get pods</code> → <code>kubectl describe pod</code> → <code>kubectl logs</code> (and <code>--previous</code> for restarts) → <code>kubectl exec</code>.`, e:`“I start with get pods to see status, then describe pod for events, then logs. If it’s a restart loop, logs --previous so I see the crash, not the new attempt.”`},
{t:1, q:"Pod stuck in Pending", d:`The scheduler can’t find a node for the pod.`, c:`Events in <code>kubectl describe pod</code>: CPU/memory requests, taints, nodeSelector/affinity, unbound PVCs.`, e:`Events say <code>0/3 nodes are available: 3 Insufficient cpu</code>. The pod requests more CPU than any node has free. Fix: lower the request if it’s oversized, or add capacity (Karpenter or Cluster Autoscaler adds a node).`},
{t:1, q:"CrashLoopBackOff", d:`The container starts, crashes, and Kubernetes keeps restarting it with growing delays.`, c:`<code>kubectl logs &lt;pod&gt; --previous</code>, env vars, ConfigMaps/Secrets, dependencies, liveness probe.`, e:`Logs show <code>connection refused</code> to the database. The <code>DB_HOST</code> env var pointed to the wrong Service name. Fix the ConfigMap, restart the Deployment, pod goes Running.`},
{t:1, q:"ImagePullBackOff", d:`The node can’t pull the image, so Kubernetes backs off and retries.`, c:`Events: image name and tag, registry permissions, whether the tag exists in ECR.`, e:`Events say <code>not found</code>. The manifest referenced a tag that was never pushed to ECR (typo or pipeline order). Fix the tag or push the image. If events say <code>401/403</code>, fix the node role’s ECR read permission.`},
{t:1, q:"OOMKilled", d:`The container used more memory than its limit and the kernel killed it.`, c:`<code>kubectl describe pod</code> shows <code>Last State: Terminated, Reason: OOMKilled</code>. Compare real usage (<code>kubectl top pod</code>) to the limit.`, e:`Limit was 256Mi, the app peaks near 400Mi under load. Fix: raise the limit to fit real usage (for example 512Mi), or fix the memory leak if usage keeps growing.`},
{t:1, q:"Pod is Running but the Service doesn’t work", d:`Traffic never reaches the pods even though they run.`, c:`Service selector vs pod labels, <code>kubectl get endpoints &lt;svc&gt;</code>, targetPort vs containerPort, readiness probe.`, e:`Endpoints are empty. Service selects <code>app: web</code>, pods are labeled <code>app: web-app</code>. Fix the selector, endpoints fill in, traffic flows. Another common one: targetPort 80 but the container listens on 8080.`},
{t:1, q:"503 from the load balancer", d:`The load balancer has no healthy targets to send traffic to.`, c:`Target group health, health check path and port, readiness probes, Service endpoints.`, e:`Health check hits <code>/health</code> but the app only serves <code>/healthz</code>, so every target is unhealthy. Fix the health check path, targets turn healthy, 503s stop.`},
{t:1, q:"Ingress not routing", d:`Requests reach the cluster but the Ingress rules don’t match them.`, c:`Ingress controller running, host and path rules, ingressClassName, DNS record, backend Service name and port.`, e:`Ingress host is <code>app.example.com</code> but DNS points users to <code>www.app.example.com</code>. Add the host rule (or fix DNS) and requests route correctly.`},
{t:1, q:"Node not joining the cluster", d:`The worker node can’t register with the control plane.`, c:`kubelet logs on the node, node IAM role, aws-auth / access entries, security groups, subnet routes to the API endpoint.`, e:`kubelet logs show <code>Unauthorized</code>. The node role wasn’t mapped in aws-auth (or EKS access entries). Add the mapping and the node shows Ready.`},
{t:1, q:"Node NotReady", d:`The node stopped reporting healthy to the control plane.`, c:`<code>kubectl describe node</code> conditions (MemoryPressure, DiskPressure, PIDPressure), <code>kubectl top nodes</code>, kubelet logs.`, e:`Condition shows <code>DiskPressure=True</code>. Old images and logs filled the disk. Clean up images or grow the volume, and the node returns to Ready.`},
{t:1, q:"DNS broken inside the cluster", d:`Pods can’t resolve Service names.`, c:`CoreDNS pods healthy, a test lookup from a busybox pod, NetworkPolicies allowing UDP/TCP 53, namespace in the name.`, e:`App in namespace <code>web</code> calls <code>db</code>, but the Service is in namespace <code>data</code>. Use <code>db.data.svc.cluster.local</code> and it resolves.`},
{t:1, q:"Two services can’t talk to each other", d:`Something between the pods blocks or misroutes the traffic.`, c:`Both pods Running and Ready, Service endpoints, NetworkPolicy, and with Istio, sidecar injection and mTLS policy.`, e:`A default-deny NetworkPolicy blocked traffic from <code>frontend</code> to <code>api</code>. Add a policy allowing ingress from pods labeled <code>app: frontend</code> on port 8080.`},
{q:"kubectl command reference", d:`The commands in the order you’d use them.`, x:`<pre><code>kubectl get pods -A -o wide           # status, node, IP
kubectl get pods --show-labels        # check labels vs Service selector
kubectl describe pod &lt;pod&gt;            # events, probes, scheduling
kubectl logs &lt;pod&gt; --previous         # last crash
kubectl logs &lt;pod&gt; -c &lt;container&gt;     # one container in the pod
kubectl exec -it &lt;pod&gt; -- /bin/sh     # shell in
kubectl get svc
kubectl get endpoints &lt;svc&gt;           # does the Service have pods?
kubectl run debug --image=busybox -it --rm -- sh   # test DNS/connectivity
kubectl get nodes
kubectl describe node &lt;node&gt;          # pressure conditions
kubectl top nodes / kubectl top pods
kubectl auth can-i delete pods
kubectl rollout status deployment/&lt;name&gt;
kubectl rollout undo deployment/&lt;name&gt;    # rollback
kubectl diff -f app.yaml              # preview before apply</code></pre>`},
]},

{id:"crashloop", title:"Scenario: CrashLoopBackOff", blurb:"Study the guide first, then practice the scenarios. The interviewer describes symptoms, you ask the questions, identify the problem, and explain how you will proceed.", items:[
{q:"What is CrashLoopBackOff?", d:`The container starts, crashes, and Kubernetes keeps restarting it. Each restart waits longer than the last (10s, 20s, 40s, up to 5 minutes). The key sign is that the container <strong>did start</strong> and the <strong>restart count keeps rising</strong>.`, e:`<code>kubectl get pods</code> shows <code>STATUS: CrashLoopBackOff</code> and <code>RESTARTS: 14</code>, going up every few minutes.`},
{q:"How will the interviewer describe it without naming it?", d:`<ul class="steps"><li>“The app keeps going up and down.”</li><li>“Since the release, users get errors on and off.”</li><li>“The pods show Running, then a few seconds later they’re not.”</li><li>“The restart count keeps climbing.”</li><li>“The deployment finished, but the new version never serves traffic.”</li></ul>`, e:`Words like <strong>restarting</strong>, <strong>up and down</strong>, or <strong>on and off</strong> are your first clue.`},
{q:"Which questions do I ask, in order?", d:`<ol class="steps"><li><strong>Status:</strong> “What does <code>kubectl get pods</code> show in STATUS and RESTARTS?”</li><li><strong>Started?</strong> “Did the container ever start, or did it never run?”</li><li><strong>Events:</strong> “What do the events say in <code>kubectl describe pod</code>?”</li><li><strong>Exit code:</strong> “What’s the Last State and exit code?”</li><li><strong>Logs:</strong> “What does <code>kubectl logs &lt;pod&gt; --previous</code> show?”</li><li><strong>Change:</strong> “What changed right before it started?”</li></ol>`, e:`Easy way to remember it: <strong>Status, Events, Exit code, Logs, Change.</strong> Use <code>--previous</code> because the current container just restarted and may have no logs yet.`},
{q:"How do I tell it apart from similar problems?", d:`<table class="mini"><tr><th>What you see</th><th>What it is</th></tr><tr><td>Restarts rising, “Back-off restarting failed container”</td><td><strong>CrashLoopBackOff</strong></td></tr><tr><td>Restarts 0, “Failed to pull image”</td><td>ImagePullBackOff</td></tr><tr><td>Restarts 0, “FailedScheduling”</td><td>Pending</td></tr><tr><td>Running, READY 0/1, restarts 0</td><td>Readiness failure</td></tr><tr><td>Restarts rising, “Liveness probe failed”</td><td>Liveness is killing it</td></tr><tr><td>Last State OOMKilled, exit 137</td><td>Out of memory</td></tr></table>`, e:`The two questions that separate them: <strong>did the container ever start</strong>, and <strong>is the restart count going up</strong>? Yes to both means a crash loop.`},
{q:"What do the exit codes mean?", d:`<ul class="steps"><li><strong>Exit 1:</strong> the application threw an error. Read the logs.</li><li><strong>Exit 137:</strong> the container was killed (SIGKILL). It can be OOMKilled or a failed liveness probe, so confirm the reason in Last State.</li><li><strong>Exit 139:</strong> segmentation fault inside the app.</li><li><strong>Exit 143:</strong> received a shutdown signal (SIGTERM).</li><li><strong>Exit 0:</strong> the app finished and exited. A web server should never do that, so the command or entrypoint is probably wrong.</li></ul>`, e:`Exit 137 plus “OOMKilled” in Last State means memory. Exit 137 plus “Liveness probe failed” in events means the probe.`},
{q:"How do I structure “how will you proceed”?", d:`<ol class="steps"><li><strong>Mitigate:</strong> if production is down, roll back first to restore users.</li><li><strong>Fix:</strong> correct the root cause.</li><li><strong>Verify:</strong> pods Running and Ready, restarts stop, the app actually answers.</li><li><strong>Prevent:</strong> a pipeline check, alert, or guardrail so it can’t happen again.</li><li><strong>Communicate:</strong> update the team and document it.</li></ol>`, e:`“I’d roll back to restore service, fix the missing variable, confirm the pods stay Ready, and add a pipeline check so a missing variable fails the deploy instead of production.”`},
{sc:1, q:"Scenario 1: Up and down after the release", open:`“Since this morning’s release, users say the app is up and down. What would you do?”`, steps:[
[`What does <code>kubectl get pods</code> show in STATUS and RESTARTS?`,`Some show Running, some show CrashLoopBackOff. Restarts are at 14 and climbing.`],
[`So the container starts and then dies. What’s the Last State and exit code in <code>describe pod</code>?`,`Terminated, exit code 1.`],
[`Exit 1 means an application error, not memory. What do the logs from the previous crash show?`,`<code>Error: DATABASE_URL is not set</code>`],
[`What changed in this release?`,`The new version added a database connection. The team updated the code but not the Kubernetes config.`]],
diag:`<strong>CrashLoopBackOff caused by a missing environment variable.</strong> The new version expects <code>DATABASE_URL</code>, but the ConfigMap/Secret wasn’t updated, so the app exits on startup.`,
proceed:`<ol class="steps"><li>Users are affected, so I’d first roll back with <code>kubectl rollout undo</code> or revert the commit in Git so Argo CD restores the last good version.</li><li>Add <code>DATABASE_URL</code> to the Secret and reference it in the Deployment.</li><li>Redeploy and verify: pods Ready, restarts stop at 0, the app responds.</li><li>Prevent it: add a pipeline check that validates required variables, and make the app fail with a clear message.</li><li>Update the team and document it.</li></ol>`},
{sc:1, q:"Scenario 2: New pods fail, old ones are fine", open:`“We deployed a new version of the orders service. The old pods are fine, but the new ones never come up. What do you check?”`, steps:[
[`What’s the STATUS and RESTARTS on the new pods?`,`CrashLoopBackOff, restarts at 6.`],
[`What’s the exit code?`,`Exit code 1.`],
[`What do the previous logs say?`,`<code>connection refused: postgres:5432</code>`],
[`Can other pods reach the database? And did anything change in networking?`,`The old pods connect fine. The new version is deployed in a new namespace, and there’s a default-deny NetworkPolicy there.`]],
diag:`<strong>CrashLoopBackOff caused by an unreachable dependency.</strong> The app can’t reach the database, so it exits. The NetworkPolicy blocks it, and the short name <code>postgres</code> only resolves inside the same namespace.`,
proceed:`<ol class="steps"><li>Old pods are still serving, so there’s no outage. I’d pause the rollout.</li><li>Test from the new namespace with a debug pod: <code>kubectl run debug --image=busybox -it --rm -- sh</code>, then <code>nc -zv postgres.data.svc.cluster.local 5432</code>.</li><li>Fix: use the full DNS name and add a NetworkPolicy allowing the orders pods to reach the database on 5432.</li><li>Verify pods Ready and orders working end to end.</li><li>Prevent: add connectivity checks to the release checklist, and make the app retry instead of crashing immediately.</li></ol>`},
{sc:1, q:"Scenario 3: Works, then dies under load", open:`“The app works fine in the morning, but during peak hours it keeps restarting. What’s going on?”`, steps:[
[`What do the pods show?`,`CrashLoopBackOff during peak, restarts increasing.`],
[`What’s the Last State and exit code?`,`Last State: Terminated. Reason: OOMKilled. Exit code 137.`],
[`What’s the memory limit, and what does usage look like?`,`Limit is 256Mi. <code>kubectl top pod</code> and Datadog show it climbing to around 400Mi at peak.`],
[`Does memory drop back after peak, or keep growing?`,`It drops back after peak. It’s steady during quiet hours.`]],
diag:`<strong>CrashLoopBackOff caused by OOMKilled.</strong> The container needs more memory than its 256Mi limit under load, so the kernel kills it (exit 137). Memory drops after peak, so it’s real demand, not a leak.`,
proceed:`<ol class="steps"><li>Raise the memory limit to fit real usage, for example 512Mi, and set the request close to normal usage.</li><li>Check the node has room, or let Karpenter/Cluster Autoscaler add capacity.</li><li>Consider HPA so more pods share the load at peak.</li><li>Verify no more OOMKilled during the next peak.</li><li>Prevent: alert when memory reaches 80% of the limit, and size limits from real metrics.</li></ol>`},
{sc:1, q:"Scenario 4: New Java service never comes up", open:`“We deployed a new Java service. It keeps restarting and never becomes available, but the developers say it runs fine on their laptops.”`, steps:[
[`What do the pods show?`,`Restarts climbing. It shows Running for a bit, then restarts.`],
[`What do the events say in <code>describe pod</code>?`,`<code>Liveness probe failed: connection refused</code>, then <code>Container will be restarted</code>.`],
[`What’s the exit code?`,`137.`],
[`How long does the app take to start, and what’s the probe setting?`,`The logs show it needs about 60 seconds to start. The liveness probe starts checking after 10 seconds and fails after 3 tries.`]],
diag:`<strong>CrashLoopBackOff caused by a liveness probe that’s too aggressive.</strong> Kubernetes kills the app (exit 137) before it finishes starting, so it never gets a chance to run.`,
proceed:`<ol class="steps"><li>Add a <code>startupProbe</code> that gives the app up to about 2 minutes to start. Liveness only begins after startup succeeds.</li><li>Keep a separate readiness probe so traffic only arrives when the app is ready.</li><li>Make sure the liveness probe checks only the app itself, not the database, so a dependency issue doesn’t cause restarts.</li><li>Verify the pods start once and stay up.</li><li>Prevent: a standard probe template for slow-starting apps.</li></ol>`},
{sc:1, q:"Scenario 5: Exits right away with no errors", open:`“We rebuilt the image with a new Dockerfile. The pod keeps restarting, but there are no errors in the logs.”`, steps:[
[`What do the pods show?`,`STATUS goes Completed, then CrashLoopBackOff. Restarts rising.`],
[`What’s the exit code?`,`Exit code 0.`],
[`Exit 0 means it finished normally. What do the logs show?`,`Just <code>Setup complete</code>, then nothing.`],
[`What changed in the Dockerfile?`,`The CMD now runs a setup script instead of starting the web server.`]],
diag:`<strong>CrashLoopBackOff caused by a wrong command.</strong> The container runs a script that finishes and exits (exit 0). A Deployment expects a long-running process, so Kubernetes keeps restarting it.`,
proceed:`<ol class="steps"><li>Fix the CMD/ENTRYPOINT so the web server runs in the foreground, for example running setup first, then starting the server.</li><li>If setup is a one-time task, move it to an initContainer or a Job.</li><li>Rebuild, redeploy, and verify the container stays Running.</li><li>Prevent: a CI smoke test that starts the container and checks it’s still running after 30 seconds.</li></ol>`},
{sc:1, q:"Scenario 6: Broke after security hardening", open:`“After the security team hardened our pods, one service keeps restarting. The others are fine.”`, steps:[
[`What do the pods show?`,`CrashLoopBackOff, restarts rising.`],
[`What’s the exit code?`,`Exit code 1.`],
[`What do the previous logs say?`,`<code>permission denied: /app/cache</code>`],
[`What did the hardening change?`,`The pods now run with <code>runAsNonRoot: true</code> and <code>readOnlyRootFilesystem: true</code>.`]],
diag:`<strong>CrashLoopBackOff caused by a permission problem.</strong> The app writes to <code>/app/cache</code>, but the root filesystem is now read-only and the user isn’t root, so it can’t write and exits.`,
proceed:`<ol class="steps"><li>Keep the hardening. Don’t roll back security.</li><li>Mount a writable <code>emptyDir</code> volume at <code>/app/cache</code>.</li><li>If needed, set <code>fsGroup</code> so the non-root user owns that path.</li><li>Verify the pod runs and the cache works.</li><li>Prevent: test hardened settings in staging first and document which paths each app needs to write.</li></ol>`},
]},

{id:"pending", title:"Scenario: Pending pods", blurb:"The pod was accepted but never started. Study the guide, then practice the scenarios with Status, Events, Capacity, Constraints, Volumes.", items:[
{q:"What does Pending mean?", d:`Kubernetes accepted the pod, but the scheduler can’t place it on any node, or it’s waiting for something like a volume. The container <strong>never started</strong>, so <strong>restarts stay at 0</strong>.`, e:`<code>kubectl get pods</code> shows <code>STATUS: Pending</code>, <code>RESTARTS: 0</code>, and the age keeps growing.`},
{q:"How will the interviewer describe it without naming it?", d:`<ul class="steps"><li>“We deployed, but nothing happens.”</li><li>“We scaled to 10 replicas, but only 6 are running.”</li><li>“The new pods have been waiting for 20 minutes.”</li><li>“We moved the app to a new node group and now it won’t start.”</li><li>“The database pod never comes up.”</li></ul>`, e:`Words like <strong>waiting</strong>, <strong>stuck</strong>, or <strong>only some are running</strong> point to Pending.`},
{q:"Which questions do I ask, in order?", d:`<ol class="steps"><li><strong>Status:</strong> “Is it Pending with 0 restarts?”</li><li><strong>Events:</strong> “What does the FailedScheduling event say in <code>kubectl describe pod</code>?”</li><li><strong>Capacity:</strong> “What are the pod’s CPU and memory requests, and how much room do the nodes have?”</li><li><strong>Constraints:</strong> “Are there nodeSelectors, affinity rules, or taints?”</li><li><strong>Volumes:</strong> “Does it use a PVC, and is it Bound?”</li><li><strong>Autoscaler:</strong> “Is Karpenter or Cluster Autoscaler adding nodes, or is it at its limit?”</li></ol>`, e:`The FailedScheduling message usually names the cause directly, so the events are the most important step.`},
{q:"What do the FailedScheduling messages mean?", d:`<table class="mini"><tr><th>Event message</th><th>Cause</th></tr><tr><td>Insufficient cpu / Insufficient memory</td><td>Requests bigger than free space on any node</td></tr><tr><td>had untolerated taint</td><td>Node is tainted, pod has no toleration</td></tr><tr><td>didn’t match Pod’s node affinity/selector</td><td>No node has the required label</td></tr><tr><td>unbound immediate PersistentVolumeClaims</td><td>PVC can’t get a volume</td></tr><tr><td>volume node affinity conflict</td><td>Volume is in a different AZ than the nodes</td></tr><tr><td>Too many pods</td><td>Node reached its max pods</td></tr></table>`, e:`<code>0/3 nodes are available: 3 Insufficient cpu</code> means every node is too full for this pod’s CPU request.`},
{q:"How do I tell Pending apart from similar states?", d:`<table class="mini"><tr><th>What you see</th><th>What it is</th></tr><tr><td>Pending, restarts 0, FailedScheduling</td><td><strong>Can’t be scheduled</strong></td></tr><tr><td>ContainerCreating for a long time</td><td>Scheduled, but volume, IP, or image setup is stuck</td></tr><tr><td>ImagePullBackOff, restarts 0</td><td>Scheduled, image can’t be pulled</td></tr><tr><td>CrashLoopBackOff, restarts rising</td><td>Started, then crashed</td></tr></table>`, e:`Pending means it never got a node. Everything else in this table already has one. <code>kubectl get pods -o wide</code> shows an empty NODE column for Pending pods.`},
{sc:1, q:"Scenario 1: Scaled up, but only some pods run", open:`“We scaled the API from 4 to 10 replicas for a big event. Only 6 are running. What do you check?”`, steps:[
[`What’s the status of the other 4, and their restart count?`,`Pending, 0 restarts.`],
[`What does the FailedScheduling event say?`,`<code>0/3 nodes are available: 3 Insufficient cpu.</code>`],
[`What does each pod request, and what do the pods actually use?`,`Each pod requests 2 CPU. Datadog shows they use about 300m.`],
[`Is the autoscaler adding nodes?`,`Cluster Autoscaler logs say the node group is already at its maximum size of 3.`]],
diag:`<strong>Pending because of insufficient CPU.</strong> The requests (2 CPU) are much larger than real usage (300m), so the nodes fill up on paper, and the autoscaler can’t add more nodes because it hit its max.`,
proceed:`<ol class="steps"><li>Mitigate for the event: raise the node group max (or the Karpenter NodePool limit) so new nodes come up.</li><li>Fix: lower the CPU request closer to real usage, for example 500m, so more pods fit per node.</li><li>Verify all 10 pods are Running and Ready.</li><li>Prevent: set requests from real metrics and alert when pods stay Pending more than 5 minutes.</li></ol>`},
{sc:1, q:"Scenario 2: Moved to a dedicated node group", open:`“We created a dedicated node group for the payments service. Since we moved it, the pods won’t start.”`, steps:[
[`What’s the pod status?`,`Pending, 0 restarts.`],
[`What does the event say?`,`<code>0/5 nodes are available: 2 node(s) had untolerated taint {dedicated: payments}, 3 node(s) didn’t match Pod’s node affinity/selector.</code>`],
[`How are the new nodes configured?`,`The new node group has the taint <code>dedicated=payments:NoSchedule</code> and the label <code>team=payments</code>.`],
[`And what does the Deployment have?`,`A nodeSelector for <code>team=payments</code>, but no toleration.`]],
diag:`<strong>Pending because of a taint without a matching toleration.</strong> The nodeSelector points the pods to the new nodes, but the taint blocks them, and the other nodes don’t have the label.`,
proceed:`<ol class="steps"><li>Add a toleration for <code>dedicated=payments:NoSchedule</code> to the Deployment, keeping the nodeSelector.</li><li>Redeploy and verify the pods land on the payments nodes with <code>kubectl get pods -o wide</code>.</li><li>Prevent: define the taint and toleration together in the same Terraform/Helm change, so one is never shipped without the other.</li></ol>`},
{sc:1, q:"Scenario 3: The database pod never comes up", open:`“We replaced our node group last night. This morning the database StatefulSet pod won’t start.”`, steps:[
[`What’s the pod status?`,`Pending, 0 restarts.`],
[`What does the event say?`,`<code>1 node(s) had volume node affinity conflict.</code>`],
[`Which AZ is the EBS volume in, and which AZs are the new nodes in?`,`The volume is in us-east-1a. The new node group only has nodes in us-east-1b.`],
[`Is the PVC Bound?`,`Yes, it’s Bound to the existing volume.`]],
diag:`<strong>Pending because of an AZ mismatch.</strong> EBS volumes live in one Availability Zone. The pod must run in us-east-1a to attach it, but there are no nodes there anymore.`,
proceed:`<ol class="steps"><li>Mitigate: add nodes in us-east-1a (update the node group subnets, or let Karpenter provision in that AZ).</li><li>Verify the pod schedules in 1a, attaches the volume, and the database is healthy.</li><li>Prevent: always keep node groups across all AZs that hold volumes, and use a StorageClass with <code>volumeBindingMode: WaitForFirstConsumer</code> for new volumes.</li><li>Document it in the node group replacement runbook.</li></ol>`},
{sc:1, q:"Scenario 4: Stuck in ContainerCreating on EKS", open:`“Pods are scheduled on nodes, but they’ve been in ContainerCreating for 15 minutes. It only happens on our busiest nodes.”`, steps:[
[`So they have a node, but the container isn’t created. What do the events say?`,`<code>failed to assign an IP address to container</code>.`],
[`How many pods run on those nodes, and what instance type are they?`,`About 29 pods on t3.medium nodes.`],
[`How many free IPs are left in the node subnets?`,`The private subnets are almost out of IP addresses.`]],
diag:`<strong>IP address exhaustion with the VPC CNI.</strong> On EKS every pod gets a real VPC IP. The node reached its IP limit and the subnet has almost none left, so new pods can’t get an address.`,
proceed:`<ol class="steps"><li>Mitigate: move some load to less busy nodes, or use a larger instance type that supports more IPs.</li><li>Fix: enable prefix delegation on the VPC CNI, and add larger subnets or a secondary CIDR for pods.</li><li>Verify pods get IPs and reach Running.</li><li>Prevent: alert on free IPs per subnet, and plan subnet sizes in Terraform for pod growth.</li></ol>`},
]},
{id:"imagepull", title:"Scenario: ImagePullBackOff", blurb:"The pod has a node, but the image can’t be downloaded. Study the guide, then practice: read the exact error, check the tag, the permissions, and the network path.", items:[
{q:"What does ImagePullBackOff mean?", d:`The kubelet on the node tried to pull the image and failed. It first shows <code>ErrImagePull</code>, then <code>ImagePullBackOff</code> while it waits to retry. The container <strong>never started</strong>, so <strong>restarts stay at 0</strong>.`, e:`<code>kubectl get pods</code> shows <code>ImagePullBackOff</code>, restarts 0, and the old version keeps running during a rollout.`},
{q:"How will the interviewer describe it without naming it?", d:`<ul class="steps"><li>“The deployment is stuck. The new version never rolls out.”</li><li>“The old pods are still running, but the new ones won’t start.”</li><li>“It works in dev, but not in the prod account.”</li><li>“Our new cluster can’t start anything.”</li><li>“It worked yesterday, now all new pods fail.”</li></ul>`, e:`<strong>New pods only</strong>, <strong>new cluster</strong>, or <strong>new account</strong> are strong hints of an image pull problem.`},
{q:"Which questions do I ask, in order?", d:`<ol class="steps"><li><strong>Status:</strong> “Is it ErrImagePull or ImagePullBackOff with 0 restarts?”</li><li><strong>Exact error:</strong> “What does the event in <code>kubectl describe pod</code> say, word for word?”</li><li><strong>Name and tag:</strong> “What’s the exact image reference, and does that tag exist in the registry?”</li><li><strong>Permissions:</strong> “Can the node role pull from that repository? Is it another account?”</li><li><strong>Network:</strong> “Can the nodes reach the registry? Private subnets, NAT, VPC endpoints?”</li></ol>`, e:`The exact error message tells you which of the last three it is, so always ask for it word for word.`},
